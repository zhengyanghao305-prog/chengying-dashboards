<!DOCTYPE html>
<!-- BI 承接优化板块 v4.1 ── 动作决策 + 批量复制/处理 + 收敛数据窗口
     数据来源：data/feishu_bi.json（飞书 BI商品数据表，商品id=链接id，3506链接×滚动7天窗口）
     新增：清单行多选 → 批量复制链接URL/ID、批量标记处理状态；数据窗口收敛为下拉选择
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/echarts.min.js?v=202609040933"></script>
<script src="js/xlsx.full.min.js?v=202609040933"></script>
<title>BI 承接 · 亏损处理中心（合并预览 v5）</title>
<style>
  :root{
    --bg-page:#f5f6f7; --bg-card:#ffffff; --bg-tag:#f0f2f5;
    --text-primary:#1a1a2e; --text-secondary:#666e7a; --text-tertiary:#9ba3af;
    --border:#e4e7ec;
    --accent-blue:#3b82f6; --accent-green:#10b981; --accent-amber:#f59e0b;
    --accent-red:#ef4444; --accent-purple:#8b5cf6; --accent-cyan:#06b6d4;
    --radius-sm:6px; --radius-md:12px; --radius-lg:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
    background:var(--bg-page);color:var(--text-primary);min-height:100vh;padding:20px 28px 60px;}
  a{color:var(--accent-blue);text-decoration:none;}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-secondary);
    padding:7px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);}
  .back:hover{color:var(--text-primary);}
  .head{display:flex;align-items:center;gap:14px;background:var(--bg-card);border:1px solid var(--border);
    border-left:4px solid var(--accent-purple);border-radius:var(--radius-md);padding:13px 22px;margin-bottom:6px;flex-wrap:wrap;}
  .head-icon{font-size:26px;}
  .head-title{font-size:18px;font-weight:700;}
  .head-sub{font-size:12.5px;color:var(--text-secondary);margin-top:3px;line-height:1.5;}
  .head-badge{margin-left:auto;font-size:12px;padding:4px 12px;border-radius:12px;background:#ede9fe;color:#6d28d9;font-weight:500;white-space:nowrap;}

  /* ── 控制条（数据窗口收敛为下拉）── */
  .controlbar{display:flex;align-items:center;gap:12px;background:var(--bg-card);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:9px 16px;margin:8px 0 14px;flex-wrap:wrap;}
  .controlbar .lab{font-size:12.5px;color:var(--text-secondary);font-weight:600;white-space:nowrap;}
  .win-select{font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text-primary);cursor:pointer;}
  .win-select:focus{outline:none;border-color:var(--accent-purple);}
  .win-tag{font-size:12px;color:#6d28d9;background:#ede9fe;padding:3px 10px;border-radius:10px;font-weight:600;}
  .win-scope{font-size:11.5px;color:var(--text-tertiary);}
  .win-scope b{color:var(--text-secondary);}
  .controlbar .sp{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .platbox{display:flex;gap:6px;}
  .platbox button{border:1px solid var(--border);background:#fff;padding:5px 13px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;border-radius:14px;transition:all .12s;}
  .platbox button:hover{color:var(--text-primary);border-color:var(--accent-cyan);}
  .platbox button.active{background:var(--accent-cyan);color:#fff;border-color:var(--accent-cyan);font-weight:600;}
  .dlbtn{border:1px solid #6d28d9;background:#7c3aed;color:#fff;border-radius:var(--radius-sm);padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s;}
  .dlbtn:hover{background:#6d28d9;}

  .note{font-size:12px;color:var(--text-tertiary);margin:2px 2px 12px;line-height:1.7;}
  .note b{color:var(--text-secondary);}

  .ov{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:4px 0 6px;}
  @media(max-width:900px){.ov{grid-template-columns:repeat(2,1fr);}}
  .ov-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 15px;}
  .ov-card .v{font-size:22px;font-weight:800;line-height:1.1;}
  .ov-card .k{font-size:11.5px;color:var(--text-tertiary);margin-top:4px;}
  .ov-card .d{font-size:11px;margin-top:3px;}
  .ov-loss .v{color:var(--accent-red);} .ov-pro .v{color:var(--accent-green);}
  .ov-scale .v{color:#0ea5e9;} .ov-plan .v{color:var(--accent-blue);}

  .section-title{font-size:15px;font-weight:700;margin:18px 2px 10px;display:flex;align-items:center;gap:8px;}
  .section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-purple);}
  .section-title .hint{font-size:12px;color:var(--text-tertiary);font-weight:400;margin-left:6px;}

  /* ── 动作分类卡 ── */
  .action-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin:0 0 12px;}
  .as-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 13px;cursor:pointer;transition:all .15s;border-top:3px solid var(--text-tertiary);}
  .as-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .as-card.sel{background:#f5f3ff;border-color:#c4b5fd;}
  .as-card .av{font-size:19px;font-weight:800;}
  .as-card .ak{font-size:11.5px;color:var(--text-secondary);margin-top:2px;}
  /* 金额档位子筛 */
  .amtbar{display:flex;align-items:center;gap:7px;padding:8px 16px;background:#faf9ff;border-bottom:1px solid #e9e5f7;flex-wrap:wrap;}
  .amtbar .lab{font-size:11.5px;color:var(--text-tertiary);font-weight:600;}
  .amt-chip{border:1px solid var(--border);background:#fff;padding:4px 11px;font-size:11.5px;color:var(--text-secondary);cursor:pointer;border-radius:12px;transition:all .12s;}
  .amt-chip:hover{color:var(--text-primary);border-color:var(--accent-purple);}
  .amt-chip.active{background:var(--accent-purple);color:#fff;border-color:var(--accent-purple);font-weight:600;}
  .amt-chip .n{font-size:10px;opacity:.85;margin-left:3px;}
  .amt-chip.disable{opacity:.45;cursor:not-allowed;}
  .as-del{border-top-color:#ef4444;} .as-del .av{color:#ef4444;}
  .as-stop{border-top-color:#f97316;} .as-stop .av{color:#f97316;}
  .as-fix{border-top-color:#eab308;} .as-fix .av{color:#ca8a04;}
  .as-price{border-top-color:#8b5cf6;} .as-price .av{color:#8b5cf6;}
  .as-struct{border-top-color:#06b6d4;} .as-struct .av{color:#0891b2;}
  .as-watch{border-top-color:#10b981;} .as-watch .av{color:#10b981;}

  /* ── 列表容器 ── */
  .listcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-top:4px;}
  .listhead{display:flex;align-items:center;gap:8px;padding:9px 16px;background:#fafbfc;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;flex-wrap:wrap;}
  .listhead .lsub{margin-left:auto;font-size:11.5px;color:var(--text-tertiary);font-weight:400;}
  .ltable{max-height:620px;overflow:auto;}

  /* ── 批量工具条 ── */
  .batchbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#f5f3ff;border-bottom:1px solid #ddd6fe;flex-wrap:wrap;font-size:12px;}
  .batchbar .cnt{font-weight:800;color:#6d28d9;}
  .bbtn{border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:5px 11px;font-size:12px;cursor:pointer;color:var(--text-secondary);transition:all .12s;white-space:nowrap;}
  .bbtn:hover{border-color:var(--accent-purple);color:#6d28d9;}
  .bbtn.primary{background:#7c3aed;color:#fff;border-color:#7c3aed;font-weight:600;}
  .bbtn.primary:hover{background:#6d28d9;}
  .bbtn:disabled{opacity:.5;cursor:not-allowed;}
  .bselect{padding:4px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;background:#fff;}
  .toast-msg{font-size:11.5px;color:#059669;font-weight:600;}

  /* ── 数据表行（含勾选列）── */
  .lrow{display:block;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
  .lrow:hover{background:var(--bg-tag);}
  .lrow.sel{background:#eef2ff;}
  .lrow.expanded{background:#f5f3ff;}
  /* 卡片式行 */
  .r-top{display:flex;align-items:center;gap:12px;}
  .r-title{flex:1 1 26%;min-width:0;}
  .r-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .r-meta{font-size:11px;color:var(--text-tertiary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .r-meta b{color:#7c3aed;font-weight:600;}
  .r-metrics{display:flex;gap:18px;align-items:center;margin-left:8px;}
  .metric{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;}
  .metric .k{font-size:10px;color:var(--text-tertiary);line-height:1.2;}
  .metric .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3;}
  .r-side{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .r-why{margin-top:7px;font-size:11px;color:#44495a;background:#f6f7fb;border:1px solid #ececf1;border-radius:8px;padding:6px 10px;line-height:1.6;}
  .r-why .wico{color:#7c3aed;}
  .chk{width:15px;height:15px;accent-color:#7c3aed;cursor:pointer;flex-shrink:0;}
  .lname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lid{font-size:11px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;}
  .neg{color:var(--accent-red);} .pos{color:var(--accent-green);}
  .act-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap;text-align:center;flex-shrink:0;}
  .chip-del{background:#fee2e2;color:#b91c1c;} .chip-stop{background:#ffedd5;color:#c2410c;}
  .chip-fix{background:#fef9c3;color:#a16207;} .chip-price{background:#ede9fe;color:#6d28d9;}
  .chip-struct{background:#cffafe;color:#0e7490;} .chip-watch{background:#dcfce7;color:#15803d;}
  /* bucket 快捷入口 */
  .bcell.special{background:#faf9ff;border:1px dashed #c4b5fd;flex-direction:column;align-items:stretch;margin-bottom:4px;}
  .bcell.special .bdelta{font-size:10px;}
  .bcell.special:hover{background:#f3f0ff;border-style:solid;}
  .chip-scale{background:#dcfce7;color:#15803d;} .chip-prio{background:#ede9fe;color:#6d28d9;}
  .chip-roi2{background:#fef9c3;color:#a16207;} .chip-care{background:#ffe4e6;color:#be123c;}
  .chip-keep{background:#f3f4f6;color:#6b7280;}
  .lrec .why{font-size:10.5px;color:var(--text-tertiary);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px;}
  .chip-all{background:#f3f4f6;color:#374151;}
  .why{font-size:11px;color:var(--text-tertiary);line-height:1.45;}
  .roi-neg{color:var(--accent-red);font-weight:600;} .roi-ok{color:var(--accent-green);}
  .ltrend{font-size:12px;font-weight:600;}
  .trend-up{color:var(--accent-green);} .trend-down{color:var(--accent-red);} .trend-flat{color:var(--text-tertiary);}
  .trendbox{padding:10px 16px 16px;background:#faf9ff;border-bottom:1px solid var(--border);display:none;}
  .trendbox.open{display:block;}
  .trendbox .chart{width:100%;height:185px;}
  .trendbox .tlab{font-size:11.5px;color:var(--text-secondary);margin-bottom:4px;}
  .ostate{display:inline-flex;border-radius:10px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap;justify-self:end;}
  .ostate.todo{background:#fef3c7;color:#b45309;} .ostate.doing{background:#dbeafe;color:#1d4ed8;} .ostate.done{background:#dcfce7;color:#15803d;}
  .ostate.stopped{background:#fee2e2;color:#b91c1c;} .ostate.skipped{background:#f3f4f6;color:#6b7280;}

  /* ── 分档卡片 ── */
  .bucket-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:1100px){.bucket-grid{grid-template-columns:1fr;}}
  .bucket-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
  .bucket-card .bhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;}
  .bucket-card .bhead .bcnt{margin-left:auto;font-size:12px;color:var(--text-tertiary);font-weight:400;}
  .buckets{padding:7px;}
  .bcell{display:flex;flex-direction:column;gap:3px;padding:7px 9px;border-radius:var(--radius-sm);cursor:pointer;transition:background .12s;border:1px solid transparent;}
  .bcell:hover{background:var(--bg-tag);}
  .bcell.sel{background:#f5f3ff;border-color:#ddd6fe;}
  .brow{display:flex;align-items:center;gap:8px;width:100%;}
  .bcell .bname{font-size:12px;color:var(--text-secondary);}
  .bcell .bval{font-size:14px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums;}
  .bcell .bamt{font-size:10.5px;color:var(--text-tertiary);min-width:58px;text-align:right;font-variant-numeric:tabular-nums;}
  .bdelta{font-size:10.5px;display:inline-flex;align-items:center;gap:2px;}
  .bdelta .sep{color:var(--text-tertiary);}
  .bdelta.good{color:#15803d;} .bdelta.bad{color:#b91c1c;} .bdelta.zero{color:var(--text-tertiary);}
  .bdelta .lab{color:var(--text-tertiary);font-size:9.5px;}
  .bzero .bval{color:var(--text-tertiary);} .bzero{cursor:default;} .bzero:hover{background:transparent;}
  .loss-b .bval{color:var(--accent-red);} .pro-b .bval{color:var(--accent-green);} .sale-b .bval{color:var(--accent-blue);}
  .bcomp{font-size:10.5px;font-weight:600;margin-left:auto;padding:2px 8px;border-radius:9px;background:var(--bg-tag);}
  .bcomp.up{color:#15803d;background:#dcfce7;} .bcomp.down{color:#b91c1c;background:#fee2e2;} .bcomp.flat{color:#9ca3af;background:#f3f4f6;}

  /* ── 产品折叠 ── */
  .pgroup{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;overflow:hidden;}
  .pgroup .ghead{display:flex;align-items:center;gap:10px;padding:10px 15px;cursor:pointer;font-size:13px;font-weight:600;transition:background .12s;}
  .pgroup .ghead:hover{background:var(--bg-tag);}
  .pgroup .ghead .gcnt{font-size:11.5px;color:var(--text-tertiary);font-weight:400;}
  .pgroup .ghead .gsum{margin-left:auto;display:flex;gap:12px;font-size:11.5px;align-items:center;}
  .pgroup .ghead .arrow{transition:transform .15s;color:var(--text-tertiary);}
  .pgroup.open .ghead .arrow{transform:rotate(90deg);}
  .pbody{max-height:560px;overflow:auto;border-top:1px solid var(--border);display:none;}
  .pgroup.open .pbody{display:block;}

  .empty{padding:24px;text-align:center;color:var(--text-tertiary);font-size:13px;}
  .loading{padding:40px;text-align:center;color:var(--text-tertiary);font-size:14px;}
  .err{padding:18px;color:var(--accent-red);background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius-sm);}
  .pager{display:flex;gap:10px;align-items:center;justify-content:center;padding:9px;font-size:12px;color:var(--text-secondary);}
  .pager button{border:1px solid var(--border);background:#fff;padding:4px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;}
</style>
</head>
<body>
  <div class="topbar"><a class="back" href="index.html">← 返回工作台</a></div>
  <div class="head">
    <div class="head-icon">🎯</div>
    <div>
      <div class="head-title">BI 承接 · 亏损处理中心 <span style="font-size:12px;color:#6d28d9;background:#ede9fe;padding:2px 8px;border-radius:8px">合并版·预览</span></div>
      <div class="head-sub">按「利润/销售/ROI/毛利/趋势」自动归类：停推广下架 / 停推广 / 提投产 / 提价 / 查成本</div>
    </div>
    <span class="head-badge">v5 合并预览 · 亏损动作×档位 / 盈利销售额分层</span>
  </div>

  <div class="controlbar">
    <span class="lab">平台</span>
    <div class="platbox" id="platBox">
      <button data-plat="all">全平台</button><button data-plat="天猫">天猫</button><button data-plat="拼多多">拼多多</button>
    </div>
    <span class="lab" style="margin-left:14px">数据窗口</span>
    <select class="win-select" id="winSel" title="所选平台下各近7天快照窗口的链接数，最新=当前数据"></select>
    <span class="win-scope" id="winScope"></span>
    <span class="sp">
      <button class="dlbtn" id="dlBtn">⬇ 下载运营执行清单 Excel</button>
      <span class="win-tag" id="winTag"></span>
    </span>
  </div>

  <div class="note">
    上方窗口是<b>「近7天滚动快照」</b>：平台每天拍一张，最新一张即当前要处理的数据（默认已选中）。
    回看更早快照可对比趋势；单个链接点行展开也能直接看走势。勾选行后可<b>批量复制链接、批量标记处理状态</b>。
  </div>

  <div class="ov" id="ovHost"></div>

  <div class="section-title"><span class="dot"></span>BI 分档卡片 · 点击档位 → 该档全部链接 + 每条的动作建议<span class="hint" id="bucketHint"></span></div>
  <div class="bucket-grid" id="bucketHost"></div>
  <div id="drillHost"></div>

  <div class="section-title"><span class="dot"></span>按产品回看<span class="hint">看亏损/盈利集中在哪些产品，展开定位链接与建议</span></div>
  <div id="prodHost"></div>

<script>
const CONFIG = {
  loss:[[0,100,'≤100元'],[100,200,'100-200'],[200,500,'200-500'],[500,1000,'500-1000'],[1000,Infinity,'>1000']],
  profit:[[0,100,'≤100元'],[100,200,'100-200'],[200,500,'200-500'],[500,1000,'500-1000'],[1000,Infinity,'>1000']],
  sales:[[0,1000,'<1k'],[1000,3000,'1-3k'],[3000,9000,'3-9k'],[9000,30000,'9-30k'],[30000,Infinity,'>30k']],
  dec:{ noSale:5, roiBad:0.6, roiBreakEven:1.1, worsen:-5, improving:15 }
};
const PLAN_KEY='bi_digest_plan_v4';
const STATE_OPTS=['待处理','已停推广','已下架','已提投产','已提价','已完成','不处理'];
let PLAN={};
let DATA={rows:[],windows:[],winRowsMap:{}};
let WIN='', PLAT='all', ACT='all', AMT='all', DACT='all', SELECTED=new Set(), SEL_POOL='action';
let PAGE=0, DRILL_PAGE=0, BUCKET=null;

function toNum(v){ if(v===null||v===undefined||v==='')return 0; if(typeof v==='number')return v; return parseFloat(String(v).replace(/[%,¥\s]/g,''))||0; }
function toDate(s){ return s?String(s).slice(0,10):''; }
function fmtMoney(v){ if(v===null||v===undefined||isNaN(v))return '—'; const a=Math.abs(v); if(a>=10000)return (v/10000).toFixed(1)+'万'; return v.toLocaleString('zh-CN',{maximumFractionDigits:0}); }
function fmtPct(v){ if(v===null||v===undefined||v==='')return '—'; const s=String(v); if(s.includes('%'))return s; const n=parseFloat(s); return isNaN(n)?s:(Math.round(n*100)/100)+'%'; }
function shortTitle(t){ if(!t)return''; return t.length>15?t.slice(0,15)+'…':t; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stateLabel(s){ return s==='todo'?'待处理':(s==='doing'?'处理中':STATE_OPTS.includes(s)?s:'待处理'); }
function stateCls(s){
  const m={'todo':'todo','doing':'doing','done':'done','待处理':'todo','处理中':'doing','已完成':'done',
           '已停推广':'stopped','已下架':'done','已提投产':'doing','已提价':'doing','不处理':'skipped'};
  return m[s]||'todo';
}

function buildDedup(rows){

  rows.forEach(r=>{
    const k=r.link_id+'|'+r.window, p=toNum(r.profit_pay), s=toNum(r.net_pay);
    const roi=toNum(r.roi), gm=toNum(r.gm);
    let a=map.get(k);
    if(!a){ a={link_id:r.link_id,window:r.window,window_end:r.window_end,product:r.product||'',title:r.title||'',platform:r.platform||'',shop:r.shop||'',owner:r.owner||'',gmTxt:r.gm,p,s,roiV:(roi>0&&roi<10)?roi:0,gmV:gm,n:1}; map.set(k,a); }
    else { a.p+=p; a.s+=s; a.n++; if(!(a.roiV>0)&&roi>0&&roi<10)a.roiV=roi; if(!a.gmV&&gm!==0)a.gmV=gm; }
  });
  return [...map.values()];
}
function linkSeries(id){ const arr=DATA.rows.filter(r=>r.link_id===id); if(!arr.length)return[]; const m=new Map(); arr.forEach(r=>{const d=toDate(r.window_end); m.set(d,(m.get(d)||0)+r.p);}); return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0])); }
function trendDelta(id){ const s=linkSeries(id); if(s.length<2)return 0; const n=s.length; const ea=s.slice(0,Math.min(3,n)).reduce((a,x)=>a+x[1],0)/Math.min(3,n); const la=s.slice(Math.max(0,n-3)).reduce((a,x)=>a+x[1],0)/Math.min(3,n); return Math.round((la-ea)*10)/10; }
function platUrl(platform,id){ return platform==='拼多多'?'https://mobile.yangkeduo.com/goods.html?goods_id='+id:'https://item.taobao.com/item.htm?id='+id; }

function classifyAction(r){
  const {noSale,roiBad,roiBreakEven,worsen,improving}=CONFIG.dec;
  const p=r.p,s=r.s,roi=r.roiV,gm=r.gmV,d=trendDelta(r.link_id);

  if(p<0&&roi<roiBad){ if(d<worsen)return{k:'A_stop',act:'停推广',why:'ROI '+roi.toFixed(2)+' 空烧且亏损扩大('+d+'元/窗)'}; return{k:'B_fix',act:'砍花费/提投产',why:'ROI '+roi.toFixed(2)+'<0.6，先压花费控损'}; }
  if(p<0){ if(d>improving)return{k:'E_watch',act:'再观察',why:'亏损收窄(+'+d+'元/窗)，暂缓动作'};
    if(roi<roiBreakEven)return{k:'B_fix',act:'提投产',why:'ROI '+roi.toFixed(2)+' 接近保本，调词/压单价提转化即转正'};
    if(gm<0)return{k:'C_price',act:'提价/去优惠',why:'毛利率 '+fmtPct(r.gmTxt)+' 倒挂，毛利负'};
    return{k:'D_struct',act:'查成本/退款/费用',why:'ROI '+roi.toFixed(2)+'>1 仍亏，查货品/运费/退款'}; }
  return{k:'F_keep',act:'观察',why:'窗口未亏'};
}

/* ============ 统一动作建议引擎（亏/盈/销售档通用）============
   目标：利润额 × 利润率 最大化 —— 亏损链接止损动作；盈利链接判断可放大/先提毛利/提投产 */
const REC_META={
  A_del:{cls:'chip-del'}, A_stop:{cls:'chip-stop'}, B_fix:{cls:'chip-fix'},
  C_price:{cls:'chip-price'}, D_struct:{cls:'chip-struct'}, E_watch:{cls:'chip-watch'},
  G_scale:{cls:'chip-scale'}, G_prio:{cls:'chip-prio'}, G_roi:{cls:'chip-roi2'},
  G_care:{cls:'chip-care'}, G_keep:{cls:'chip-keep'}
};
function classifyRec(r){
  const {noSale,roiBad,roiBreakEven,worsen,improving}=CONFIG.dec;
  const p=r.p,s=r.s,roi=r.roiV,gm=r.gmV,d=trendDelta(r.link_id);
  const gmt=fmtPct(r.gmTxt);
  if(p<0){  // 亏损：先止损/止血
    if(s<noSale) return {k:'A_del',act:'停推广并下架',why:'近7天净成交≈0(净销'+Math.round(s)+')仍亏'+Math.round(p)+'元 → 纯空烧/退款倒挂，先停推广并评估下架'};
    if(roi<roiBad){
      if(d<worsen) return {k:'A_stop',act:'停推广',why:'ROI '+roi.toFixed(2)+'<0.6 且亏损扩大('+d+'元/窗) → 直接停，止损'};
      return {k:'B_fix',act:'砍花费/提投产',why:'ROI '+roi.toFixed(2)+'<0.6 投放效率差 → 先压花费控损再提投产'};
    }
    if(d>improving) return {k:'E_watch',act:'观察(亏损收窄)',why:'亏损收窄(+'+d+'元/窗) → 暂缓动作，下周复查'};
    if(roi<roiBreakEven) return {k:'B_fix',act:'提投产',why:'ROI '+roi.toFixed(2)+' 接近保本线、毛利率 '+gmt+' → 调词/压单价把ROI拉过保本即转正'};
    if(gm<0) return {k:'C_price',act:'提价/去优惠',why:'毛利率 '+gmt+' 倒挂(ROI '+roi.toFixed(2)+') → 提价/去掉过度优惠，先止血'};
    return {k:'D_struct',act:'查成本/退款',why:'ROI '+roi.toFixed(2)+'>1 仍亏、毛利率 '+gmt+' → 问题在货品成本/运费/退款率'};
  }
  if(p===0) return {k:'G_keep',act:'观察',why:'近7天无利润贡献，先观察'};
  // 盈利：以利润额×利润率最大化给动作
  if(d<-10) return {k:'G_care',act:'利润下滑·排查',why:'利润由 +'+Math.round(p-d)+' 跌到 +'+Math.round(p)+'('+d+'元/窗) → 查退款/价格竞争/流量下滑'};
  if(roi>=1.8&&gm>=8&&d>-15) return {k:'G_scale',act:'放大扩量',why:'ROI '+roi.toFixed(2)+'、毛利率 '+gmt+' 健康，窗口利润 +'+Math.round(p)+'元 → 可加预算/小幅提价放大利润额'};
  if(roi>=1.8&&gm<8) return {k:'G_prio',act:'先提毛利再放大',why:'ROI '+roi.toFixed(2)+' 好但毛利率仅 '+gmt+' → 先提价/去低价SKU拉毛利，再放量利润额才最大化'};
  if(roi>=1.2) return {k:'G_roi',act:'提投产放利润',why:'ROI '+roi.toFixed(2)+' 盈利但一般、毛利率 '+gmt+' → 优化词/转化把利润额做大，可小幅加预算试'};
  return {k:'G_keep',act:'保持',why:'ROI '+roi.toFixed(2)+' 偏低但尚盈利、毛利率 '+gmt+' → 控费观察，预算优先给高ROI链接'};
}

  });
}

function toggleTrend(row){
  const box=row.nextElementSibling;

  const scope=row.closest('.ltable');

function actHeader(){ return '<div class="arow head"><input type="checkbox" class="chk-head" data-b="headAll"><div>商品标题</div><div>平台/链接id</div><div style="text-align:right">亏损</div><div style="text-align:right">净销售</div><div style="text-align:right">ROI</div><div style="text-align:right">趋势</div><div>建议动作 · 依据</div><div style="text-align:right">处理</div></div>'; }

    html+='<div class="as-card as-'+ak+' '+(ACT===ak?'sel':'')+'" data-ak="'+ak+'"><div class="av">'+n+'</div><div class="ak">'+lab+' · '+tip+'</div></div>';
  });
  html+='<div class="as-card '+(ACT==='all'?'sel':'')+'" data-ak="all"><div class="av">'+Object.values(counts).reduce((a,b)=>a+b,0)+'</div><div class="ak">全部亏损</div></div>';

function amtCountsAll(){

}
function amtBarHTML(){

  CONFIG.loss.forEach((b,i)=>{ h+='<span class="amt-chip '+(AMT===String(i)?'active':'')+(c[i]?'':' disable')+'" data-am="'+i+'">'+b[2]+'<span class="n">'+(c[i]||0)+'</span></span>'; });

  card.querySelectorAll('.amt-chip').forEach(ch=>{ ch.addEventListener('click',()=>{ if(ch.classList.contains('disable'))return; AMT=ch.dataset.am; PAGE=0; SELECTED.clear(); renderActionList(); }); });

  const sum=host.querySelector('.action-summary'); host.insertBefore(sum,host.querySelector('.listcard'));

/* ---------- 分档/下钻/产品（共享批量） ---------- */
function bucketOf(rows){
  const loss=[],profit=[],sales=rows.slice();
  rows.forEach(r=>{ if(r.p<0)loss.push(r); else if(r.p>0)profit.push(r); });
  const group=(arr,b)=>{ const res=b.map(x=>({name:x[2],lo:x[0],hi:x[1],list:[],amt:0})); arr.forEach(r=>{const v=Math.abs(r.p); for(const c of res){if(v>=c.lo&&v<c.hi){c.list.push(r);c.amt+=r.p;break;}}}); return res; };
  const groupSales=(b)=>{ const res=b.map(x=>({name:x[2],lo:x[0],hi:x[1],list:[],amt:0})); rows.forEach(r=>{for(const c of res){if(r.s>=c.lo&&r.s<c.hi){c.list.push(r);c.amt+=r.s;break;}}}); return res; };
  return {loss:group(loss,CONFIG.loss),profit:group(profit,CONFIG.profit),sales:groupSales(CONFIG.sales)};
}
function prevWindow(){ const i=DATA.windows.indexOf(WIN); return i>0?DATA.windows[i-1]:null; }
function diffBadge(diff,goodWhenUp){
  if(diff===0) return '<span class="bdelta zero"><span class="lab">较上期</span> → 持平</span>';
  const up=diff>0, good=goodWhenUp?up:!up;
  return '<span class="bdelta '+(good?'good':'bad')+'"><span class="lab">较上期</span>'+(up?'▲ +':'▼ ')+Math.abs(diff)+'</span>';
}
function compChip(cur,prev,goodWhenUp){
  if(prev===null) return '';
  const diff=cur-prev;
  if(diff===0) return '<span class="bcomp flat">较上期 →</span>';
  const up=diff>0, good=goodWhenUp?up:!up;
  return '<span class="bcomp '+(good?'up':'down')+'">较上期 '+(up?'▲ +':'▼ ')+Math.abs(diff)+'</span>';
}
function renderBuckets(){
  const rows=platRows(), B=bucketOf(rows);
  // 上一期 = 所选窗口的上一张快照（同平台口径），保证动态随 平台+窗口 变化
  const wi=DATA.windows.indexOf(WIN);
  const pw=wi>0?DATA.windows[wi-1]:null;
  let PB=null;
  if(pw){ const pr=(DATA.winRowsMap[pw]||[]).filter(r=>PLAT==='all'||r.platform===PLAT); PB=bucketOf(pr); }
  const block=(key,dot,goodWhenUp,cells,total,extra)=>{
    const prevTotal=PB?PB[key].reduce((a,b)=>a+b.list.length,0):null;
    let inner=extra||'';
    cells.forEach((c,i)=>{
      const sel=BUCKET&&BUCKET.g===key&&BUCKET.i===i;
      const cls=c.list.length?('bcell '+(sel?'sel ':'')+(key==='loss'?'loss-b':key==='profit'?'pro-b':'sale-b')):'bcell bzero';
      const amt=key==='sales'?'':(key==='loss'?'亏 '+fmtMoney(c.amt):'盈 +'+fmtMoney(c.amt));
      const pc=PB?PB[key][i]:null, diff=(pc!==null)?c.list.length-pc.list.length:null;
      inner+='<div class="'+cls+'" data-g="'+key+'" data-i="'+i+'" data-cnt="'+c.list.length+'">'
        +'<div class="brow"><span class="bname">'+c.name+'</span><span class="bval">'+c.list.length+'</span>'+(c.list.length?'<span class="bamt">'+amt+'</span>':'')+'</div>'
        +(c.list.length&&diff!==null?diffBadge(diff,goodWhenUp):'')
        +'</div>';
    });
    return '<div class="bucket-card"><div class="bhead">'+dot+(key==='loss'?'亏损档位':key==='profit'?'盈利档位':'销售额档位')
      +'<span class="bcnt">共 '+total+' 条</span>'+compChip(total,prevTotal,goodWhenUp)+'</div><div class="buckets">'+inner+'</div></div>';
  };
  document.getElementById('bucketHost').innerHTML=
    block('loss','🔴',false,B.loss,rows.filter(r=>r.p<0).length,
      '<div class="bcell special" data-bucket="loss_all"><div class="brow"><span class="bname" style="font-weight:700">查看全部亏损 →</span><span class="bval">'+rows.filter(r=>r.p<0).length+'</span></div></div>')
    +block('profit','🟢',true,B.profit,rows.filter(r=>r.p>0).length,
      '<div class="bcell special scale-s" data-bucket="profit_scale"><div class="brow"><span class="bname" style="font-weight:700">🚀 可放大机会 →</span><span class="bval">'+rows.filter(r=>r.p>0&&r.roiV>=1.8&&r.gmV>=8).length+'</span></div><div class="bdelta good"><span class="lab">ROI≥1.8 & 毛利≥8% 的盈利款，加预算放大利润额</span></div></div>')
    +block('sales','🔵',true,B.sales,rows.length,'');
  const hint=document.getElementById('bucketHint');
  if(hint) hint.textContent=(pw?('较上一期('+pw.replace(/\//g,'-')+')对比 · '):'最早窗口，无上期可比 · ')+'点击任意档位 → 该档全部链接，每条含「动作建议+依据」：亏损=停/下架/提投产/提价/查成本；盈利=可放大/先提毛利/提投产；以利润额×利润率最大化定建议';
  document.querySelectorAll('#bucketHost .bcell').forEach(el=>{ if(!+el.dataset.cnt)return; el.addEventListener('click',()=>{ const g=el.dataset.g,i=+el.dataset.i; BUCKET=(BUCKET&&BUCKET.g===g&&BUCKET.i===i)?null:{g,i}; DACT='all'; DRILL_PAGE=0; SELECTED.clear(); renderBuckets(); renderDrill(); }); });
  document.querySelectorAll('#bucketHost .bcell[data-bucket]').forEach(el=>{ el.addEventListener('click',()=>{ BUCKET={g:el.dataset.bucket,i:0}; DACT='all'; DRILL_PAGE=0; SELECTED.clear(); renderBuckets(); renderDrill(); }); });
}

  const rec=classifyRec(r), meta=REC_META[rec.k];
  const gmTxt=(r.gmTxt&&r.gmTxt!=='0.00%'&&r.gmTxt!=='0%'&&r.gmTxt!=='0')?r.gmTxt:'—';

      +'<div class="metric"><span class="k">毛利率</span><span class="v">'+gmTxt+'</span></div>'
      +'<div class="metric"><span class="k">趋势</span><span class="v '+dCls+'">'+dArw+'</span></div>'
      +'</div>'
    +'<div class="r-side"><span class="act-chip '+meta.cls+'">'+rec.act+'</span>'+stateChipHTML(r.link_id)+'</div>'
    +'</div>'
    +'<div class="r-why"><span class="wico">💡</span> '+esc(rec.why)+'</div>'
    +'</div>'

}
function renderDrill(){
  const host=document.getElementById('drillHost');
  if(!BUCKET){ host.innerHTML=''; return; }
  const g=BUCKET.g, rows=platRows();
  let list=[], cellName='', actFilter=false;
  if(g==='loss_all'){ list=rows.filter(r=>r.p<0).sort((a,b)=>a.p-b.p); cellName='亏损 · 全部'; actFilter=true; }
  else if(g==='profit_scale'){ list=rows.filter(r=>r.p>0&&r.roiV>=1.8&&r.gmV>=8).sort((a,b)=>b.p-a.p); cellName='盈利 · 可放大机会（ROI≥1.8 & 毛利≥8%）'; }
  else if(g==='sales'){ const c=bucketOf(rows).sales[BUCKET.i]; list=c.list.slice().sort((a,b)=>b.s-a.s); cellName='销售额档「'+c.name+'」'; }
  else { const B=bucketOf(rows), c=B[g][BUCKET.i]; list=c.list.slice().sort((a,b)=>g==='loss'?a.p-b.p:b.p-a.p); cellName=(g==='loss'?'亏损':'盈利')+'档「'+c.name+'」'; }
  let actCnt=null;
  if(actFilter){ actCnt={all:list.length}; list.forEach(r=>{const k=classifyRec(r).k; actCnt[k]=(actCnt[k]||0)+1;}); if(DACT!=='all') list=list.filter(r=>classifyRec(r).k===DACT); }
  if(!list.length){ host.innerHTML=''; return; }
  const total=list.length, pages=Math.max(1,Math.ceil(total/60)); if(DRILL_PAGE>=pages)DRILL_PAGE=0;
  const slice=list.slice(DRILL_PAGE*60,(DRILL_PAGE+1)*60);
  let af='';
  if(actFilter&&actCnt){
    const order=[['all','全部'],['A_del','停推广下架'],['A_stop','停推广'],['B_fix','提投产'],['C_price','提价去优惠'],['D_struct','查成本退款'],['E_watch','观察收窄']];
    af='<div class="amtbar"><span class="lab">动作类型</span>'+order.map(([k,lab])=>'<span class="amt-chip '+(DACT===k?'active':'')+(actCnt[k]?'':' disable')+'" data-dact="'+k+'">'+lab+'<span class="n">'+(actCnt[k]||0)+'</span></span>').join('')+'</div>';
  }
  let html='<div class="listcard" id="drillCard">'+af+batchBarHTML('drill',total)
    +'<div class="listhead">▾ '+cellName+' · '+total+' 条<span class="lsub">点行看趋势 · 勾选批量复制 / 批量标状态</span></div>'
    +'<div class="ltable">'+slice.map(r=>drillRowHTML(r)).join('')+'</div>';
  if(pages>1) html+='<div class="pager"><button data-pg="prev">‹ 上一页</button><span>'+(DRILL_PAGE+1)+'/'+pages+' 页</span><button data-pg="next">下一页 ›</button></div>';
  html+='</div>';
  host.innerHTML=html;
  const card=document.getElementById('drillCard');
  bindBatch(card,'drill');
  card.querySelectorAll('.amt-chip[data-dact]').forEach(ch=>{ ch.addEventListener('click',()=>{ if(ch.classList.contains('disable'))return; DACT=ch.dataset.dact; DRILL_PAGE=0; SELECTED.clear(); renderDrill(); }); });
  card.querySelectorAll('[data-pg]').forEach(btn=>{ btn.addEventListener('click',()=>{ DRILL_PAGE+=btn.dataset.pg==='prev'?-1:1; renderDrill(); }); });
}

function renderProducts(){
  const groups=new Map();
  platRows().forEach(r=>{ if(!groups.has(r.product))groups.set(r.product,{name:r.product,links:[]}); groups.get(r.product).links.push(r); });
  let html='';
  groups.forEach(g=>{
    g.links.sort((a,b)=>a.p-b.p);
    let lossN=0,lossAmt=0,proN=0;
    g.links.forEach(r=>{ if(r.p<0){lossN++;lossAmt+=r.p;} else if(r.p>0)proN++; });
    const body=g.links.slice(0,80).map(r=>drillRowHTML(r)).join('');
    html+='<div class="pgroup"><div class="ghead"><span class="arrow">▶</span><span>'+g.name+'</span><span class="gcnt">'+g.links.length+' 条</span><span class="gsum">'
      +(lossN?'<span style="color:var(--accent-red)">亏损 '+lossN+' · '+fmtMoney(lossAmt)+'</span>':'')+(proN?'<span style="color:var(--accent-green)">盈利 '+proN+'</span>':'')
      +'</span></div><div class="pbody"><div class="ltable">'
      +body+'</div></div></div>';
  });
  const host=document.getElementById('prodHost');
  host.innerHTML=html;
  host.querySelectorAll('.pgroup').forEach(g=>{
    g.querySelector('.ghead').addEventListener('click',()=>{
      const open=!g.classList.contains('open');
      g.classList.toggle('open');
      if(open){ g.querySelectorAll('.lrow[data-id]').forEach(row=>{ if(row.dataset.b)return; row.dataset.b=1; row.addEventListener('click',(e)=>{ if(e.target.closest('.chk')||e.target.closest('.ostate'))return; toggleTrend(row); }); }); }
    });
  });
}

function drawTrend(canvas,id){
  const s=linkSeries(id); if(!s.length){ canvas.parentElement.innerHTML='<div class="empty">无趋势数据</div>'; return; }
  const chart=echarts.init(canvas);
  chart.setOption({grid:{left:8,right:16,top:24,bottom:8,containLabel:true},tooltip:{trigger:'axis',valueFormatter:v=>v===null?'—':v+' 元'},
    xAxis:{type:'category',data:s.map(x=>x[0].slice(5)),axisLabel:{fontSize:10,color:'#9ba3af'}},
    yAxis:{type:'value',axisLabel:{fontSize:10,color:'#9ba3af'},splitLine:{lineStyle:{color:'#f0f0f0'}}},
    series:[{type:'line',data:s.map(x=>x[1]),smooth:true,symbolSize:6,lineStyle:{width:2.5,color:'#8b5cf6'},itemStyle:{color:'#8b5cf6'},areaStyle:{opacity:0.08,color:'#8b5cf6'},markLine:{silent:true,symbol:'none',data:[{yAxis:0}],lineStyle:{type:'dashed',color:'#f59e0b'}}}]});
  try{ canvas.__c=chart; }catch(e){}
  window.addEventListener('resize',()=>{ try{chart.resize();}catch(e){} });
}

function renderAll(){
  renderWinBar(); renderOverview(); renderBuckets(); renderDrill(); renderProducts();
}
async function main(){
  loadPlan();
  try{
    const res=await fetch('data/feishu_bi.json'); if(!res.ok)throw new Error('HTTP '+res.status);
    const raw=await res.json();
    const rows=buildDedup(raw.rows);
    DATA.rows=rows;
    DATA.windows=raw.windows.slice().sort((a,b)=>{ const ea=rows.find(r=>r.window===a),eb=rows.find(r=>r.window===b); return (toDate(ea&&ea.window_end)||a).localeCompare(toDate(eb&&eb.window_end)||b); });
    const map={}; rows.forEach(r=>{ (map[r.window]=map[r.window]||[]).push(r); });
    DATA.winRowsMap=map;
    WIN=DATA.windows[DATA.windows.length-1];
    renderAll();
  }catch(err){
    document.querySelector('.controlbar').insertAdjacentHTML('afterend','<div class="err">加载 data/feishu_bi.json 失败：'+err.message+'<br>请用本地服务器地址打开 http://127.0.0.1:3588/bi-digest.html</div>');
  }
}
main();
