<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>运营周报看板 · 自然周对比</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --bd:#e5e8ec; --bd2:#d5d9e0;
  --tx:#1a1d23; --tx2:#5b6472; --tx3:#8b95a5; --tx4:#b3bac6;
  --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#2563eb;
  --r:12px; --r2:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:24px 22px 64px}

/* 头部 */
.hdr{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hdr h1{font-size:21px;font-weight:700;letter-spacing:.2px}
.hdr .sub{color:var(--tx3);font-size:12.5px}
.hdr .sp{flex:1}
.hdr .btnx{border:1px solid var(--bd2);background:#fff;color:var(--tx2);border-radius:8px;
  padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none}
.hdr .btnx:hover{border-color:var(--tx3);color:var(--tx)}

/* 筛选条 */
.bar{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 15px;margin-bottom:16px}
.bar .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.bar .row+.row{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.bar .lb{font-size:12px;color:var(--tx3);min-width:40px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--bd2);background:#fff;color:var(--tx2);border-radius:18px;padding:5px 13px;
  font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.12s}
.pill:hover{border-color:var(--tx4);color:var(--tx)}
.pill.on{background:var(--tx);border-color:var(--tx);color:#fff;font-weight:600}
.pill .n{font-size:11px;opacity:.6;margin-left:3px}
select{background:#fff;color:var(--tx);border:1px solid var(--bd2);border-radius:7px;padding:5px 8px;
  font-size:12.5px;outline:none;font-family:inherit}
.hint{font-size:11.5px;color:var(--tx4)}

/* 区块 */
.blk{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:15px 17px;margin-bottom:14px}
.blk>h3{font-size:14px;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.blk>h3 .sp{flex:1}
.blk>h3 .hint{font-weight:400;font-size:11.5px;color:var(--tx4)}

/* 定性横幅 */
.verdict{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:var(--r);padding:13px 17px;
  margin-bottom:14px;border:1px solid var(--bd);background:#fff;border-left:5px solid var(--bd2)}
.verdict.good{border-left-color:var(--green)}
.verdict.bad{border-left-color:var(--red)}
.verdict.mid{border-left-color:var(--amber)}
.verdict .vbadge{font-size:13px;font-weight:800;padding:4px 13px;border-radius:20px;white-space:nowrap}
.verdict .vbadge.good{background:#e9f7ef;color:#15803d}
.verdict .vbadge.bad{background:#fdecec;color:#c0332f}
.verdict .vbadge.mid{background:#fdf3e3;color:#b45309}
.verdict .vtxt{font-size:13px;color:var(--tx2);line-height:1.55;flex:1;min-width:210px}
.verdict .vtxt b{color:var(--tx);font-size:14px}

/* KPI 卡片 */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--bd);border-radius:var(--r2);padding:13px 14px;background:#fff;display:flex;flex-direction:column}
.kpi .klab{font-size:12px;color:var(--tx3);margin-bottom:8px;font-weight:600}
.kpi .kval{font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.kpi .kval.red{color:var(--red)}
.kpi .kdelta{font-size:12.5px;font-weight:700;margin-top:7px}
.kpi .ksub{font-size:11px;color:var(--tx4);margin-top:4px}

/* 涨跌 */
.d{font-weight:600;font-size:11.5px;white-space:nowrap}
.d.up{color:var(--green)}.d.down{color:var(--red)}.d.flat{color:var(--tx4)}
.up-t{color:var(--green)}.down-t{color:var(--red)}.flat-t{color:var(--tx4)}
.pos{color:var(--green)}.neg{color:var(--red)}

/* 表 */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
thead th{text-align:right;padding:7px 9px;font-weight:600;font-size:11px;color:var(--tx3);
  border-bottom:1px solid var(--bd);white-space:nowrap}
thead th:first-child{text-align:left}
tbody td{padding:8px 9px;text-align:right;border-bottom:1px solid #f0f2f5;white-space:nowrap;
  font-variant-numeric:tabular-nums}
tbody td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfc}
.tb{max-height:360px;overflow:auto}
.tb::-webkit-scrollbar{width:7px}.tb::-webkit-scrollbar-thumb{background:#dfe3e8;border-radius:7px}
.tag{font-size:10.5px;padding:1.5px 7px;border-radius:20px;font-weight:600;white-space:nowrap;display:inline-block}
.tag.g{background:#e9f7ef;color:#15803d}.tag.r{background:#fdecec;color:#c0332f}
.tag.n{background:#f1f3f6;color:#6b7280}
.pl{font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:600}
.pl.tm{background:#fff2ea;color:#c2410c}.pl.pdd{background:#fdeeef;color:#c0332f}
.empty{padding:22px;text-align:center;color:var(--tx4);font-size:12.5px}
.err{background:#fdecec;border:1px solid #f5c6c6;color:#c0332f;padding:13px 15px;border-radius:var(--r2);font-size:12.5px;line-height:1.7}
.note{font-size:11.5px;color:var(--tx4);margin-top:8px;line-height:1.7}
.note b{color:var(--tx2)}
.load{display:flex;align-items:center;justify-content:center;gap:9px;padding:70px 0;color:var(--tx3)}
.spin{width:14px;height:14px;border:2px solid var(--bd2);border-top-color:var(--tx);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:#1a1d23;color:#fff;
  padding:8px 16px;border-radius:8px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
.subt{font-size:12.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.subt i{width:3px;height:12px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <h1>运营周报看板</h1>
    <span class="sub" id="hdrSub">加载中…</span>
    <span class="sp"></span>
    <button class="btnx" id="btnExp">⬇ 导出 CSV</button>
    <a class="btnx" href="./index.html">← 返回工作台</a>
  </div>

  <!-- 筛选条 -->
  <div class="bar">
    <div class="row">
      <span class="lb">平台</span>
      <div class="pills" id="plats"></div>
      <span class="sp" style="flex:1"></span>
      <span class="lb">本期</span>
      <select id="selCur"></select>
      <span class="hint">对比</span>
      <select id="selPrev"></select>
    </div>
    <div class="row">
      <span class="lb">运营</span>
      <div class="pills" id="owners"></div>
    </div>
  </div>

  <div id="errBox"></div>
  <div id="loading" class="load"><div class="spin"></div>正在加载 BI 数据…</div>

  <div id="app" class="hide">
    <div class="verdict" id="verdict"></div>
    <div class="kpis" id="kpis"></div>

    <div class="g2" style="margin-top:14px">
      <div class="blk">
        <div class="subt"><i style="background:var(--red)"></i><span id="badT">最该处理</span></div>
        <div class="tb" id="badTbl"></div>
      </div>
      <div class="blk">
        <div class="subt"><i style="background:var(--blue)"></i><span id="rankT">负责人排行</span></div>
        <div class="tb" id="rankTbl"></div>
      </div>
    </div>

    <div class="note" id="footNote"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ════════ 运营周报看板 · 极简自然周对比 ════════ */
const API='/api/files/bi-actions', API_KEY='chengying2026', LS_KEY='bi_digest_plan_v4';
let _syncBaseB;
async function planApiUrlB(){
  if(_syncBaseB!==undefined) return _syncBaseB===null?null:_syncBaseB+API;
  let cfgHub='';
  try{ const cr=await fetch('data/sync.json?v='+Date.now(),{cache:'no-store'}); if(cr.ok){ const cj=await cr.json(); if(cj&&cj.hub) cfgHub=String(cj.hub).replace(/\/+$/,''); } }catch(e){}
  const cloud=[cfgHub,'https://sync-server-production-bdec.up.railway.app'];
  const mem=(()=>{ try{ return localStorage.getItem('bi_plan_sync_base')||''; }catch(e){ return ''; } })();
  if(mem) cloud.unshift(mem);
  const uniq=[...new Set(cloud)];
  const probe=async u=>{ try{ const r=await fetch(u,{method:'GET',headers:{'X-API-Key':API_KEY},signal:AbortSignal.timeout?AbortSignal.timeout(4500):undefined}); return r.ok; }catch(e){ return false; } };
  for(const b of uniq){ if(await probe(b+API)){ _syncBaseB=b; try{ localStorage.setItem('bi_plan_sync_base',b); }catch(e){} return b+API; } }
  if(await probe(API)){ _syncBaseB=''; return API; }
  _syncBaseB=null; return null;
}

const $=s=>document.querySelector(s);
function num(v){ if(v==null)return 0; if(typeof v==='number')return isFinite(v)?v:0;
  const n=parseFloat(String(v).replace(/[%,¥,\s]/g,'')); return isNaN(n)?0:n; }
function money(v){ if(v==null||isNaN(v))return '—'; const s=v<0?'-':''; const a=Math.abs(v);
  if(a>=10000)return s+(a/10000).toFixed(a>=100000?0:2)+'万';
  if(a>=1000)return s+Math.round(a).toLocaleString('zh-CN');
  return s+(a<10?a.toFixed(1):Math.round(a)); }
function money0(v){ if(v==null||isNaN(v))return '—'; return Math.round(v).toLocaleString('zh-CN'); }
function pct(v,d){ d=d==null?1:d; return v==null||isNaN(v)?'—':v.toFixed(d)+'%'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cleanOwner(s){ s=(s==null||s==='')?'未分配':String(s); return s.replace(/\((?:运营|推广|客服|美工|专员)\)$/,''); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

function dlt(cur,prev,hb,fmt){
  fmt=fmt||money0;
  if(prev==null||!isFinite(prev)) return '<span class="d flat">—</span>';
  const d=cur-prev, rel=prev!==0?d/Math.abs(prev)*100:null;
  if(Math.abs(d)<1e-9) return '<span class="d flat">持平</span>';
  const up=d>0, good=hb?up:!up;
  const rc=(rel!=null&&Math.abs(rel)>=1)?' '+(up?'+':'')+rel.toFixed(0)+'%':'';
  return '<span class="d '+(good?'up':'down')+'">'+(up?'▲':'▼')+fmt(Math.abs(d))+rc+'</span>';
}

/* ── 自然周工具 ── */
function natMonday(dStr){                 // dStr: "2026/09/09" -> Date(周一)
  const t=Date.parse(String(dStr).replace(/\//g,'-')); if(isNaN(t)) return null;
  const dt=new Date(t); const day=(dt.getDay()+6)%7; const mon=new Date(dt); mon.setDate(dt.getDate()-day);
  return mon;
}
function fmtMD(dt){ return (dt.getMonth()+1)+'/'+dt.getDate(); }
function natWeekKey(dStr){ const m=natMonday(dStr); if(!m)return null;
  return m.getFullYear()+'-'+(m.getMonth()+1)+'-'+m.getDate(); }
function natWeekLabel(dStr){ const m=natMonday(dStr); if(!m)return ''; const sun=new Date(m); sun.setDate(m.getDate()+6);
  return fmtMD(m)+'-'+fmtMD(sun); }

/* ════════ 状态（读取执行端标记，仅展示） ════════ */
let LINK={}, ACTIONS={}, OWNERS=[], PLATS=[], WEEKS=[], WEEKLBL={}, DATAEND='';
let CUR='', PREV='';
let S={plat:'', owner:''};

async function loadActions(){
  let srv={}, delMap={};
  try{ const u=await planApiUrlB(); if(!u) throw new Error('no-sync-base');
    const r=await fetch(u,{headers:{'X-API-Key':API_KEY}});
    if(r.ok){ const j=await r.json();
      const wrap=(j&&j.data&&typeof j.data==='object')?j.data:j;
      if(wrap&&wrap.v&&typeof wrap.v==='object'){ srv=wrap.v; delMap=wrap.del&&typeof wrap.del==='object'?wrap.del:{}; }
      else if(wrap&&typeof wrap==='object'&&!Array.isArray(wrap)&&wrap.st===undefined&&wrap.v===undefined){ srv=wrap; }
    } }catch(e){}
  let ls={}; try{ ls=JSON.parse(localStorage.getItem(LS_KEY)||'{}')||{}; }catch(e){}
  const norm=v=>(v&&typeof v==='object')?{st:v.st||'待处理'}:{st:String(v||'待处理')};
  const out={}; const deled=new Set(Object.keys(delMap));
  for(const k in srv){ if(k.indexOf('__')!==0) out[k]=norm(srv[k]); }
  for(const k in ls){ if(deled.has(k))continue; if(!out[k]) out[k]=norm(ls[k]); }
  ACTIONS=out;
}

/* ════════ 载入 + 自然周归并 ════════ */
async function boot(){
  let raw;
  try{ const r=await fetch('data/feishu_bi.json?v='+Date.now()); if(!r.ok)throw new Error('HTTP '+r.status); raw=await r.json(); }
  catch(e){ $('#loading').classList.add('hide');
    $('#errBox').innerHTML='<div class="err"><b>加载 data/feishu_bi.json 失败：'+esc(e.message)+'</b><br>请用本地服务器地址打开（如 http://localhost:3588/bi-result-board.html），不要直接双击文件。</div>'; return; }
  const rows=raw.rows||[];
  // 归并：每个链接每周只保留「window_end 最新」的滚动窗口值
  const tmp={};
  let maxEnd='';
  for(const r of rows){
    const we=r.window_end; if(!we) continue;
    const wk=natWeekKey(we); if(!wk) continue;
    if(we>maxEnd) maxEnd=we;
    const id=String(r.link_id==null?'':r.link_id); if(!id) continue;
    const k=id+'|'+wk;
    const old=tmp[k];
    if(!old || we>old.window_end){
      tmp[k]={ id, win:r.window||'', window_end:we, week:wk,
        p:num(r.profit_pay), s:num(r.net_pay), pay:num(r.pay_amt),
        product:r.product||'', title:r.title||'', platform:r.platform||'', shop:r.shop||'',
        owner:cleanOwner(r.owner) };
    }
  }
  DATAEND=maxEnd;
  LINK={};
  for(const k in tmp){ const a=tmp[k]; (LINK[a.id]=LINK[a.id]||{id:a.id,W:{}}).W[a.week]=a; }
  // 取每个链接最新一周的 meta
  for(const id in LINK){ const L=LINK[id]; let best=null;
    for(const wk in L.W){ if(!best||L.W[wk].window_end>L.W[best].window_end) best=wk; }
    if(best) L.meta=L.W[best];
  }
  // 自然周列表（按时间升序）
  const wset=new Set();
  for(const id in LINK) for(const wk in LINK[id].W) wset.add(wk);
  WEEKS=[...wset].sort((a,b)=>a.localeCompare(b));
  for(const wk of WEEKS){ // 找该周任一 window_end 推 label
    let any=null; for(const id in LINK){ for(const w in LINK[id].W){ if(w===wk){ any=LINK[id].W[w].window_end; break; } } if(any)break; }
    WEEKLBL[wk]=any?natWeekLabel(any):wk;
  }
  PLATS=[...new Set(Object.values(LINK).map(l=>l.meta.platform))].filter(Boolean).sort();
  OWNERS=[...new Set(Object.values(LINK).map(l=>l.meta.owner))].sort((a,b)=>a.localeCompare(b,'zh'));
  await loadActions();

  $('#loading').classList.add('hide'); $('#app').classList.remove('hide');
  $('#hdrSub').textContent=WEEKS.length+' 个自然周 · '+Object.keys(LINK).length+' 链接 · '+OWNERS.length+' 运营'
    +(DATAEND?' · 数据截至 '+DATAEND.replace(/\//g,'-')+'':'');
  // 默认本期=最近周，对比=上一周
  CUR=WEEKS[WEEKS.length-1];
  PREV=WEEKS.length>1?WEEKS[WEEKS.length-2]:WEEKS[0];
  bindUI(); render();
}

/* 聚合：某自然周下，满足平台/负责人筛选的链接汇总 */
function agg(week, plat, owner){
  let n=0,lossN=0,lossAmt=0,proN=0,proAmt=0,net=0,sales=0;
  for(const id in LINK){
    const L=LINK[id], m=L.meta;
    if(plat&&m.platform!==plat) continue;
    if(owner&&m.owner!==owner) continue;
    const rec=L.W[week]; if(!rec) continue;
    n++; const p=rec.p;
    if(p<0){lossN++;lossAmt+=p;} else if(p>0){proN++;proAmt+=p;}
    net+=p; sales+=rec.s;
  }
  return {n,lossN,lossAmt,proN,proAmt,net,sales,lossRate:n?lossN/n*100:0};
}
/* 同口径 id：两期都出现 */
function scopeIds(cur,prev,plat,owner){
  const out=[];
  for(const id in LINK){
    const L=LINK[id], m=L.meta;
    if(plat&&m.platform!==plat) continue;
    if(owner&&m.owner!==owner) continue;
    if(L.W[cur]&&L.W[prev]) out.push(id);
  }
  return out;
}

/* ════════ 渲染 ════════ */
function render(){
  renderBar();
  const a=agg(CUR,S.plat,S.owner), b=agg(PREV,S.plat,S.owner);
  const ids=scopeIds(CUR,PREV,S.plat,S.owner);
  const ac=aggByIds(ids,CUR), bc=aggByIds(ids,PREV);   // 同口径
  renderVerdict(ac,bc,ids);
  renderKpis(ac,bc);
  renderBad(ids);
  renderRank();
}
function aggByIds(ids,week){
  let n=0,lossN=0,lossAmt=0,proN=0,proAmt=0,net=0,sales=0;
  for(const id of ids){ const rec=LINK[id].W[week]; if(!rec) continue;
    n++; const p=rec.p; if(p<0){lossN++;lossAmt+=p;} else if(p>0){proN++;proAmt+=p;} net+=p; sales+=rec.s; }
  return {n,lossN,lossAmt,proN,proAmt,net,sales,lossRate:n?lossN/n*100:0};
}
function renderBar(){
  $('#plats').innerHTML='<button class="pill'+(S.plat?'':' on')+'" data-p="">全部</button>'
    +PLATS.map(p=>'<button class="pill'+(S.plat===p?' on':'')+'" data-p="'+esc(p)+'">'+esc(p)+'</button>').join('');
  const cnt={};
  for(const id in LINK){ const m=LINK[id].meta; if(S.plat&&m.platform!==S.plat) continue;
    if(LINK[id].W[CUR]) cnt[m.owner]=(cnt[m.owner]||0)+1; }
  $('#owners').innerHTML='<button class="pill'+(S.owner?'':' on')+'" data-o="">全部</button>'
    +OWNERS.filter(o=>!S.plat||cnt[o]).map(o=>
      '<button class="pill'+(S.owner===o?' on':'')+'" data-o="'+esc(o)+'">'+esc(o)
      +(cnt[o]?'<span class="n">'+cnt[o]+'</span>':'')+'</button>').join('');
  const opt=WEEKS.map(w=>'<option value="'+w+'">'+WEEKLBL[w]+'</option>').join('');
  if($('#selCur').dataset.n!==String(WEEKS.length)){
    $('#selCur').innerHTML=opt; $('#selPrev').innerHTML=opt; $('#selCur').dataset.n=String(WEEKS.length); }
  $('#selCur').value=CUR; $('#selPrev').value=PREV;
}
function renderKpis(a,b){
  const gAmt=Math.abs(a.lossAmt), gAmtP=Math.abs(b.lossAmt);
  const KS=[
    {l:'净利',   v:money(a.net),      cur:a.net,    prev:b.net,    hb:1, f:money,  red:a.net<0},
    {l:'销售额',  v:money(a.sales),    cur:a.sales,  prev:b.sales,  hb:1, f:money,  red:false},
    {l:'亏损链接', v:a.lossN,           cur:a.lossN,  prev:b.lossN,  hb:0, f:money0, red:false, sub:'共 '+a.n+' 条'},
    {l:'亏损额',  v:money(gAmt),        cur:gAmt,     prev:gAmtP,    hb:0, f:money,  red:true},
    {l:'亏损率',  v:pct(a.lossRate),    cur:a.lossRate,prev:b.lossRate,hb:0, f:x=>pct(x,1), red:false},
  ];
  $('#kpis').innerHTML=KS.map(k=>{
    return '<div class="kpi"><div class="klab">'+k.l+'</div>'
      +'<div class="kval num'+(k.red?' red':'')+'">'+k.v+'</div>'
      +'<div class="kdelta">'+dlt(k.cur,k.prev,k.hb,k.f)+'</div>'
      +'<div class="ksub">'+(k.sub?k.sub+' · ':'')+'上期 '+k.f(k.prev)+'</div></div>';
  }).join('');
}
function renderVerdict(a,b,ids){
  const nd=a.net-b.net, dl=a.lossN-b.lossN;
  const un=ids.filter(id=>{ const rec=LINK[id].W[CUR]; return rec&&rec.p<0&&(!ACTIONS[id]||ACTIONS[id].st==='待处理'); }).length;
  const score=(nd>0?1:nd<0?-1:0)+(dl<0?1:dl>0?-1:0);
  const v=score>=2?{t:'向好',c:'good'}:score<=-2?{t:'承压',c:'bad'}:{t:'分化',c:'mid'};
  const arrow=(d,hb)=>{const up=d>0,good=hb?up:!up;
    return '<span class="'+(good?'up-t':'down-t')+'">'+(up?'▲':'▼')+' '+money(Math.abs(d))+'</span>';};
  let txt='净利 <b class="num">'+money(a.net)+'</b>（环比 '+arrow(nd,1)+'）　'
    +'亏损 <b class="num">'+a.lossN+'</b> 条（环比 '
    +(dl>0?'<span class="down-t">+'+dl+'</span>':dl<0?'<span class="up-t">'+dl+'</span>':'<span class="flat-t">0</span>')+' 条）';
  if(un>0) txt+='　<b style="color:var(--red)">'+un+'</b> 条亏损未标动作';
  else txt+='　<span style="color:var(--green)">亏损均已标记</span>';
  $('#verdict').className='verdict '+v.c;
  $('#verdict').innerHTML='<span class="vbadge '+v.c+'">本周'+v.t+'</span><div class="vtxt">'+txt+'</div>';
}
function renderBad(ids){
  const rows=ids.map(id=>{
    const c=LINK[id].W[CUR], p=LINK[id].W[PREV]; if(!c||!p) return null;
    const d=c.p-p.p; return {id, m:c, c, p, d};
  }).filter(Boolean).filter(o=>o.c.p<0).sort((a,b)=>a.c.p-b.c.p).slice(0,5);
  const un=rows.filter(o=>!ACTIONS[o.id]||ACTIONS[o.id].st==='待处理').length;
  $('#badT').innerHTML='最该处理 · 本周亏损 Top5'
    +(un?' <span style="color:var(--red);font-weight:700">（'+un+' 条未标动作）</span>':'');
  if(!rows.length){ $('#badTbl').innerHTML='<div class="empty">本周没有亏损链接 🎉</div>'; return; }
  const th='<thead><tr><th>链接</th><th>平台</th><th>运营</th><th>本期利润</th><th>Δ</th><th>动作</th></tr></thead><tbody>';
  const row=o=>'<tr><td><div style="font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
      +esc(o.m.product||o.m.title||o.id)+'</div><div style="font-size:10px;color:var(--tx4)">'+esc(o.id)+'</div></td>'
    +'<td><span class="pl '+(o.m.platform==='天猫'?'tm':'pdd')+'">'+esc((o.m.platform||'').slice(0,2))+'</span></td>'
    +'<td>'+(S.owner?'—':esc(o.m.owner))+'</td>'
    +'<td class="num neg"><b>'+money(o.c.p)+'</b></td>'
    +'<td>'+dltT(o.d,0,true)+'</td>'
    +'<td>'+(ACTIONS[o.id]?'<span class="tag n">'+esc(ACTIONS[o.id].st)+'</span>':'<span class="tag r">未处理</span>')+'</td></tr>';
  $('#badTbl').innerHTML='<table>'+th+rows.map(row).join('')+'</tbody></table>';
}
function dltT(cur,prev,hb,fmt){ // 复用，仅 Δ（绝对值+方向）
  fmt=fmt||money0;
  if(prev==null||!isFinite(prev)) return '<span class="flat-t">—</span>';
  const d=cur-prev; if(Math.abs(d)<1e-9) return '<span class="flat-t">0</span>';
  const up=d>0, good=hb?up:!up;
  return '<span class="'+(good?'up-t':'down-t')+'">'+(up?'+':'-')+fmt(Math.abs(d))+'</span>';
}
function renderRank(){
  const ids=scopeIds(CUR,PREV,'',S.owner?S.owner:''); // 负责人排行始终全员横向对比（即便上面按平台筛，这里只看当前筛选）
  const byOwner={};
  for(const id of ids){ const o=LINK[id].W[CUR].owner; (byOwner[o]=byOwner[o]||[]).push(id); }
  const rows=Object.keys(byOwner).map(o=>{
    const cur=aggByIds(byOwner[o],CUR), prev=aggByIds(byOwner[o],PREV);
    return {own:o, cur, prev, dNet:cur.net-prev.net, dLossN:prev.lossN-cur.lossN, dSales:cur.sales-prev.sales};
  }).filter(r=>r.cur.n>0).sort((a,b)=>b.dNet-a.dNet);
  $('#rankT').innerHTML='负责人排行 · 按净利Δ（'+WEEKLBL[CUR]+' vs '+WEEKLBL[PREV]+'）';
  if(!rows.length){ $('#rankTbl').innerHTML='<div class="empty">当前筛选下没有两期都出现的链接</div>'; return; }
  const th='<thead><tr><th>#</th><th>负责人</th><th>净利Δ</th><th>亏损条数<br><span style="font-weight:400">上期→本期</span></th><th>销售额Δ</th></tr></thead><tbody>';
  const row=(r,i)=>'<tr><td style="color:var(--tx4)">'+(i+1)+'</td>'
    +'<td style="font-weight:700">'+esc(r.own)+'</td>'
    +'<td class="num '+(r.dNet>=0?'pos':'neg')+'"><b>'+(r.dNet>=0?'+':'')+money(r.dNet)+'</b></td>'
    +'<td class="num">'+r.prev.lossN+' → '+r.cur.lossN+'</td>'
    +'<td class="num '+(r.dSales>=0?'pos':'neg')+'">'+(r.dSales>=0?'+':'')+money(r.dSales)+'</td></tr>';
  $('#rankTbl').innerHTML='<table>'+th+rows.map(row).join('')+'</tbody></table>';
  $('#footNote').innerHTML='口径说明：自然周按周一~周日归并，每链接每周取「window_end 最新」的滚动窗口值；'
    +'对比为两期<b>都出现</b>的同口径链接。标记状态读取自执行端（BI指标归档处理中心），仅展示、不在此处修改。'
    +(DATAEND?' 数据截至 '+DATAEND.replace(/\//g,'-')+'。':'');
}

/* 导出 CSV */
function dl(name,text){
  const b=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportCsv(){
  const a=agg(CUR,S.plat,S.owner), b=agg(PREV,S.plat,S.owner);
  let c='平台,'+(S.plat||'全部')+'\n运营,'+(S.owner||'全部')+'\n本期,'+WEEKLBL[CUR]+'\n对比期,'+WEEKLBL[PREV]+'\n同口径,是\n\n';
  c+='指标,本期,对比期,变化\n';
  [['净利',a.net,b.net],['亏损链接数',a.lossN,b.lossN],['亏损额',a.lossAmt.toFixed(2),b.lossAmt.toFixed(2)],
   ['销售额',a.sales.toFixed(2),b.sales.toFixed(2)],['亏损率',a.lossRate.toFixed(2),b.lossRate.toFixed(2)]]
   .forEach(r=>c+=r[0]+','+r[1]+','+r[2]+','+((+r[1])-(+r[2])).toFixed(2)+'\n');
  const ids=scopeIds(CUR,PREV,S.plat,S.owner);
  c+='\n链接级（本周亏损Top，按利润升序）\n链接ID,产品,平台,运营,本期利润,上期利润,Δ,动作\n';
  ids.map(id=>{ const c1=LINK[id].W[CUR],p1=LINK[id].W[PREV]; if(!c1||!p1)return null;
    return {id,m:c1,d:c1.p-p1.p}; }).filter(Boolean).filter(o=>o.d<0).sort((x,y)=>x.d-y.d).forEach(o=>
    c+=[o.id,(o.m.product||'').replace(/,/g,'，'),o.m.platform,o.m.owner,o.m.p.toFixed(2),
      LINK[o.id].W[PREV].p.toFixed(2),o.d.toFixed(2),ACTIONS[o.id]?ACTIONS[o.id].st:''].join(',')+'\n');
  dl('运营周报_'+(S.owner||'全部')+'_'+WEEKLBL[CUR].replace(/\//g,'')+'.csv',c);
  toast('已导出 CSV');
}

/* 交互 */
function bindUI(){
  $('#plats').onclick=e=>{ const b=e.target.closest('.pill'); if(!b)return;
    S.plat=b.dataset.p;
    if(S.owner){ let has=false;
      for(const id in LINK){ if(LINK[id].meta.owner===S.owner&&(!S.plat||LINK[id].meta.platform===S.plat)){has=true;break;} }
      if(!has){ S.owner=''; toast('该平台下没有此运营的链接，已切回全部'); } }
    render(); };
  $('#owners').onclick=e=>{ const b=e.target.closest('.pill'); if(!b)return; S.owner=b.dataset.o; render(); };
  $('#selCur').onchange=e=>{ CUR=e.target.value; render(); };
  $('#selPrev').onchange=e=>{ PREV=e.target.value; render(); };
  $('#btnExp').onclick=exportCsv;
}
boot();
</script>
