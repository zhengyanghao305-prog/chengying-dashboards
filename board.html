        // 当日全店总花费（用来算占比）
        var dayRs = allRows.filter(function(r){ return r.date===d; });
        var dayTc = dayRs.length ? (parseFloat(dayRs[0].total_cost)||0) : 0;
        var dayG = dayRs.length ? (parseFloat(dayRs[0].total_gmv)||0) : 0;
        chHistory.push({date:d, cost:c, totalCost:dayTc, totalGmv:dayG, pct: dayTc>0 ? (c/dayTc*100) : 0});
      } else {
        chHistory.push({date:d, cost:0, totalCost:0, totalGmv:0, pct:0});
      }
    });

    // 该渠道14天汇总
    var ch14Cost = 0, ch14Days = 0;
    chHistory.forEach(function(h){ if(h.cost>0){ ch14Cost+=h.cost; ch14Days++; } });
    var chDailyAvg = ch14Days > 0 ? ch14Cost / ch14Days : 0;
    var chPrev7Cost = 0, chPrev7Days = 0;
    chHistory.slice(-7).forEach(function(h){ if(h.cost>0){ chPrev7Cost+=h.cost; chPrev7Days++; } });
    var chPrev7Avg = chPrev7Days > 0 ? chPrev7Cost / chPrev7Days : 0;

    // ── 该渠道近14天趋势柱状图（聚焦本渠道）──
    var trendBars = '';
    var maxChCost = 1;
    chHistory.forEach(function(h){ if(h.cost > maxChCost) maxChCost = h.cost; });
    var barUnit = 40 / maxChCost;  // 最大40px
    chHistory.forEach(function(h, idx){
      var barH = Math.max(h.cost * barUnit, 4);
      var isToday = h.date === curDate;
      var barColor = h.cost > 0 ? (isToday ? '#be185d' : '#fda4af') : '#f1f5f9';
      var dayLabel = isToday ? '今天' : h.date.slice(5);
      var valLabel = h.cost > 0 ? fmtN0(Math.round(h.cost)) : '';
      trendBars += '<div style="flex:1;min-width:28px;text-align:center;position:relative;">';
      trendBars += '<div style="height:48px;display:flex;align-items:flex-end;justify-content:center;">';
      trendBars += '<div style="width:18px;height:' + barH + 'px;background:' + barColor + ';border-radius:2px 2px 0 0;' + (isToday?'border:1px solid #be185d;':'') + '"></div>';
      trendBars += '</div>';
      trendBars += '<div style="font-size:9px;color:' + (isToday?'#be185d':'#64748b') + ';font-weight:' + (isToday?'800':'600') + ';margin-top:2px;">' + dayLabel + '</div>';
      trendBars += '<div style="font-size:8px;color:#94a3b8;font-weight:500;">' + valLabel + '</div>';
      trendBars += '</div>';
    });

    // ── 该渠道近14天占比变化（迷你线）──
    var pctBars = '';
    chHistory.forEach(function(h, idx){
      var barH = Math.max(h.pct * 1.2, 2);
      var isToday = h.date === curDate;
      var pctColor = isToday ? '#db2777' : '#f9a8d4';
      pctBars += '<div style="flex:1;min-width:28px;text-align:center;">';
      pctBars += '<div style="height:30px;display:flex;align-items:flex-end;justify-content:center;">';
      pctBars += '<div style="width:12px;height:' + barH + 'px;background:' + pctColor + ';border-radius:1px 1px 0 0;"></div>';
      pctBars += '</div>';
      pctBars += '<div style="font-size:7px;color:#94a3b8;">' + (h.pct||0).toFixed(0) + '%</div>';
      pctBars += '</div>';
    });

    // ── 各渠道横向对比（今天）──
    var crossTable = '';
    var chList = dayAllRows.slice().sort(function(a,b){ return (parseFloat(b.cost)||0) - (parseFloat(a.cost)||0); });
    chList.forEach(function(ch, idx){
      var c = parseFloat(ch.cost)||0;
      var p = parseFloat(ch.cost_pct)||0;
      var prevRow = prevDate ? allRows.filter(function(r){ return r.date===prevDate && r.channel===ch.channel; }) : [];
      var prevC = prevRow.length ? (parseFloat(prevRow[0].cost)||0) : 0;
      var mom = prevC > 0 ? ((c-prevC)/prevC*100) : 0;
      var momStr = prevC > 0
        ? (mom > 0 ? '↑' + Math.abs(mom).toFixed(0) + '%' : '↓' + Math.abs(mom).toFixed(0) + '%')
        : '—';
      var isActive = ch.channel === channel;
      var bgColor = isActive ? '#fef2f2' : '#fff';
      var borderLeft = isActive ? '2px solid #be185d' : '1px solid #f1f5f9';
      crossTable += '<div style="display:flex;align-items:center;padding:5px 8px;background:' + bgColor + ';border-left:' + borderLeft + ';border-bottom:1px solid #f8fafc;gap:6px;">';
      crossTable += '<div style="width:100px;font-size:11px;font-weight:' + (isActive?'800':'500') + ';color:' + (isActive?'#be185d':'#374151') + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + ch.channel + (isActive?' ← 当前':'') + '</div>';
      crossTable += '<div style="flex:1;text-align:right;font-size:11px;font-weight:700;color:#475569;">' + fmt(c) + '</div>';
      crossTable += '<div style="width:45px;text-align:right;font-size:10px;color:#64748b;">' + p.toFixed(0) + '%</div>';
      crossTable += '<div style="width:55px;text-align:right;font-size:10px;color:' + (mom>0?'#dc2626':'#15803d') + ';font-weight:600;">' + momStr + '</div>';
      crossTable += '</div>';
    });

    // ── 该渠道日度明细表（近7天）──
    var dailyTable = '';
    var recent7 = chHistory.slice(-7).reverse();  // 最新在前
    if (recent7.length) {
      dailyTable += '<table style="width:100%;border-collapse:collapse;font-size:10px;">';
      dailyTable += '<thead><tr style="border-bottom:1px solid #e2e8f0;">';
      dailyTable += '<th style="text-align:left;padding:4px 6px;color:#64748b;font-weight:600;">日期</th>';
      dailyTable += '<th style="text-align:right;padding:4px 6px;color:#64748b;font-weight:600;">花费</th>';
      dailyTable += '<th style="text-align:right;padding:4px 6px;color:#64748b;font-weight:600;">占全店%</th>';
      dailyTable += '<th style="text-align:right;padding:4px 6px;color:#64748b;font-weight:600;">环比</th>';
      dailyTable += '<th style="text-align:right;padding:4px 6px;color:#64748b;font-weight:600;">全店ROI</th>';
      dailyTable += '</tr></thead><tbody>';
      recent7.forEach(function(h){
        var prevHIdx = recent7.indexOf(h) + 1;
        var prevH = recent7[prevHIdx];
        var dMom = prevH && prevH.cost > 0 ? ((h.cost-prevH.cost)/prevH.cost*100) : 0;
        var dMomStr = prevH && prevH.cost > 0
          ? (dMom > 0 ? '↑' + Math.abs(dMom).toFixed(0) + '%' : '↓' + Math.abs(dMom).toFixed(0) + '%')
          : '—';
        var isT = h.date === curDate;
        dailyTable += '<tr style="border-bottom:1px solid #f1f5f9;' + (isT?'background:#fef2f2;':'') + '">';
        dailyTable += '<td style="padding:4px 6px;color:' + (isT?'#be185d':'#475569') + ';font-weight:' + (isT?'700':'500') + ';">' + h.date.slice(5) + (isT?' ←':'') + '</td>';
        dailyTable += '<td style="text-align:right;padding:4px 6px;color:#475569;font-weight:600;">' + fmtN0(Math.round(h.cost)) + '</td>';
        dailyTable += '<td style="text-align:right;padding:4px 6px;color:#64748b;">' + h.pct.toFixed(1) + '%</td>';
        dailyTable += '<td style="text-align:right;padding:4px 6px;color:' + (dMom>0?'#dc2626':'#15803d') + ';font-weight:600;">' + dMomStr + '</td>';
        var dRoi = h.totalCost > 0 ? (h.totalGmv/h.totalCost) : 0;
        dailyTable += '<td style="text-align:right;padding:4px 6px;color:' + (dRoi>=3.5?'#15803d':(dRoi>=2?'#d97706':'#dc2626')) + ';font-weight:600;">' + dRoi.toFixed(2) + '</td>';
        dailyTable += '</tr>';
      });
      dailyTable += '</tbody></table>';
    }

    // ── 该渠道本周 vs 上周对比 ──
    var weekCompare = '';
    var thisWeek = chHistory.slice(-7).filter(function(h){ return h.cost > 0; });
    var prevWeek = chHistory.slice(-14, -7).filter(function(h){ return h.cost > 0; });
    var twAvg = thisWeek.length ? (thisWeek.reduce(function(s,h){return s+h.cost;},0)/thisWeek.length) : 0;
    var pwAvg = prevWeek.length ? (prevWeek.reduce(function(s,h){return s+h.cost;},0)/prevWeek.length) : 0;
    var wkChg = pwAvg > 0 ? ((twAvg-pwAvg)/pwAvg*100) : 0;
    if (thisWeek.length || prevWeek.length) {
      weekCompare = '<div style="display:flex;gap:10px;margin-top:6px;">';
      weekCompare += '<div style="flex:1;background:#fff;border-radius:6px;padding:6px 8px;text-align:center;border:1px solid #e2e8f0;">';
      weekCompare += '<div style="font-size:10px;color:#64748b;">近7天日均</div>';
      weekCompare += '<div style="font-size:14px;font-weight:800;color:#be185d;">' + fmtN0(Math.round(twAvg)) + '</div>';
      weekCompare += '<div style="font-size:9px;color:#94a3b8;">' + thisWeek.length + '天有数据</div>';
      weekCompare += '</div>';
      weekCompare += '<div style="flex:1;background:#fff;border-radius:6px;padding:6px 8px;text-align:center;border:1px solid #e2e8f0;">';
      weekCompare += '<div style="font-size:10px;color:#64748b;">前7天日均</div>';
      weekCompare += '<div style="font-size:14px;font-weight:800;color:#475569;">' + fmtN0(Math.round(pwAvg)) + '</div>';
      weekCompare += '<div style="font-size:9px;color:#94a3b8;">' + prevWeek.length + '天有数据</div>';
      weekCompare += '</div>';
      if (pwAvg > 0) {
        var wkColor = wkChg > 0 ? '#dc2626' : '#15803d';
        var wkArrow = wkChg > 0 ? '↑' : '↓';
        weekCompare += '<div style="flex:1;background:#fff;border-radius:6px;padding:6px 8px;text-align:center;border:1px solid #e2e8f0;">';
        weekCompare += '<div style="font-size:10px;color:#64748b;">周环比</div>';
        weekCompare += '<div style="font-size:14px;font-weight:800;color:' + wkColor + ';">' + wkArrow + Math.abs(wkChg).toFixed(0) + '%</div>';
        weekCompare += '<div style="font-size:9px;color:#94a3b8;">' + (wkChg>0?'投入加大':'投入缩减') + '</div>';
        weekCompare += '</div>';
      }
      weekCompare += '</div>';
    }

    // ── 分析说明（针对该渠道）──
    var chRole = chPct >= 50 ? '【主力渠道】' : (chPct >= 15 ? '【辅助渠道】' : '【补充渠道】');
    var chRoleDesc = chPct >= 50 ? '花费占全店推广预算的' + chPct.toFixed(0) + '%，是该店铺推广的核心驱动力'
      : (chPct >= 15 ? '花费占全店推广预算的' + chPct.toFixed(0) + '%，作为重要流量补充渠道'
      : '花费仅占全店推广预算的' + chPct.toFixed(0) + '%，属于试探性投放阶段');
    var chTrendDesc = '';
    if (ch14Days >= 7) {
      if (chCost > chDailyAvg * 1.1) chTrendDesc = '今日花费高于近14天日均（' + fmtN0(Math.round(chDailyAvg)) + '元），说明近期投放力度有所加大';
      else if (chCost < chDailyAvg * 0.9) chTrendDesc = '今日花费低于近14天日均（' + fmtN0(Math.round(chDailyAvg)) + '元），投放强度有所减弱';
      else chTrendDesc = '今日花费与近14天日均（' + fmtN0(Math.round(chDailyAvg)) + '元）基本持平，投放策略稳定';
    } else {
      chTrendDesc = '该渠道数据天数较少（' + ch14Days + '天），趋势尚不明显';
    }
    var analysisText = '<div><b>' + channel + '</b> ' + chRole + '</div>';
    analysisText += '<div style="margin-top:4px;">• ' + chRoleDesc + '。</div>';
    analysisText += '<div>• ' + chTrendDesc + '。</div>';
    if (prevChCost > 0) {
      analysisText += '<div>• 较昨日：' + (chMom > 0 ? '花费上涨' + Math.abs(chMom).toFixed(1) + '%' : '花费下降' + Math.abs(chMom).toFixed(1) + '%') + '，调整幅度' + (Math.abs(chMom) > 10 ? '较大，建议关注效果变化' : '较小，属于正常波动') + '。</div>';
    }
    // 占比趋势
    var firstPct = chHistory.length > 0 ? chHistory[0].pct : 0;
    var lastPct = chHistory[chHistory.length-1] ? chHistory[chHistory.length-1].pct : 0;
    var pctTrend = lastPct - firstPct;
    if (ch14Days >= 3 && firstPct > 0) {
      analysisText += '<div>• 占比趋势：近14天该渠道花费占比从' + firstPct.toFixed(1) + '% → ' + lastPct.toFixed(1) + '%'
        + (pctTrend > 2 ? '，份额持续扩大，预算在向其集中' : (pctTrend < -2 ? '，份额在缩小，预算可能有外流' : '，基本保持稳定') ) + '。</div>';
    }

    // ── 总结（聚焦该渠道）──
    var summaryText = '';
    summaryText += '今日 <b>' + channel + '</b> 花费 ' + fmt(chCost) + '，占全店推广预算的 ' + chPct.toFixed(0) + '%。';
    summaryText += ' 全店综合ROI ' + blendedRoi.toFixed(2) + '（' + roiLabel + '）。';
    if (prevChCost > 0) {
      summaryText += ' 该渠道较昨日' + (chMom > 0 ? '上涨' : '下降') + Math.abs(chMom).toFixed(1) + '%';
    }
    if (ch14Days >= 3) {
      summaryText += '，近7天日均投放 ' + fmtN0(Math.round(chPrev7Avg)) + ' 元';
      if (pwAvg > 0) {
        summaryText += '，' + (wkChg > 0 ? '较前一周' + Math.abs(wkChg).toFixed(0) + '%加大投放力度' : '较前一周缩减' + Math.abs(wkChg).toFixed(0) + '%')
      }
    }
    summaryText += '。';

    // ── 建议（针对该渠道）──
    var tips = [];
    if (chPct > 60) {
      tips.push('⚠️ <b>过度依赖风险</b>：该渠道占推广预算' + chPct.toFixed(0) + '%，一旦该渠道效果波动将严重影响全店流量。建议控制预算占比不超过60%，将部分预算分配到其他渠道对冲风险。');
    }
    if (chMom > 15) {
      tips.push('📈 <b>单日大幅加投</b>：今日花费较昨日暴涨' + Math.abs(chMom).toFixed(0) + '%，需确认是否人为调整。ROI如未同步提升，建议明日回调观察。');
    } else if (chMom < -15) {
      tips.push('📉 <b>单日大幅缩减</b>：今日花费较昨日骤降' + Math.abs(chMom).toFixed(0) + '%，排查是否为预算耗尽或系统自动下调出价。');
    }
    if (chPct < 5 && chCost > 0) {
      tips.push('🧪 <b>补充渠道测试</b>：该渠道占比仅' + chPct.toFixed(0) + '%（¥' + fmtN0(Math.round(chCost)) + '），建议<b>小幅提升30-50%预算</b>测试增量空间，观察ROI变化。');
    }
    if (ch14Days >= 7 && chDailyAvg > 0) {
      var costCV = 0;
      var costMean = chHistory.reduce(function(s,h){return s+h.cost;},0)/chHistory.length;
      if (costMean > 0) {
        var variance = chHistory.reduce(function(s,h){return s+Math.pow(h.cost-costMean,2);},0)/chHistory.length;
        costCV = Math.sqrt(variance)/costMean;
      }
      if (costCV > 0.5) {
        tips.push('📊 <b>投放波动较大</b>：该渠道近14天花费波动系数较高（CV=' + costCV.toFixed(2) + '），建议稳定出价策略，避免大起大落影响系统学习。');
      }
    }
    if (tips.length === 0) {
      tips.push('👍 <b>状态正常</b>：该渠道投放稳定、占比合理、ROI健康，建议维持当前策略并持续监控。');
    }

    // ── 组装 HTML（精简版：首屏=KPI+价值看板，其余折叠）──
    var h = '';
    h += '<div style="padding:4px 0;">';

    // ── 0. 紧凑头部（单行）──
    h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:4px;">';
    h += '<div><span style="font-size:16px;font-weight:800;color:#be185d;">' + channel + '</span>';
    h += ' <span style="font-size:11px;color:#fff;background:' + (platform==='天猫'?'#be185d':'#16a34a') + ';padding:1px 8px;border-radius:10px;font-weight:600;">' + platform + '</span>';
    h += ' <span style="font-size:12px;color:#64748b;">' + curDate + '</span></div>';
    h += '<div style="font-size:11px;color:#94a3b8;">' + ch14Days + '天数据 · ' + dayAllRows.length + '个渠道</div>';
    h += '</div>';

    // ── 1. 核心 KPI 条（4卡紧凑）──
    h += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;">';
    // 花费
    h += '<div style="background:#fff;border-radius:8px;padding:10px 12px;text-align:center;border:1px solid #e2e8f0;">';
    h += '<div style="font-size:18px;font-weight:800;color:#be185d;">' + fmt(chCost) + '</div>';
    h += '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">该渠道花费</div>';
    if (prevChCost > 0) { h += '<div style="font-size:10px;color:'+(chMom>0?'#dc2626':'#15803d')+';margin-top:1px;">'+(chMom>0?'↑':'↓')+Math.abs(chMom).toFixed(1)+'% vs昨日</div>'; }
    h += '</div>';
    // ROI
    h += '<div style="background:#fff;border-radius:8px;padding:10px 12px;text-align:center;border:1px solid #e2e8f0;">';
    h += '<div style="font-size:18px;font-weight:800;color:'+roiColor+';">' + blendedRoi.toFixed(2) + '</div>';
    h += '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">综合ROI</div>';
    h += '<div style="font-size:10px;color:'+roiColor+';margin-top:1px;font-weight:700;">' + roiLabel + '</div></div>';
    // 占比
    h += '<div style="background:#fff;border-radius:8px;padding:10px 12px;text-align:center;border:1px solid #e2e8f0;">';
    h += '<div style="font-size:18px;font-weight:800;color:#475569;">' + chPct.toFixed(0) + '%</div>';
    h += '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">占全店</div></div>';
    // 日均
    h += '<div style="background:#fff;border-radius:8px;padding:10px 12px;text-align:center;border:1px solid #e2e8f0;">';
    h += '<div style="font-size:18px;font-weight:800;color:#64748b;">' + fmtN0(Math.round(chPrev7Avg)) + '</div>';
    h += '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">近7天日均</div></div>';
    h += '</div>';

    // ══════════════════════════════════════
    // ── 2. 推广计划价值看板（NEW）──
    // ══════════════════════════════════════
    h += '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:10px;">';
    h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">';
    h += '<div><span style="font-size:14px;font-weight:800;color:#334155;">🎯 推广计划价值看板</span>';
    h += '<span style="font-size:11px;color:#94a3b8;margin-left:8px;">按 ROI 分档 · ' + curDate + '</span></div>';
    h += '<div style="font-size:10px;color:#64748b;background:#f8fafc;padding:3px 10px;border-radius:12px;"><1.5 亏损 ｜ ~2 保本 ｜ >2.5 赚钱</div></div>';

    // 三档分类：用当天所有渠道/计划的 ROI 数据
    // 天猫：渠道级 ROI 用全店成交 / 渠道花费（因数据源无分渠道成交）
    // 拼多多：由 renderPddPlanDetail 单独处理，这里只显示天猫
    var tierLoss = [], tierOk = [], tierGood = [];
    var dayGmv = 0;  // 当天全店成交（天猫）
    dayAllRows.forEach(function(r){ if ((r.platform||'天猫') === '天猫') { dayGmv = Math.max(dayGmv, parseFloat(r.shop_gmv)||0, parseFloat(r.total_gmv)||0); }});
    dayAllRows.forEach(function(r){
      if ((r.platform||'天猫') !== '天猫') return;  // 只看天猫渠道
      var c = parseFloat(r.cost)||0;
      if (c < 1) return; // 忽略无花费行
      // 天猫没有分渠道成交，用全店成交作为共同产出，按渠道花费拆分 ROI
      var roi = dayGmv / c;  // 渠道花费对应的全店 ROI（供分档参考）
      var item = { name:r.channel, cost:c, gmv:dayGmv, roi:roi, platform:r.platform||'天猫' };
      if (roi < 1.5) tierLoss.push(item);
      else if (roi <= 2.5) tierOk.push(item);
      else tierGood.push(item);
    });
    // 按花费排序
    tierLoss.sort(function(a,b){return b.cost-a.cost});
    tierOk.sort(function(a,b){return b.cost-a.cost});
    tierGood.sort(function(a,b){return b.cost-a.cost});

    var lossCost = tierLoss.reduce(function(s,x){return s+x.cost},0);
    var okCost = tierOk.reduce(function(s,x){return s+x.cost},0);
    var goodCost = tierGood.reduce(function(s,x){return s+x.cost},0);
    var tierTotal = lossCost + okCost + goodCost; // 渠道级花费总和（作分母）

    // 三列卡片
    var tiers = [

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 弹窗
  const mask = document.getElementById('mask');
  const formFields = document.getElementById('formFields');

  function buildForm(row) {
    formFields.innerHTML = cfg.fields.map(f => {
      if (f.type === 'computed') return '';
      const val = row ? (row[f.key] || '') : '';
      let ctrl;
      if (f.type === 'select') {
        const opts = '<option value="">— 请选择 —</option>' +
          f.options.map(o => '<option value="' + o + '"' + (val === o ? ' selected' : '') + '>' + o + '</option>').join('');
        ctrl = '<select data-key="' + f.key + '">' + opts + '</select>';
      } else if (f.type === 'textarea') {
        ctrl = '<textarea data-key="' + f.key + '">' + escapeHtml(val) + '</textarea>';
      } else {
        const t = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text');
        const step = f.type === 'number' ? ' step="any"' : '';
        ctrl = '<input type="' + t + '" data-key="' + f.key + '" value="' + escapeHtml(val) + '"' + step + '>';
      }
      return '<div class="field"><label>' + f.label + '</label>' + ctrl + '</div>';
    }).join('');
  }

  function openAdd() {
    editingIdx = -1;
    document.getElementById('modalTitle').textContent = '新增 · ' + cfg.title;
    buildForm(null);
    mask.classList.add('show');
  }
  function openEdit(idx) {
    editingIdx = idx;
    document.getElementById('modalTitle').textContent = '编辑 · ' + cfg.title;
    buildForm(Store.get(id)[idx]);
    mask.classList.add('show');

  function closeModal() { mask.classList.remove('show'); }

  function save() {
    const row = {};
    formFields.querySelectorAll('[data-key]').forEach(el => {
      row[el.dataset.key] = el.value.trim();
    });
    if (editingIdx >= 0) Store.update(id, editingIdx, row);
    else Store.add(id, row);
    closeModal();
    renderFixed();
  }
  function del(idx) {
    if (id === 'automation-projects') {
      var allRows = Store.get(id);
      if (idx < 0 || idx >= allRows.length) return;
      if (!confirm('确定将「' + (allRows[idx].name || '') + '」移入回收站？可随时复原。')) return;
      allRows[idx]._deleted = true;
      Store.set(id, allRows);
      renderFixed();
    } else {
      if (confirm('确定删除这条记录？')) { Store.remove(id, idx); renderFixed(); }
    }
  }
  function restoreRow(idx) {
    var allRows = Store.get(id);
    if (idx < 0 || idx >= allRows.length) return;
    allRows[idx]._deleted = false;
    Store.set(id, allRows);
    renderFixed();
  }

  // ── 构建富日报详情 HTML（仿飞书日报卡片风格）──
  function buildReportHtml(row) {
    var date = row.date || '';
    var platform = row.platform || '';
    var sales = parseFloat(row.sales) || 0;
    var orders = parseInt(row.orders) || 0;
    var visitors = parseInt(row.visitors) || 0;
    var aovVal = (sales && orders) ? (sales / orders).toFixed(1) : '-';
    var cvr = parseFloat(row.cvr) || 0;
    var promo = parseFloat(row.promotion_cost) || 0;
    var promoRatio = (sales && promo) ? (promo / sales * 100).toFixed(1) + '%' : '—';

    // 状态判定
    var trend = row.trend || '';

  // 状态标签样式
  var _stCss = '<style>.st{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}' +

  // ── 日报详情渲染：结构化 HTML（参考销售预警卡片布局）──
  function renderDailyReportDetail(row, content, detailCache, salesAlertCache) {
    var sections = parseDailyContent(content);

    var trendBadge = getStatusBadge(row);

    // ── 解析文本内容为结构化 sections ──
    function parseDailyContent(txt) {
      var sec = {};
      var cur = null;
      if (!txt) return sec;
      txt.split('\n').forEach(function(l) {
        var m = l.match(/【(.+?)】/);
        if (m) { cur = m[1]; sec[cur] = []; return; }
        if (cur && l.trim()) sec[cur].push(l.trim());

      return sec;
    }
    function secVal(arr, kw) {
      if (!arr) return null;
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].indexOf(kw) >= 0) {
          var p = arr[i].split(/[：:]/);
          return p.length >= 2 ? p.slice(1).join('').trim() : null;
        }
      }
      return null;
    }
    function tryNum(v, def) {
      if (v === null || v === undefined || v === '—' || v === '') return def;
      var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
      return isNaN(n) ? def : n;

    // ── 历史深度数据对比分析 ──
    function buildDeepCompareReport(cache, curDate, plat, curContent) {
      if (!cache || !Array.isArray(cache) || cache.length < 2) return '';
      // 1. 取同平台的近期历史记录（排除当天）
      var samePlat = cache.filter(function(d) {
        return d.platform === plat && d._key !== (curDate + '_' + plat) && d.content;
      });
      // 只取最近 7 天（含当天用于切片，取前 7 条）
      samePlat.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      var recent = samePlat.slice(0, 7);
      if (recent.length < 2) return '';  // 至少 2 条历史才能对比

      // 2. 解析当前深度的数据项
      var curSec = isTmall ? (parseDailyContent(curContent)['天猫深度数据'] || [])
                           : (parseDailyContent(curContent)['拼多多深度数据'] || []);
      if (!curSec.length) return '';

      // 3. 定义需要对比的指标（key 前缀 → 高低取向）
      var metrics = [];
      var metricKeys = isPdd ? ['支付买家数','商品浏览数','UV/PV比'] : 
        ['支付买家数','浏览量','官方客单价','净支付金额','订单退款率','金额退款率','签收退款率',
         '老客复购金额','加购人数','加购件数','收藏人数','平均停留','店铺客户数'];

      metricKeys.forEach(function(kw) {
        var curV = secVal(curSec, kw);
        if (!curV || curV === '—') return;
        var curN = tryNum(curV);
        if (curN === 0 && curV === '0') return;

        // 收集历史值
        var histVals = [];
        recent.forEach(function(h) {
          var hSec = isTmall ? (parseDailyContent(h.content)['天猫深度数据'] || [])
                             : (parseDailyContent(h.content)['拼多多深度数据'] || []);
          var hv = secVal(hSec, kw);
          if (hv && hv !== '—') {
            var hn = tryNum(hv);
            if (hn !== 0 || (hv === '0' || hv === 0)) histVals.push(hn);
          }
        });
        if (histVals.length < 2) return;

        // 计算历史平均
        var sum = 0;
        histVals.forEach(function(v){ sum += v; });
        var avg = sum / histVals.length;
        var diff = curN - avg;
        var pct = avg !== 0 ? (diff / avg * 100) : 0;

        // 判断方向：higherBetter=true 指标越大越好
        var higherBetter = true;
        if (kw.indexOf('退款率') >= 0 || kw.indexOf('占比') >= 0 || kw.indexOf('停留') >= 0) higherBetter = false;
        if (kw === 'UV/PV比') higherBetter = false;
        if (kw === '官方客单价') higherBetter = false;

        // 状态判定
        var status = '正常';
        var statusColor = '#64748b';
        var statusBg = '#f8fafc';
        if (higherBetter) {
          if (pct >= 10)       { status = '向好';    statusColor = '#15803d'; statusBg = '#f0fdf4'; }
          else if (pct <= -20) { status = '严重下滑'; statusColor = '#dc2626'; statusBg = '#fef2f2'; }
          else if (pct <= -10) { status = '预警';    statusColor = '#d97706'; statusBg = '#fffbeb'; }
          else if (pct <= -5)  { status = '下滑';    statusColor = '#ea580c'; statusBg = '#fff7ed'; }
        } else {
          if (pct <= -10)       { status = '向好';    statusColor = '#15803d'; statusBg = '#f0fdf4'; }
          else if (pct >= 20)   { status = '严重下滑'; statusColor = '#dc2626'; statusBg = '#fef2f2'; }
          else if (pct >= 10)   { status = '预警';    statusColor = '#d97706'; statusBg = '#fffbeb'; }
          else if (pct >= 5)    { status = '下滑';    statusColor = '#ea580c'; statusBg = '#fff7ed'; }
        }

        var arrow = pct > 0 ? '↑' : (pct < 0 ? '↓' : '→');
        metrics.push({
          key: kw,
          curVal: curV,
          curNum: curN,
          avgVal: avg,
          diffVal: diff,
          pct: pct,
          arrow: arrow,
          diffStr: (pct > 0 ? '+' : '') + pct.toFixed(1) + '%',
          status: status,
          statusColor: statusColor,
          statusBg: statusBg,
          higherBetter: higherBetter
        });
      });

      if (metrics.length < 2) return '';

      // 4. 生成报告 HTML
      var title = isPdd ? '📊 拼多多深度数据对比分析' : '📊 天猫深度数据对比分析';
      var h = '<div style="margin-top:14px;margin-bottom:8px;">';

      h += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;">';
      metrics.forEach(function(m) {
        // 值颜色
        var valColor = m.status === '向好' ? '#15803d' : (m.status === '严重下滑' ? '#dc2626' : (m.status === '预警' || m.status === '下滑') ? '#d97706' : '#334155');
        h += '<div style="background:' + m.statusBg + ';border:1px solid ' + (m.status === '向好' ? '#bbf7d0' : (m.status === '严重下滑' ? '#fecaca' : (m.status === '预警' || m.status === '下滑') ? '#fde68a' : '#e2e8f0')) + ';border-radius:8px;padding:8px 10px;">';

        h += '</div>';

        h += '<span style="font-size:15px;font-weight:800;color:' + valColor + ';">' + m.curVal + '</span>';
        h += '<span style="font-size:11px;font-weight:600;color:' + (m.pct > 0 ? (m.higherBetter ? '#15803d' : '#dc2626') : (m.pct < 0 ? (m.higherBetter ? '#dc2626' : '#15803d') : '#64748b')) + ';">' + m.arrow + ' ' + m.diffStr + '</span>';
        h += '</div>';
        h += '<div style="font-size:10px;color:#94a3b8;margin-top:2px;">近7日均值 ' + (m.avgVal % 1 === 0 ? m.avgVal.toLocaleString() : m.avgVal.toFixed(1)) + '</div>';
        h += '</div>';
      });
      h += '</div>';

      // 5. 综合建议
      var badMetrics = metrics.filter(function(m){ return m.status === '严重下滑' || m.status === '预警' || m.status === '下滑'; });
      var goodMetrics = metrics.filter(function(m){ return m.status === '向好'; });
      var suggestions = [];

        if (buyer && buyer.status === '下滑') suggestions.push('支付买家数下滑，建议检查转化漏斗是否存在卡点，优化商品详情页。');
        var pv = metrics.find(function(m){ return m.key === '商品览数'; });
        if (pv && pv.status === '下滑') suggestions.push('商品浏览数(PV)下降，可能需要加大推广曝光或优化标题/主图。');
        var uvPv = metrics.find(function(m){ return m.key === 'UV/PV比'; });
        if (uvPv && uvPv.status === '下滑') suggestions.push('UV/PV比偏低说明用户浏览深度不足，建议优化店铺导航和关联推荐。');
        if (goodMetrics.length > 0) suggestions.push('✅ ' + goodMetrics.map(function(m){ return m.key; }).join('、') + ' 表现良好，继续保持。');
        suggestions.push('💡 建议持续关注推广 ROI，结合商品毛利灵活调整出价策略。');
      }
      if (isTmall) {
        if (badMetrics.length > 0) {
          var badNames = badMetrics.map(function(m){ return m.key; }).join('、');
          suggestions.push('⚠️ 需关注：' + badNames + ' 表现不佳，建议针对性排查。');
        }
        // 天猫专有建议
        var refundOrder = metrics.find(function(m){ return m.key === '订单退款率'; });
        if (refundOrder && (refundOrder.status === '严重下滑' || refundOrder.status === '预警')) suggestions.push('订单退款率上升，建议核查近期订单售后原因，优化商品描述和物流体验。');
        var refundAmt = metrics.find(function(m){ return m.key === '金额退款率'; });
        if (refundAmt && (refundAmt.status === '严重下滑' || refundAmt.status === '预警')) suggestions.push('金额退款率偏高，可能涉及高客单价商品问题，建议重点排查对应 SKU。');
        var revisit = metrics.find(function(m){ return m.key === '老客复购金额'; });
        if (revisit && (revisit.status === '严重下滑' || revisit.status === '预警')) suggestions.push('老客复购金额下滑，建议加大老客关怀和会员营销力度。');
        var cart = metrics.find(function(m){ return m.key === '加购人数'; });
        if (cart && (cart.status === '严重下滑' || cart.status === '预警')) suggestions.push('加购人数下降，建议优化购物车引导和促销策略。');
        var fav = metrics.find(function(m){ return m.key === '收藏人数'; });

      h += '</div>';

    }

    var coreItems = sections['核心指标'] || [];
    var promoItems = sections['推广情况'] || [];
    var deepItems = isTmall ? (sections['天猫深度数据'] || []) : (isPdd ? (sections['拼多多深度数据'] || []) : []);

    // ── 拼多多产品维度对比分析（基于 sales-alert-details.json）──
    function buildProductCompareReport(cache, curDate) {
      if (!cache || !Array.isArray(cache) || cache.length < 2) return '';
      var curEntry = null, histList = [];
      cache.forEach(function(d) {
        if (d.platform === '拼多多' && d.products && Array.isArray(d.products)) {

      histList.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

      // 构建历史产品利润映射 { productName: { profit_amt:[], margin:[] } }
      var histMap = {};
      histList.forEach(function(h) {
        h.products.forEach(function(p) {
          if (!histMap[p.product]) histMap[p.product] = { profit_amts: [], margins: [], ships: [] };
          histMap[p.product].profit_amts.push(p.profit_amt || 0);
          if (p.margin !== null && p.margin !== undefined) histMap[p.product].margins.push(p.margin);
          histMap[p.product].ships.push(p.ship || 0);
        });
      });
      function avg(arr) { if (!arr || !arr.length) return 0; var s=0; arr.forEach(function(v){s+=v;}); return s/arr.length; }

      // 利润贡献 TOP 产品（当前）
      var sortedProds = curEntry.products.slice().sort(function(a,b){ return Math.abs(b.profit_amt||0) - Math.abs(a.profit_amt||0); });

      var prodDiffs = [];
      sortedProds.forEach(function(p) {

        var curProfit = p.profit_amt || 0;
        var curMargin = p.margin;
        var diffAmt = curProfit - avgProfit;
        var pctChg = avgProfit !== 0 ? (diffAmt / Math.abs(avgProfit) * 100) : 0;

        // 状态判定（利润额越大越好）
        var status = '正常', statusColor = '#64748b', statusBg = '#f8fafc';

        else if (pctChg <= -30)    { status='🔴 严重下滑'; statusColor='#dc2626'; statusBg='#fef2f2'; }
        else if (pctChg <= -15)    { status='🟡 预警';   statusColor='#d97706'; statusBg='#fffbeb'; }
        else if (pctChg <= -5)     { status='🟠 下滑';   statusColor='#ea580c'; statusBg='#fff7ed'; }

        var marginStr = (curMargin !== null && curMargin !== undefined) ? curMargin.toFixed(1) + '%' : '—';
        var marginDiff = (avgMargin !== 0 && curMargin !== null && curMargin !== undefined) ? (curMargin - avgMargin).toFixed(1) : '—';
        prodDiffs.push({

        });
      });

      // 统计

      var fmt = function(n){ return '¥' + Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); };

  // ── 从行数据内联生成日报文本（fetch 失败时 fallback，格式与 details JSON 一致）──
  function buildInlineReport(r) {
    var s = r.sales, o = r.orders, v = r.visitors;
    var aov = (s && o) ? (s / o).toFixed(1) : '—';
    var promo = parseFloat(r.promotion_cost) || 0;
    var ratio = (s && promo) ? (promo / s * 100).toFixed(1) : '—';
    var cvr = (o && v) ? (o / v * 100).toFixed(2) : '—';
    var tag = r.__merged ? ' · 合并' : '';
    return '【核心指标】\n' +
      '  销售额(GMV)：¥' + fmtNum(s) + '\n' +
      '  订单数：' + fmtNum(o) + '\n' +
      '  访客数(UV)：' + fmtNum(v) + '\n' +
      '  客单价(AOV)：¥' + aov + '\n' +
      '  转化率：' + cvr + '%\n\n' +
      '【推广情况】\n' +
      '  推广花费：¥' + fmtNum(promo) + '\n' +
      '  推广占比：' + ratio + '%\n\n' +
      '— 数据来源：飞书 Base 自动同步 · ' + (r.date || '') + ' —';
    function fmtNum(n) { if (!n && n !== 0) return '—'; return Number(n).toLocaleString('zh-CN', {minimumFractionDigits: n%1===0?0:2}); }
  }

  // ── 缺失明细：从 automation-log.json 查找该任务的最近运行记录，展示失败步骤 ──
  async function buildMissingDetailSection(taskName) {
    var html = '';
    html += '<div style="margin-top:14px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;overflow:hidden;">';
    html += '<div style="background:linear-gradient(135deg,#fef3c7,#fde68a);padding:10px 14px;display:flex;align-items:center;gap:8px;">';
    html += '<span style="font-size:15px;font-weight:700;color:#92400e;">🔍 输出缺失明细</span>';
    html += '<span style="font-size:11px;color:#b45309;">以下数据源未能完整输出，导致标记为「部分」</span>';
    html += '</div>';

    try {
      var logResp = await fetch('data/automation-log.json');
      if (!logResp.ok) throw new Error('log fetch failed');
      var logData = await logResp.json();

      // 模糊关键词匹配（≥2字中文词交叉匹配日志任务名）
      var kw = extractKeywords(taskName);
      var taskLogs = logData.filter(function(e) {
        if (!e.task) return false;
        if (taskName.indexOf(e.task) >= 0 || e.task.indexOf(taskName) >= 0) return true;
        return kw.some(function(k){ return e.task.indexOf(k) >= 0; });
      }).sort(function(a,b){ return (b.ts||'').localeCompare(a.ts||''); }).slice(0, 5);

      var relatedSources = findRelatedDataSources(taskName, kw);

      if (taskLogs.length === 0 && relatedSources.length === 0) {
        html += '<div style="padding:12px 14px;font-size:12px;color:#b45309;">未找到该任务的运行日志或关联数据源</div>';
        html += '</div>';
        return html;
      }

      // 展示每条日志的关键信息
      html += '<div style="padding:10px 14px;">';
      taskLogs.forEach(function(log, i) {
        var ts = log.ts || '';
        var shortTime = ts.replace('T', ' ').substring(0, 16);
        var logStatus = log.status || '';
        var statusLabel = log.status_label || logStatus;
        var summary = log.summary || '';
        var details = log.details || '';
        var steps = log.steps || [];

        // 状态颜色
        var lsClr = logStatus === 'success' ? '#16a34a' :
                     (logStatus === 'warning' ? '#d97706' :
                     (logStatus === 'error' ? '#dc2626' : '#64748b'));

        html += '<div style="margin-bottom:' + (i < taskLogs.length-1 ? '12px' : '0') + ';border-bottom:' + (i < taskLogs.length-1 ? '1px dashed #fcd34d' : 'none') + ';padding-bottom:' + (i < taskLogs.length-1 ? '10px' : '0') + ';">';

        // 日志头部：时间 + 状态
        html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">';
        html += '<span style="font-size:11px;color:#94a3b8;font-family:monospace;">' + shortTime + '</span>';
        html += '<span style="color:' + lsClr + ';font-size:11px;font-weight:600;">' + statusLabel + '</span>';
        if (log.trigger_type) {
          html += '<span style="font-size:10px;color:#94a3b8;background:#f1f5f9;padding:1px 6px;border-radius:4px;">' + log.trigger_type + '</span>';
        }
        html += '</div>';

        // 摘要
        if (summary) {
          html += '<div style="font-size:12px;color:#334155;margin-bottom:4px;">' + escapeHtml(summary) + '</div>';
        }

        // 步骤明细（关键！展示每个子步骤的 ok/warn/error/no_data/skip）
        if (steps && steps.length > 0) {
          html += '<div style="margin-top:6px;">';
          steps.forEach(function(step) {
            var stepStatus = step.status || 'unknown';
            var icon = stepStatus === 'ok' ? '✅' :
                       (stepStatus === 'warn' ? '⚠️' :
                       ((stepStatus === 'error' || stepStatus === 'no_data') ? '❌' :
                        (stepStatus === 'skip' ? '⏭️' : '❓')));
            var sColor = stepStatus === 'ok' ? '#16a34a' :
                        ((stepStatus === 'error' || stepStatus === 'no_data') ? '#dc2626' :
                         (stepStatus === 'warn' || stepStatus === 'skip' ? '#d97706' : '#94a3b8'));
            var msg = step.msg || '';
            var count = step.count !== undefined ? (' · ' + step.count + ' 条') : '';
            var boardName = step.board || '';
            html += '<div style="display:flex;align-items:flex-start;gap:6px;padding:3px 0;font-size:11px;line-height:1.5;">';
            html += '<span>' + icon + '</span>';
            html += '<span style="color:' + sColor + ';font-weight:500;white-space:nowrap;min-width:120px;">' + escapeHtml(boardName) + '</span>';
            html += '<span style="color:#475569;flex:1;">' + escapeHtml(msg) + '<span style="color:#94a3b8;">' + count + '</span></span>';
            html += '</div>';
          });
          html += '</div>';
        }

        // 详细描述（如果有 ⚠️ 标记的内容）
        if (details && details.indexOf('⚠️') >= 0) {
          var _today = new Date().toISOString().slice(0, 10);
          var lines = details.split('\n').filter(function(l){ return l.trim().indexOf('⚠️') >= 0 || l.trim().indexOf('[error]') >= 0 || l.trim().indexOf('[no_data]') >= 0 || l.trim().indexOf('[skip]') >= 0 || l.trim().indexOf('[warn]') >= 0; });
          if (lines.length > 0) {
            html += '<div style="margin-top:6px;background:#fff;padding:6px 10px;border-radius:6px;border:1px solid #fde68a;">';
            lines.forEach(function(l) {
              var _lt = l.trim();
              // 当日数据缺失属正常，不标红为异常，降级为灰色提示
              if (_lt.indexOf(_today) >= 0 && _lt.indexOf('缺失') >= 0) {
                html += '<div style="font-size:11px;color:#94a3b8;line-height:1.6;">ℹ️ ' + escapeHtml(_lt) + '（当日数据尚未产生，属正常）</div>';
              } else {
                html += '<div style="font-size:11px;color:#92400e;line-height:1.6;">' + escapeHtml(_lt) + '</div>';
              }
            });
            html += '</div>';
          }
        }

        html += '</div>'; // end of one log entry
      });
      html += '</div>'; // padding

    
      // ── 关联数据源状态（数据文件层面的缺失检测）──
      if (relatedSources && relatedSources.length > 0) {
        html += '<div style="margin-top:12px;padding:10px;background:#fff;border-radius:8px;border:1px solid #fde68a;">';
        html += '<div style="font-size:12px;font-weight:700;color:#92400e;margin-bottom:6px;">📂 关联数据源状态</div>';
        relatedSources.forEach(function(src) {
          var icon = src.status === 'stale' ? '⏰' : (src.status === 'empty' ? '📭' : '❓');
          var color = src.status === 'stale' ? '#d97706' : '#dc2626';
          html += '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;">';
          html += '<span>' + icon + '</span>';
          html += '<span style="font-weight:500;min-width:70px;">' + src.label + '</span>';
          html += '<span style="color:' + color + ';flex:1;">' + src.msg + '</span>';
          html += '</div>';
        });
        html += '</div>';
      }

} catch(err) {
      html += '<div style="padding:12px 14px;font-size:12px;color:#b45309;">加载运行日志失败：' + escapeHtml(err.message) + '</div>';
    }

    html += '</div>'; // main container
    return html;
  }

    html += '<div style="font-size:12px;font-weight:700;color:#15803d;margin-bottom:6px;display:flex;align-items:center;gap:4px;"><span>🔧</span> 怎么修</div>';
    html += '<div style="background:#f0fdf4;border-radius:8px;padding:10px;">';
    if (diagnosis.fixes && diagnosis.fixes.length > 0) {
      diagnosis.fixes.forEach(function(fix, idx) {
        var fixIcon = fix.auto ? '🤖' : '👤';
        html += '<div style="padding:4px 0;font-size:11.5px;line-height:1.5;' + (idx < diagnosis.fixes.length-1 ? 'border-bottom:1 dashed #bbf7d0;' : '') + '">';
        html += '<span>' + fixIcon + ' </span>';
        html += '<span style="color:#166534;">' + escapeHtml(fix.text) + '</span>';
        if (fix.auto) {
          html += ' <span style="font-size:9px;background:#dcfce7;color:#15803d;padding:0 4px;border-radius:3px;">可自动执行</span>';
        }
        html += '</div>';
      });
    } else {
      html += '<div style="font-size:11.5px;color:#166534;">暂无建议修复方案</div>';
    }
    html += '</div></div>';

    html += '</div>'; // grid

    // 底部：任务类型标注 + 上游依赖检查
    if (diagnosis.taskType || diagnosis.dependencies) {
      html += '<div style="padding:8px 14px 12px;background:#f8fafc;border-top:1px solid #e2e8f0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">';
      if (diagnosis.taskType) {
        html += '<span style="font-size:10px;color:#64748b;background:#e2e8f0;padding:2px 8px;border-radius:4px;">类型：' + diagnosis.taskType + '</span>';
      }
      if (diagnosis.dependencies && diagnosis.dependencies.length > 0) {
        diagnosis.dependencies.forEach(function(dep) {
          var depOk = dep.ok;
          var depStyle = depOk ? 'background:#dcfce7;color:#15803d;border-color:#86efac;' : 'background:#fee2e2;color:#dc2626;border-color:#fca5a5;';
          html += '<span style="font-size:10px;' + depStyle + 'padding:2px 7px;border-radius:4px;border:1px solid;">';
          html += (depOk ? '✅' : '⚠️') + ' ' + escapeHtml(dep.name);
          if (!depOk && dep.hint) {
            html += ' <span style="color:#991b1b;">(' + dep.hint + ')</span>';
          }
          html += '</span>';
        });
      }
      html += '</div>';
    }

    html += '</div>'; // main container
    return html;
  }

  // ── 核心诊断引擎：根据任务名称/属性推断问题 ──
  function diagnoseTask(taskName, row) {
    var n = taskName || '';
    var note = row.note || '';
    var lastRun = row.lastRun || '';
    var status = row.status || '';
    var trigger = row.trigger || '';
    var schedule = row.schedule || '';
    var version = row.version || '';

    var result = { severity: 'low', missingItems: [], causes: [], fixes: [], taskType: '', dependencies: [] };

    // ═══ 分类判断 ═══
    var isPushTask = /播报|推送|早报|晚报|密码|日报|聊天/.test(n);
    var isSyncTask = /同步|数据|日报/.test(n) && /店铺|销售|预警/.test(n);
    var isGenTask = /周报|生成|报告/.test(n) && !/播报|推送/.test(n);
    var isSysTask = /工作台|刷新|部署|同步/.test(n) && /系统|员工/.test((row.board||''));
    var isRemindTask = /提醒/.test(n) && trigger === '一次性';

    if (isPushTask) result.taskType = '消息推送类';
    else if (isSyncTask) result.taskType = '数据同步类';
    else if (isGenTask) result.taskType = '报告生成类';
    else if (isSysTask) result.taskType = '系统运维类';
    else if (isRemindTask) result.taskType = '一次性提醒';
    else result.taskType = '通用任务';

    // ═══ 按类型诊断 ═══

    // --- 推送类任务（每日BI播报、每周BI播报、利润预警推送、早报、晚报、动态密码、聊天日报）---
    if (isPushTask) {
      result.severity = 'medium';

      // 缺失项1：飞书推送链路
      if (/播报|预警推送/.test(n)) {
        result.missingItems.push({
          type: 'push', label: '飞书消息推送不完整',
          detail: note || ('该任务通过自动化引擎执行，日志中无直接记录')
        });
        // 原因
        result.causes.push(
          '推送类任务由 WorkBuddy 自动化引擎触发，不走 sync_board_data.py，所以 automation-log.json 中没有直接运行记录'
        );
        if (/BI.*播报|销售额.*播报/.test(n)) {
          result.causes.push(
            '「' + taskName + '」依赖上游数据任务（店铺日报 + 销售预警）的输出结果，上游数据不全则推送内容不完整'
          );
        }
        // 修复方案
        result.fixes.push({ text: '手动触发一次「' + taskName + '」验证推送是否正常到达飞书群', auto: false });
        result.fixes.push({ text: '检查飞书 Bot 是否有目标群的发消息权限', auto: false });

        // 上游依赖
        result.dependencies.push(
          { name: '店铺日报', ok: true, hint: '' },
          { name: 'BI销售分析与预警', ok: true, hint: '' }
        );
      }

      // 早报/晚报/聊天日报
      if (/早报|晚报|聊天日报/.test(n)) {
        result.missingItems.push({
          type: 'push', label: '消息推送记录缺失',
          detail: note || '自动化引擎执行的推送任务，本地日志未记录详细输出'
        });
        result.causes.push(
          '此任务由自动化引擎定时触发，执行记录存储在 WorkBuddy 数据库中，不在 automation-log.json 里'
        );
        result.fixes.push({ text: '在自动化管理页面查看最近一次运行的详细输出', auto: false });
        result.fixes.push({ text: '确认飞书 Bot token 未过期、有权限发送卡片消息', auto: false });

        // 检查 lastRun 时效
        if (lastRun && lastRun !== '—' && lastRun !== '暂无记录') {
          try {
            var lr = parseLastRun(lastRun);
            if (lr) {
              var hoursAgo = (Date.now() - lr.getTime()) / 3600000;
              if (hoursAgo > 48) {
                result.severity = 'high';
                result.missingItems.push({
                  type: 'exec', label: '长时间未执行',
                  detail: '已超过 ' + Math.floor(hoursAgo) + ' 小时未运行'
                });
                result.causes.push('任务已超过 ' + Math.floor(hoursAgo/24) + ' 天未成功执行，可能是调度异常或被暂停');
              }
            }
          } catch(e) {}
        }
      }

      // 动态密码
      if (/动态密码/.test(n)) {
        result.missingItems.push({
          type: 'exec', label: '密码推送未执行',
          detail: note || ''
        });
        result.causes.push('根据备注"' + note + '"，该功能当前处于待确认状态');
        result.fixes.push({ text: '如需恢复：在自动化管理中启用该任务并确认每天 09:00 执行', auto: false });
      }
    }

    // --- 数据同步类 ---
    if (isSyncTask) {
      result.severity = 'medium';
      result.missingItems.push({
        type: 'data', label: '部分数据源同步失败',
        detail: '查看下方「输出缺失明细」中的步骤级详情'
      });
      result.causes.push('飞书 Base 多维表格 API 可能返回空数据或报错（token 过期/网络超时/表权限变更）');
      result.causes.push('部分字段（如推广费）在源表中可能本身为空');
      result.fixes.push({ text: '手动运行 sync_board_data.py 同步最新数据', auto: true });
      result.fixes.push({ text: '检查飞书多维表格 token 是否有效、表 ID 是否变更', auto: false });
    }

    // --- 报告生成类 ---
    if (isGenTask) {
      result.missingItems.push({
        type: 'data', label: '报告输出可能不完整',
        detail: '依赖 daily-pulse.json 的数据完整性'
      });
      result.causes.push('周报生成依赖本周每天的 daily-pulse 数据，若某天数据缺失会影响周报完整性');
      result.fixes.push({ text: '先确保店铺日报数据完整，再重新生成周报', auto: false });
    }

    // --- 系统运维类 ---
    if (isSysTask) {
      if (/刷新/.test(n)) {
        var daysSince = 0;
        try {
          if (lastRun && lastRun !== '—') {
            var lr = parseLastRun(lastRun);
            if (lr) daysSince = Math.floor((Date.now() - lr.getTime()) / 86400000);
          }
        } catch(e){}
        result.missingItems.push({
          type: 'exec', label: '执行频率偏低',
          detail: '每周执行一次，距上次已过 ' + daysSince + ' 天'
        });
        result.causes.push('该任务按周触发，非每日运行是正常设计');
        result.fixes.push({ text: '如需立即刷新：手动运行 deploy_cloud.py 部署到 CloudStudio', auto: true });
      }
      if (/部署/.test(n)) {
        result.missingItems.push({
          type: 'exec', label: '需手动触发生成新版本',
          detail: '员工版分发需要打包 Electron 应用'
        });
        result.causes.push('员工版更新不是自动的，需要手动打包后替换发布包');
        result.fixes.push({ text: '运行员工版打包脚本 → 替换 橙萤员工版.zip', auto: false });
      }
    }

    // --- 一次性提醒 ---
    if (isRemindTask) {
      var expired = false;
      if (schedule) {
        try {
          var st = new Date(schedule);
          if (!isNaN(st.getTime()) && st < new Date()) expired = true;
        } catch(e) {}
      }
      if (expired || !lastRun || lastRun === '—' || lastRun === '暂无记录') {
        result.severity = 'medium';
        result.missingItems.push({
          type: 'exec', label: '提醒尚未处理',
          detail: schedule ? '设定时间：' + schedule : ''
        });
        result.causes.push('一次性提醒仅在到达指定时间后触发一次，过期后不会重复提醒');
        result.fixes.push({ text: '处理后可在自动化管理中将状态改为「已完成」', auto: false });
        result.fixes.push({ text: '如仍需提醒：修改计划时间到未来某个时间点', auto: false });
      }
    }

    // ═══ 通用的 lastRun 过期检测 ═══
    if (lastRun && lastRun !== '—' && lastRun !== '暂无记录' && !isRemindTask) {
      try {
        var lr2 = parseLastRun(lastRun);
        if (lr2) {
          var hrs = (Date.now() - lr2.getTime()) / 3600000;
          if (hrs > 72 && result.severity !== 'high') {
            result.severity = 'high';
            // 不要重复添加
            var hasExpired = result.missingItems.some(function(m){ return m.label.indexOf('未执行') >= 0 || m.label.indexOf('长时间') >= 0; });
            if (!hasExpired) {
              result.missingItems.push({
                type: 'exec', label: '执行已过期',
                detail: '已超过 ' + Math.floor(hrs/24) + ' 天未运行'
              });
              result.causes.push('超过 3 天未执行，可能是自动化调度被中断或任务被禁用');
            }
          }
        }
      } catch(e) {}
    }

    // ═══ 已暂停/已完成 特殊处理 ═══
    if (status === '已暂停') {
      result.causes.push('任务当前状态为「已暂停」，不会自动执行');
      result.fixes.unshift({ text: '在自动化管理中恢复启用该任务', auto: false });
    }
    if (status === '已完成') {
      result.fixes = [{ text: '该任务已完成全部目标，无需修复。可归档或删除。', auto: false }];
      result.missingItems = [];
      result.causes = ['任务已标记为完成，「部分」标记可能来自历史遗留'];
    }

    return result;
  }

  // 辅助：解析 lastRun 时间字符串
  function parseLastRun(lr) {
    if (!lr) return null;
    // 格式: "2026-07-12 08:57" 或 "2026-07-12T08:57"
    var s = lr.replace(' ', 'T');
    if (s.length <= 10) s += 'T00:00';
    if (s.length === 13) s += ':00';
    if (s.length === 16) s += ':00';
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }

  // ── 版本时间线 ──
  function buildVersionTimeline(versionLog) {
    if (!versionLog) return '';
    var parts = versionLog.split(';').filter(function(s){ return s.trim(); }); if (parts.length <= 1) parts = versionLog.split('；').filter(function(s){ return s.trim(); });
    if (parts.length === 0) return '';

    var html = '';
    html += '<div style="margin-top:14px;">';
    html += '<div style="font-size:13px;font-weight:700;color:#334155;margin-bottom:8px;">📋 版本迭代记录</div>';
    html += '<div style="position:relative;padding-left:20px;">';
    // 时间线竖线
    html += '<div style="position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#e2e8f0;"></div>';

    for (var i = 0; i < parts.length; i++) {
      var p = parts[i].trim();
      // 解析版本号和描述（格式："x.y.z 描述文字"）
      var verMatch = p.match(/^(\d+\.\d+\.\d+)\s+(.+)$/);
      var ver = verMatch ? verMatch[1] : '';
      var desc = verMatch ? verMatch[2] : p;
      var isMajor = ver && ver.endsWith('.0');

      html += '<div style="position:relative;margin-bottom:8px;' + (i === parts.length-1 ? '' : 'padding-bottom:8px;') + '">';
      // 圆点
      html += '<div style="position:absolute;left:-17px;top:3px;width:10px;height:10px;border-radius:50%;background:' + (isMajor ? '#8b5cf6' : '#cbd5e1') + ';border:2px solid #fff;box-shadow:0 0 0 1px ' + (isMajor ? '#8b5cf6' : '#cbd5e1') + ';"></div>';
      // 内容
      html += '<div style="font-size:12px;"><span style="font-weight:700;color:' + (isMajor ? '#7c3aed' : '#64748b') + ';">v' + ver + '</span> <span style="color:#475569;">' + escapeHtml(desc) + '</span></div>';
      html += '</div>';
    }
    html += '</div></div>';
    return html;
  }

  // ── 关键词提取：从中文文本中提取 ≥2 字的有意义词汇 ──
  function extractKeywords(text) {
    if (!text) return [];
    var stop = ['的','和','与','或','在','对','为','是','有','了','中','及','等','每','按','至','从','到','于','将','被','把','已','未','可','能','会','这','那','其','之','以','上','下','前','后','内','外','新','本','该','此','各','所','并','而','但','如','则','若','因','所以','进行'];
    // 提取连续中文片段（≥2字）
    var segments = text.match(/[\u4e00-\u9fff]{2,}/g) || [];
    // 过滤停用词
    segments = segments.filter(function(s){ return stop.indexOf(s) < 0; });
    // 拆分长词为 2~4 字子词（提升模糊匹配命中率）
    var result = segments.slice();
    for (var i = 0; i < segments.length; i++) {
      var s = segments[i];
      if (s.length > 4) {
        for (var len = 4; len >= 2 && len <= s.length - 1; len--) {
          for (var start = 0; start <= s.length - len; start++) {
            var sub = s.substring(start, start + len);
            if (stop.indexOf(sub) < 0 && result.indexOf(sub) < 0) {
              result.push(sub);
            }
          }
        }
      }
    }
    return result;
  }

  // ── 关联据源检测：根据项目名关键词推断关联的数据文件，检查缺失情况 ──
  async function findRelatedDataSources(taskName, kw) {
    var sources = [];
    try {
      // 根据关键词推断关联的数据文件
      var filesToCheck = [];
      if (kw.some(function(k){ return ['日报','店铺','销售','pulse'].indexOf(k) >= 0; })) {
        filesToCheck.push({ file: 'data/daily-pulse.json', label: '店铺日报', checkField: 'date' });
      }
      if (kw.some(function(k){ return ['预警','利润','alert'].indexOf(k) >= 0; })) {
        filesToCheck.push({ file: 'data/sales-alert.json', label: '销售预警', checkField: 'date' });
      }
      if (kw.some(function(k){ return ['周报','weekly','周'].indexOf(k) >= 0; })) {
        filesToCheck.push({ file: 'data/weekly-report.json', label: '周报', checkField: 'week' });
      }
      
      for (var i = 0; i < filesToCheck.length; i++) {
        var fc = filesToCheck[i];
        try {
          var r = await fetch(fc.file);
          if (!r.ok) continue;
          var data = await r.json();
          if (!data || !data.length) {
            sources.push({ label: fc.label, status: 'empty', msg: '数据文件为空' });
            continue;
          }
          // 检查最新日期是否滞后
          var dates = data.map(function(d){ return d[fc.checkField] || ''; }).filter(Boolean).sort().reverse();
          var latest = dates[0] || '';
          var today = new Date().toISOString().slice(0,10);
          var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
          if (latest !== today && latest !== yesterday) {
            sources.push({ label: fc.label, status: 'stale', latest: latest, msg: '最新数据：' + latest + '（非近2天）' });
          }
        } catch(err) { /* skip */ }
      }
    } catch(e) { /* ignore */ }
    return sources;
  }

  // ── 异步详情展开 ──
  async function toggleDetail(idx) {
    try {
      var allRows = CURRENT_ALL;   // 用渲染时的完整数组（含合并行），保证 index 命中
      if (!allRows || idx < 0 || idx >= allRows.length) return;
      var row = allRows[idx];
      if (!row) return;

      // 查找已有展开行
      var rows = tbody.querySelectorAll('tr');
      var targetRow = null, detailRow = null;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].dataset && rows[i].dataset.idx == idx) targetRow = rows[i];
        if (targetRow && i > Array.prototype.indexOf.call(rows, targetRow) && rows[i].classList.contains('detail-row')) {
          detailRow = rows[i]; break;
        }
      }
      if (detailRow && detailRow.classList.contains('show')) {
        detailRow.classList.remove('show');
        setTimeout(function() {
          try {
            var chartWrapper = detailRow.querySelector('[data-ad-roi-charts]');
            if (chartWrapper && chartWrapper._disposeCharts) chartWrapper._disposeCharts();
            detailRow.remove();
          } catch(e){}
        }, 200);
        return;
      }

      // 显示加载中
      var colSpan = cfg.fields.length + 1;
      var tr = document.createElement('tr');
      tr.className = 'detail-row show';
      tr.innerHTML = '<td colspan="' + colSpan + '" class="detail-cell"><div class="detail-loading">⏳ 正在加载日报详情...</div></td>';
      insertAfter(tr, idx);

      // ── 异步加载详情内容（带缓存，失败则用行数据内联生成日报）──
      var finalHtml;  // 提前声明，避免 ReferenceError
      var detailContent = '';
      if (!_detailCache) {  // 首次加载才 fetch，后续用缓存
        try {
          var resp = await fetch('data/' + id + '-details.json');
          if (resp.ok) _detailCache = await resp.json();
        } catch(e) { /* fetch 失败 */ }
      }
      // 额外加载销售预警详情（产品级数据，用于拼多多产品维度分析）
      if (!_salesDetailCache) {
        try {
          var sr = await fetch('data/sales-alert-details.json');
          if (sr.ok) _salesDetailCache = await sr.json();
        } catch(e) { /* fetch 失败 */ }
      }
      if (_detailCache && Array.isArray(_detailCache)) {
        var key = (row.date || '') + '_' + (row.platform || '');
        var found = _detailCache.find(function(d) { return (d._key || '') === key; });
        if (found && found.content) {
          if (id === 'sales-alert' && found.products) {
            // 销售预警：使用结构化 HTML 渲染（卡片+表格+建议）
            finalHtml = renderSalesAlertDetail(found);
          } else {
            detailContent = found.content;
            finalHtml = renderDailyReportDetail(row, detailContent, _detailCache, _salesDetailCache);
          }
        }
      }

      // ── 自动化项目管理：专属详情渲染 ──
      if (id === 'automation-projects') {
        finalHtml = await renderAutomationProjectDetail(row);
      }
      // ── 推广投放 ROI：专属详情 ──
      if (id === 'ad-roi') {
        finalHtml = await renderAdRoiDetail(row);
      }
      // ── 电商自动化工作流：运营工单详情（L1-L18 链接进度）──
      if (id === 'ecom-workflow' && row.__wo) {
        finalHtml = renderWorkorderDetail(row);
      }
      // fallback：如果没命中缓存，用行数据内联生成
      if (!finalHtml) {
        detailContent = buildInlineReport(row);
        finalHtml = renderDailyReportDetail(row, detailContent, _detailCache, _salesDetailCache);
      }

      // 替换 loading 内容
      if (finalHtml && finalHtml.nodeType === 1) {
        var cell = tr.querySelector('.detail-cell');
        cell.innerHTML = '';
        cell.appendChild(finalHtml);
        if (finalHtml._initCharts) finalHtml._initCharts();
      } else {
        tr.querySelector('.detail-cell').innerHTML = finalHtml;
      }

    } catch(e) {
      console.error('toggleDetail error:', e);
      alert('详情加载失败：' + e.message);
    }
  }

  function getStatusBadge(row) {
    var t = row.trend || '';
    if (t.indexOf('下滑') >= 0) return '<span class="st st-down">📉 下滑</span>';

  // ── 电商自动化工作流：把运营工单与新品项目追踪打通 ──
  function buildPipelineMap(pipeline) {
    var map = {};
    (pipeline || []).forEach(function(r) {
      var prod = (r.product || '').trim();
      if (!prod) return;
      if (!map[prod]) map[prod] = {};
      var cycle = r.cycle || '其他';
      if (!map[prod][cycle]) map[prod][cycle] = { total: 0, done: 0, run: 0 };
      var st = r.subtasks || {};
      var ks = Object.keys(st).filter(function(k){ return k.charAt(0) !== '_'; });
      var subAny = ks.some(function(k){ return st[k]; });
      var done = r.actualDue || st._done || (ks.length && ks.every(function(k){ return st[k]; }));
      map[prod][cycle].total++;
      if (done) map[prod][cycle].done++;
      else if (st._started || subAny) map[prod][cycle].run++;
    });
    return map;
  }
  function buildEcomWorkflowRows(base, workorders, pipeline) {
    var pipelineMap = buildPipelineMap(pipeline);
    var merged = (base || []).slice();
    (workorders || []).forEach(function(w) {
      var avg = (w.summary && w.summary.avgPct) || 0;
      var status = avg >= 100 ? '已完成' : (avg > 0 ? '进行中' : '待启动');
      var linkCount = ((w.summary && w.summary.totalLinks) || (w.links || []).length);
      var ann = (w.annotations || []).filter(function(a) { return a && (typeof a === 'string' ? a.trim() : JSON.stringify(a)); }).slice(0, 2);
      var note = linkCount + ' 个需求链接' + (ann.length ? ' ｜ 📝 ' + ann.map(function(a){ return typeof a === 'string' ? a : JSON.stringify(a); }).join(' ｜ ') : '');
      var prod = w.product || '未命名';
      merged.push({
        stage: '运营执行',
        platform: w.platform || '',
        product: prod,
        status: status,
        owner: w.emp || '',
        updatedAt: w.updatedAt || '—',
        avgPct: avg,
        note: note,
        __wo: true,
        __woAvg: avg,
        __woLinks: w.links || [],
        __woProduct: prod,
        __woEmp: w.emp || '',
        __woUpdatedAt: w.updatedAt || '',
        __woAnnotations: w.annotations || [],
        __pipeline: pipelineMap[prod] || null
      });
    });
    return merged;
  }

  function buildVersionTimeline(versionLog) {
    if (!versionLog) return '';
    var parts = String(versionLog).split('；').map(function(s){ return s.trim(); }).filter(Boolean);
    if (!parts.length) return '';
    var tl = '<div style="margin-top:6px;">';
    tl += '<div style="font-size:14px;font-weight:700;color:#334155;margin-bottom:10px;display:flex;align-items:center;gap:6px;">📋 版本迭代记录 <span style="font-size:11px;color:#94a3b8;font-weight:500;">（共 ' + parts.length + ' 次）</span></div>';
    tl += '<div style="position:relative;padding-left:18px;">';
    tl += '<div style="position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#e2e8f0;"></div>';
    parts.forEach(function(entry) {
      var m = entry.match(/^([\d.]+)\s*(.*)$/);
      var ver = m ? m[1] : '';
      var desc = m ? m[2] : entry;
      var isMajor = /(新增|重构|合并|上线|新建|结构|大更新|升级)/.test(desc);
      var dotColor = isMajor ? '#6366f1' : '#94a3b8';
      var dotSize = isMajor ? '12px' : '8px';
      tl += '<div style="position:relative;padding:0 0 12px 16px;">';
      tl += '<div style="position:absolute;left:-18px;top:4px;width:' + dotSize + ';height:' + dotSize + ';border-radius:50%;background:' + dotColor + ';border:2px solid #fff;box-shadow:0 0 0 1px ' + dotColor + ';"></div>';
      tl += '<div style="font-size:11px;font-weight:700;color:' + dotColor + ';margin-bottom:1px;">' + escapeHtml(ver) + (isMajor ? '  🏗' : '  🔧') + '</div>';
      tl += '<div style="font-size:12px;color:#475569;line-height:1.4;">' + escapeHtml(desc) + '</div>';
      tl += '</div>';
    });
    tl += '</div></div>';
    return tl;
  }

        pipeline = Array.isArray(pipeline) ? pipeline : [];
        var workorders = (wo && wo.workorders) || [];
        var merged = buildEcomWorkflowRows(base, workorders, pipeline);
        Store.set(id, merged);
        btn.disabled = false;
        btn.textContent = '✅ 已同步';
        setTimeout(function() { btn.textContent = '🔄 同步最新'; }, 2002);
        renderFixed();
      } catch (e) {
        console.warn('[Sync] 电商工作流同步失败:', e);
        btn.disabled = false;
        btn.textContent = '⚠️ 同步失败';
        setTimeout(function() { btn.textContent = '🔄 同步最新'; }, 2000);
      }
      return;
    }

    if (Store.isElectron()) {
      // Electron 模式：触发云端同步，然后重新读取文件渲染
      try {
        if (window.electronAPI) {
          var status = await window.electronAPI.getSyncStatus();
          if (status.serverUrl) {
            await window.electronAPI.triggerSync();
          }
        }
      } catch (e) {
        console.warn('[Sync] 云端同步失败:', e);
      }
      // 强制重新渲染（数据已由 IPC 从文件读取，是最新的）
      renderFixed();
      btn.disabled = false;
      btn.textContent = '✅ 已同步';
      setTimeout(function() { btn.textContent = '🔄 同步最新'; }, 2000);
    } else {
      // 浏览器模式：强制从 JSON 文件刷新 localStorage
      const ok = await Store.forceLoad(id, 'data/' + id + '.json');
      btn.disabled = false;
      btn.textContent = ok ? '✅ 已同步' : '⚠️ 无新数据';
      setTimeout(function() { btn.textContent = '🔄 同步最新'; }, 2000);
      renderFixed();
    }
  };
  mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
  document.getElementById('search').addEventListener('input', renderFixed);

  // 初始化：从预置文件加载数据
  // live 板块（自动化产出）每次强制刷新，确保最新数据生效
  // pending 板块（本地编辑）用 preload，保留用户手动录入
  var initWarn = document.getElementById('initWarn');
  var skEl = document.getElementById('loadingSkeleton');
  if (skEl) skEl.style.display = 'flex';
  var loadedOk = false;

  if (Store.isElectron()) {
    // Electron 模式：数据已通过 IPC 从文件读取，无需额外加载
    loadedOk = Store.get(id).length > 0;
  } else if (location.protocol === 'file:') {
    // file:// 下相对路径 fetch 会被浏览器拦截：先尝试本机 3588 兜底读取（store.fetchJSON 已内置 fallback）
    initWarn.style.display = 'block';
    initWarn.innerHTML = '⚠️ 检测到本地文件打开（file://），正在尝试从本机服务 http://localhost:3588 读取数据…';
    loadedOk = await Store.forceLoad(id, 'data/' + id + '.json');
    if (loadedOk) {
      initWarn.style.display = 'none';
    } else {
      initWarn.innerHTML = '⚠️ 数据读取失败：file:// 下无法直接读取 data/' + id +
        '.json，且本机服务 http://localhost:3588 未响应。请确认「橙萤服务守护」已启动，或改用 http://localhost:3588 访问工作台。';
    }
  } else {
    if (id === 'ecom-workflow') {
      // 电商自动化工作流：合并运营工单 + 新品项目追踪
      try {
        var [base2, wo2, pipeline2] = await Promise.all([
          fetchJSON('data/ecom-workflow.json?' + Date.now(), { optional:true, timeout:10000 }),
          fetchJSON('data/workorder_state.json?' + Date.now(), { optional:true, timeout:10000 }),
          fetchJSON('data/product-pipeline.json?' + Date.now(), { optional:true, timeout:10000 })
        ]);
        base2 = Array.isArray(base2) ? base2 : [];
        wo2 = (wo2 && wo2.workorders) ? wo2 : { workorders: [] };
        pipeline2 = Array.isArray(pipeline2) ? pipeline2 : [];
        var workorders2 = (wo2 && wo2.workorders) || [];
        var merged2 = buildEcomWorkflowRows(base2, workorders2, pipeline2);
        Store.set(id, merged2);
        loadedOk = true;
      } catch (e) {
        console.warn('[Init] 电商工作流加载失败:', e);
        loadedOk = false;
      }
    } else if (cfg.isLog || cfg.status === 'live') {
      loadedOk = await Store.forceLoad(id, 'data/' + id + '.json');
    } else {
      loadedOk = await Store.preload(id, 'data/' + id + '.json');
    }
    if (!loadedOk && Store.get(id).length === 0) {
      initWarn.style.display = 'block';
      initWarn.innerHTML = '⚠️ 数据未加载：预置文件 data/' + id +
        '.json 读取失败或不存在。请点击「同步最新」重试，或检查文件路径。';
    }
  }
  window.__boardRerender = renderFixed;
  renderFixed();
  if (skEl) skEl.style.display = 'none';

  // ── 数据更新检测：每 30 秒轮询 last-update.json ──
  // 蓝条刷新按钮：真正 forceLoad 当前板块数据 + 重渲染（不是傻 reload）
  window.doNotifyRefresh = async function() {
    var notifyEl = document.getElementById('updateNotify');
    var btn = notifyEl.querySelector('button');
    btn.textContent = '⏳ 刷新中…';
    btn.disabled = true;
    try {
      await Store.forceLoad(id, 'data/' + id + '.json');
      if (typeof renderFixed === 'function') renderFixed();
      btn.textContent = '✅ 已更新';
    } catch(e) {
      btn.textContent = '❌ 失败';
    }
    setTimeout(function() {
      btn.textContent = '刷新数据';
      btn.disabled = false;
      notifyEl.style.display = 'none';
      // 清除已通知标记，下次有新数据还会弹
      var seenKey = 'wb:notifiedVersion:' + id;
      try { localStorage.removeItem(seenKey); } catch(e) {}
    }, 1200);
  };

  (function startUpdatePoll() {
    var notifyEl = document.getElementById('updateNotify');
    var seenKey = 'wb:notifiedVersion:' + id;
    var storeKey = 'wb:lastUpdateTs:' + id;
    function poll() {
      fetchJSON('data/last-update.json?' + Date.now(), { optional:true, timeout:8000 })
        .then(function(data) {
          if (!data) return;
          var curTs = data.ts || '';
          if (!curTs) return;
          var boards = data.boards || [];
          // 只在当前板块被更新时才弹通知（不过滤则任意板块更新都提醒）
          if (boards.length > 0 && boards.indexOf(id) === -1) {
            // 当前板块不在更新列表中，只更新时间戳不弹通知
            try { localStorage.setItem(storeKey, curTs); } catch(e) {}
            return;
          }
          var storedTs = localStorage.getItem(storeKey) || '';
          var notifiedTs = localStorage.getItem(seenKey) || '';
          if (storedTs && curTs !== storedTs && curTs !== notifiedTs) {
            document.getElementById('updateNotifyText').textContent =
              '数据已于 ' + curTs + ' 更新，点击刷新获取最新内容';
            notifyEl.style.display = 'flex';
            try { localStorage.setItem(seenKey, curTs); } catch(e) {}
          }
          try { localStorage.setItem(storeKey, curTs); } catch(e) {}
        })
        .catch(function() {});
    }
    poll();
    setInterval(poll, 30000);
  })();

  // 深度链接：从首页诊断卡片直达 board 的具体行
  window.applyBoardFocus = function (focus) {
    if (!focus) return;
    if (focus.filters) {
      Object.keys(focus.filters).forEach(function (k) {
        if (focus.filters[k]) activeFilters[k] = focus.filters[k];
      });
    }
    if (focus.search) document.getElementById('search').value = focus.search;
    renderFixed();
    if (focus.search) {
      setTimeout(function () { if (typeof DeepLink !== 'undefined') DeepLink.highlight('#tbody', focus.search); }, 400);
    }
  };
  if (pendingBoardFocus && (pendingBoardFocus.board === id || ['daily-pulse', 'sales-alert', 'product-pipeline', 'automation-log', 'automation-projects', 'ecom-workflow', 'emp-task'].indexOf(pendingBoardFocus.board) >= 0)) {
    setTimeout(function () { window.applyBoardFocus(pendingBoardFocus); pendingBoardFocus = null; }, 800);
  }

  var dataSource = Store.isElectron() ? '本地数据文件（data/）' : '本地存储（localStorage）';
  document.getElementById('foot').innerHTML =
    '数据来源：' + dataSource + '<span style="margin:0 6px">·</span>' +
    '预置文件 <code style="background:#f0f2f5;padding:1px 5px;border-radius:4px;font-size:12px">data/' + id + '.json</code><span style="margin:0 6px">·</span>' +
    '点击「同步最新」可刷新为最新预置数据';
  } catch (e) {
    if (window.showFatal) window.showFatal(e); else throw e;
  }
})();
</script>
