<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文案智能体</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f8fa; color: #1f2937; line-height: 1.6; padding: 22px 22px 48px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  .ttl { display: flex; align-items: center; gap: 10px; }
  .back { font-size: 13px; color: #6b7280; text-decoration: none; border: 1px solid #e5e7eb; border-radius: 8px; padding: 5px 11px; background: #fff; transition: .15s; }
  .back:hover { border-color: #7c3aed; color: #7c3aed; }
  h1 { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #fff; background: linear-gradient(135deg,#7c3aed,#a78bfa); padding: 3px 10px; border-radius: 20px; vertical-align: middle; }
  .sub { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #eef0f3; border-radius: 12px; padding: 16px 18px; }
  .panel h2 { font-size: 14px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .panel h2 .n { width: 20px; height: 20px; border-radius: 6px; background: #7c3aed; color: #fff; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }
  .fld { margin-bottom: 10px; }
  .fld label { display: block; font-size: 11.5px; font-weight: 700; color: #6b7280; margin-bottom: 4px; }
  .fld label small { font-weight: 400; color: #9ca3af; }
  .fld input, .fld textarea, .fld select {
    width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px;
    font-size: 13px; color: #1f2937; background: #fff; outline: none; transition: .15s; font-family: inherit;
  }
  .fld input:focus, .fld textarea:focus, .fld select:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.08); }
  .fld textarea { resize: vertical; min-height: 52px; line-height: 1.5; }
  .fld textarea.big { min-height: 72px; }
  .fld .ph { font-size: 11px; color: #c2c9d4; margin-top: 3px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 640px) { .row2 { grid-template-columns: 1fr; } }
  .gen-bar { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; flex-wrap: wrap; }
  .btn-gen {
    border: none; background: linear-gradient(135deg,#7c3aed,#6d28d9); color: #fff;
    padding: 11px 26px; font-size: 14px; font-weight: 800; border-radius: 10px; cursor: pointer; transition: .18s;
    display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 16px rgba(124,58,237,.28);
  }
  .btn-gen:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-gen:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-sec { border: 1px solid #e5e7eb; background: #fff; color: #6b7280; padding: 9px 16px; font-size: 12.5px; font-weight: 700; border-radius: 9px; cursor: pointer; transition: .15s; }
  .btn-sec:hover { border-color: #7c3aed; color: #7c3aed; }
  .result { margin-top: 16px; }
  .result-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .result-head .t { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #c4b5fd; animation: blink 1.2s infinite; }
  .dots i:nth-child(2){ animation-delay: .2s } .dots i:nth-child(3){ animation-delay: .4s }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  .out-box {
    background: #0f1220; color: #e6edf3; border-radius: 12px; padding: 16px 18px;
    font-size: 13px; line-height: 1.8; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
    max-height: 560px; overflow-y: auto; min-height: 120px;
  }
  .out-box .hd { color: #a78bfa; font-weight: 800; }
  .empty-tip { color: #6b7280; }
  .out-box a { color: #22d3ee; }
  .status-line { font-size: 12px; color: #7c3aed; margin-top: 8px; font-weight: 600; }
  .err-line { font-size: 12px; color: #b91c1c; margin-top: 8px; font-weight: 600; }
  .copy-mini { border: 1px solid #334155; background: transparent; color: #cbd5e1; padding: 5px 12px; font-size: 11.5px; font-weight: 700; border-radius: 8px; cursor: pointer; }
  .copy-mini.copied { background: #16a34a; border-color: #16a34a; color: #fff; }
  .hint-box { background: #fff; border: 1px solid #eef0f3; border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; font-size: 12.5px; color: #6b7280; display: flex; gap: 10px; align-items: flex-start; }
  .hint-box b { color: #374151; }
  footer { font-size: 11px; color: #b9bfc7; text-align: center; margin-top: 18px; }
  .spin { display:inline-block; width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg) } }
</style>
</head>
<body>
<script src="js/freshness-alert.js?v=202609091034"></script>
<div class="wrap">
  <header>
    <div class="ttl">
      <a class="back" href="index.html">← 返回</a>
      <div>
        <h1>文案智能体 <span class="badge">直接出稿</span></h1>
        <div class="sub">选好投放平台 → 填产品信息 → 点「生成文案」→ 直接按平台出稿</div>
      </div>
    </div>
  </header>

  <div class="hint-box">
    <div>
      <b>怎么用：</b>下面只需填你<u>确定的信息</u>，不确定的留空，AI 会自己补行业常识并在稿里标注。卖点/差评/常问越真实，稿子越能打。
      <b>建议：</b>差评和"买家常问"是痛点金矿，能填尽量填。
    </div>
  </div>

  <div class="grid">
    <!-- ======== 左：表单 ======== -->
    <div class="panel">
      <h2><span class="n">1</span> 产品信息（能填多少填多少）</h2>

      <div class="fld"><label>货品名称 *</label>
        <input id="fName" placeholder="例：撕拉线静电油烟贴（透明款）">
      </div>

      <div class="row2">
        <div class="fld"><label>大类别</label>
          <select id="fCat">
            <option value="">（选一个）</option>
            <option>仿瓷砖贴</option><option>油烟贴</option><option>静电墙贴</option>
            <option>PVC贴纸</option><option>电梯门贴</option><option>地毯</option>
            <option>静电膜/磨砂膜</option><option>白板贴/绿板贴</option>
            <option>地板贴</option><option>其他</option>
          </select>
        </div>
        <div class="fld"><label>主要销售端</label>
          <select id="fEnd">
            <option value="">（选一个）</option><option>零售端</option><option>批发端</option><option>双端</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div class="fld"><label>规格 / 尺寸</label>
          <input id="fSpec" placeholder="例：0.45m宽 × 按米卖">
        </div>
        <div class="fld"><label>材质 / 工艺</label>
          <input id="fMaterial" placeholder="例：静电免胶 / PVC">
        </div>
      </div>

      <div class="fld"><label>使用场景</label>
        <input id="fScene" placeholder="例：厨房灶台防油、出租屋墙面粉尘">
      </div>

      <div class="fld"><label>目标人群（猜的也行）</label>
        <input id="fPeople" placeholder="例：租房年轻人 / 宝妈 / 装修省钱党 / 开店老板">
      </div>

      <div class="fld"><label>价格带</label>
        <input id="fPrice" placeholder="例：9.9~29.9，客单15左右">
      </div>

      <div class="fld"><label>真实卖点（有数字更好，逐条用 / 分开）</label>
        <textarea id="fPoints" class="big" placeholder="例：静电吸附免胶 / 撕下不留痕可反复贴 / 防水防油一擦净 / 0.45~1.2m多宽可选按米卖"></textarea>
      </div>

      <div class="fld"><label>买家常夸的（从评价抄 2 条）</label>
        <textarea id="fGood" placeholder="例：贴上很服帖 / 撕下来墙没留印"></textarea>
      </div>

      <div class="fld"><label>差评 / 买家常问的（金矿，从评价、问大家、客服抄）</label>
        <textarea id="fBad" class="big" placeholder="例：有人说贴不平有气泡 / 总问能不能贴乳胶漆墙 / 担心撕下来留胶"></textarea>
      </div>

      <div class="row2">
        <div class="fld"><label>投放平台 *</label>
          <select id="fPlatform">
            <option value="douyin">抖音（短视频脚本 + 标题 + 话题）</option>
            <option value="xhs">小红书（图文笔记 + 标题 + 标签）</option>
            <option value="tb">淘宝/天猫（标题 + 主图卖点 + 详情页）</option>
            <option value="video">微信视频号（短视频脚本 + 标题）</option>
            <option value="kuaishou">快手（短视频脚本 + 标题）</option>
            <option value="pdd">拼多多（标题 + 详情页短文）</option>
            <option value="all">全平台通发（抖音+小红书+淘宝 一次给齐）</option>
          </select>
        </div>
        <div class="fld"><label>生成脚本数量</label>
          <select id="fNum">
            <option value="1">1 版</option>
            <option value="2" selected>2 版</option>
            <option value="3">3 版</option>
            <option value="5">5 版</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div class="fld"><label>风格语气</label>
          <select id="fTone">
            <option value="">默认（真实痛点 + 有画面）</option>
            <option>实在理工男：参数讲透、不夸张</option>
            <option>妈妈口吻：懂过日子、会心疼钱</option>
            <option>年轻网感：短平快、有梗</option>
            <option>批发招商：讲利润、讲复购</option>
          </select>
        </div>
        <div class="fld"><label>补充要求 / 其他想说的</label>
          <input id="fExtra" placeholder="例：突出租房改造，别用太夸张的词">
        </div>
      </div>

      <div class="gen-bar">
        <button class="btn-gen" id="btnGen" onclick="generate()">
          <span id="genIcon">⚡</span> 生成文案
        </button>
        <button class="btn-sec" onclick="loadExample()">填入示例</button>
        <button class="btn-sec" onclick="clearAll()">清空</button>
      </div>
      <div class="status-line" id="statusLine" style="display:none"></div>
      <div class="err-line" id="errLine" style="display:none"></div>
      <div style="font-size:11.5px;color:#9ca3af;margin-top:8px" id="chanTip">通道：检测中…</div>
    </div>

    <!-- ======== 右：输出 ======== -->
    <div class="panel">
      <div class="result-head">
        <div class="t" id="resultTitle">生成结果</div>
        <button class="copy-mini" id="btnCopy" onclick="copyResult()" style="display:none">复制全文</button>
      </div>
      <div class="out-box" id="outBox"><span class="empty-tip">填好左边信息，点「生成文案」，结果会实时显示在这里。</span></div>
      <div class="fld" style="margin-top:12px">
        <label>已生成记录（本地保存，关页不丢）</label>
        <select id="histSel" style="width:100%" onchange="loadHist(this.value)"><option value="">— 选择一条历史记录回看 —</option></select>
      </div>
    </div>
  </div>

  <footer>文案智能体 · 板块编码：WA-013 · 生成能力：工作台 AI 通道（DeepSeek/通义）</footer>
</div>

<script>
(function(){
  var API_BASE = '';
  var FALLBACK_BASE = '';   // 公网兜底通道（从 data/sync.json 读到的隧道地址）
  var MODEL = 'qwen-plus';

  // 线上静态页（GitHub Pages）没有后端 → 读取随同步部署的 data/sync.json，
  // 拿到当前公网隧道地址，用它作生成通道（隧道把请求转发回电脑上的工作台 AI）。
  function loadFallback(){
    try {
      fetch('data/sync.json?t=' + Date.now(), { cache:'no-store' })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){
          if (j && j.hub && /^https?:\/\//.test(j.hub)) {
            FALLBACK_BASE = j.hub.replace(/\/$/, '');
            var el = document.getElementById('chanTip');
            if (el) el.textContent = '通道：公网（' + FALLBACK_BASE.replace(/^https?:\/\//,'') + '）';
          } else {
            var el2 = document.getElementById('chanTip');
            if (el2) el2.textContent = '通道：未连上（工作台需在线）';
          }
        }).catch(function(){});
    } catch(e) {}
  }
  loadFallback();

  // 请求地址候选：先同源（本地/局域网/隧道域名访问时可用），不通再试公网兜底
  function chatBases(){
    var list = [];
    if (API_BASE) list.push(API_BASE);
    list.push('');
    if (FALLBACK_BASE) list.push(FALLBACK_BASE);
    return list.filter(function(v,i,a){ return a.indexOf(v) === i; });
  }
  var HISTORY_KEY = 'copywriter-history';
  var hist = [];
  try { hist = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) {}
  var allText = '';
  var streaming = false;
  var abortCtl = null;
  var firstTokenTs = null;

  function val(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
  function statusLine(t){ var el=document.getElementById('statusLine'); if(!t){el.style.display='none';return;} el.style.display='block'; el.textContent=t; }
  function errLine(t){ var el=document.getElementById('errLine'); if(!t){el.style.display='none';return;} el.style.display='block'; el.textContent=t; }

  function buildMessages(){
    var name = val('fName');
    if(!name){ errLine('请至少填「货品名称」'); return null; }
    errLine(null);
    var seg = [];
    var fields = [
      ['货品名称', name],
      ['大类别', val('fCat')], ['规格/尺寸', val('fSpec')], ['材质/工艺', val('fMaterial')],
      ['使用场景', val('fScene')], ['目标人群', val('fPeople')], ['价格带', val('fPrice')],
      ['真实卖点', val('fPoints')], ['买家常夸', val('fGood')], ['差评/常问痛点', val('fBad')]
    ];
    fields.forEach(function(p){ if(p[1]) seg.push(p[0]+'：'+p[1]); });
    var plat = val('fPlatform'), tone = val('fTone'), extra = val('fExtra');
    var num = parseInt(val('fNum'), 10) || 2;
    var PLAT = {
      douyin:{ name:'抖音',
        out:'抖音短视频脚本（2版，每版含：3秒钩子 / 画面分镜 / 口播文案 / 字幕 / CTA）+ 视频标题（5个，含悬念型+利益型）+ 发布话题标签（3-5个）',
        sys:'平台调性：抖音节奏快，前3秒决定划走。脚本必须强钩子开场、画面具体可拍、口播口语化有梗、结尾给明确动作（点赞/收藏/进店）。' },
      xhs:{ name:'小红书',
        out:'小红书图文笔记：标题（5个，重痛点/好奇/收藏感）+ 正文（分段+emoji+步骤感+可收藏）+ 话题标签（8-12个，品类词+场景词）+ 封面抓眼文案（一句）',
        sys:'平台调性：小红书重真实分享与收藏价值，像朋友安利。第一人称、生活化、emoji分段，强调"我用了真的好"，标题要让人想点想存。' },
      tb:{ name:'淘宝/天猫',
        out:'电商标题（1个30字内主标题含核心关键词 + 3个长尾备选）+ 主图卖点字（5张主图各一句卖点文案）+ 详情页5条卖点（痛点→解决方案）+ 规格/售后提醒',
        sys:'平台调性：淘宝天猫重搜索关键词与转化。标题堆核心词+属性词+场景词；主图卖点字要一眼懂；详情页用"痛点-证据-承诺"推进下单。' },
      video:{ name:'微信视频号',
        out:'视频号短视频脚本（2版，含3秒钩子/画面/口播/字幕/CTA）+ 视频标题（3个）+ 转发引导语（适合朋友圈/社群的一句话）',
        sys:'平台调性：视频号社交裂变强、熟人传播。脚本可带"转发给需要的人"钩子，语气可信赖像邻里推荐，适合家庭/装修/收纳场景。' },
      kuaishou:{ name:'快手',
        out:'快手短视频脚本（2版，老铁语气真实接地气，含3秒钩子/画面/口播/字幕/CTA）+ 视频标题（3个）+ 话题标签（3-5个）',
        sys:'平台调性：快手重老铁信任、真实不装。脚本口语化接地气讲实惠，多用"咱/老铁"，结尾引导关注/进店。' },
      pdd:{ name:'拼多多',
        out:'拼多多标题（1个含核心词+低价词如工厂直供/9.9/包邮）+ 详情页短文（5条卖点突出便宜好用+销量背书）+ 白底图卖点字（3-5句）',
        sys:'平台调性：拼多多重低价与转化效率。标题突出工厂/直供/9.9/包邮等词；文案短平快讲性价比，少修饰多证据。' },
      all:{ name:'全平台通发',
        out:'一次给齐三套：①抖音短视频脚本2版+标题5个+话题；②小红书笔记标题5个+正文+标签；③淘宝/天猫主标题+主图卖点字+详情页5卖点',
        sys:'分平台输出：下面分别给抖音、小红书、淘宝三套稿件，各自遵循对应平台调性，用【抖音】【小红书】【淘宝】分段。' }
    };
    var p = PLAT[plat] || PLAT['douyin'];
    if (num !== 2) p = { name:p.name, sys:p.sys, out: p.out.replace(/2版/g, num + '版') };
    var toneTxt = { '':'语气自然、真实痛点优先', '实在理工男':'语气实在理工，参数讲透但不夸张，像懂行的朋友推荐', '妈妈口吻':'妈妈口吻，懂过日子、会心疼钱、说人话', '年轻网感':'年轻网感，短平快、有梗、不端着', '批发招商':'面向批发/招商客户，讲利润空间、走量、复购' }[tone] || '';

    var system = '你是资深电商文案总监，服务「橙萤」家居贴纸/墙贴/贴膜店铺。\n\n' +
      '【你的产品家底 · 必须优先使用】\n' +
      '· 核心技术：静电吸附无胶（不伤墙、不留胶印），进口PP材质+高分子组合，0.05mm厚，不含甲醛/重金属（欧盟认证）\n' +
      '· 适配面：光滑不掉灰墙面、玻璃、瓷砖、木质、乳胶漆、水性涂料、轻微纹理墙纸墙布（纹理不能太突出）\n' +
      '· 主力品真实痛点↔卖点（写文案直接套用）：\n' +
      '  墙面保护膜：孩子乱涂乱画大白墙无法复原→可揭下换新、完整保留画作、水性笔可擦｜宠物抓墙留痕→防刮伤｜鞋架书桌下黑印难清→防污｜带胶墙布留胶伤墙→静电不留胶｜重刷贵且有甲醛→环保无污染\n' +
      '  静电白板/黑板贴：带胶移除伤墙→静电可移除不伤墙｜字迹磕碰难清理→保护墙面可擦写｜孩子乱涂→防涂画｜传统白板占地→轻薄上墙不占地｜撕拉白板：自切麻烦边缘丑→撕拉线即撕即用\n' +
      '  点断撕防油贴：厨房油污难清、渗透翻新贵→防水防油防渗透｜带胶防油贴撕下伤墙→静电不伤墙｜炒菜弄脏墙→保持厨房干净\n' +
      '· 已知短板（写文案要么避开、要么主动化解，绝不能撒谎）：对温湿度敏感，高温易起鼓；久用可能起鼓、可能难擦留痕\n\n' +
      '【铁律】\n' +
      '1. 优先用上面"家底"里的真实痛点与卖点；素材没给的，用行业常识合理补足但用【*】标注"待核实"。\n' +
      '2. 核心方法=把"参数卖点"翻译成"买家听得懂的下单理由"（痛点→场景→承诺→证据）。\n' +
      '3. 顾虑消解法：把差评/常问里的顾虑正面回答进文案。\n' +
      '4. 每版稿都要：3秒能懂是什么、有场景代入、有行动指令。\n' +
      '5. 直接给成品稿，不要先解释思路；如有不确定，在稿末用【待你核实】列出问题清单。\n' +
      '6. 卖点写实，宁可少写一句也不假大空（"全网第一""绝对不掉"等禁用）。' +
      '7. 短视频脚本默认时长 15-30 秒（除非【补充】里另有要求）；节奏紧凑、单条不注水，钩子前置。' +
      '\n\n【本次平台调性 · 必须遵守】\n' + p.sys;

    var user = '【产品信息】\n' + seg.join('\n') + '\n\n' +
      '【输出要求（' + p.name + '）】' + p.out + '\n' +
      (tone ? '【语气】' + toneTxt + '\n' : '') +
      (extra ? '【补充】' + extra + '\n' : '') +
      '\n请按上面要求，走五步思考后直接输出最终稿：' +
      '（1秒内先在心里拆卖点→人群→买点，但不要输出思考过程，直接给稿）\n' +
      '如信息不足影响出稿，可在稿末【待你核实】里集中提问。';

    return [ {role:'system', content: system}, {role:'user', content: user} ];
  }

  window.generate = async function(){
    if (streaming) { if(abortCtl) abortCtl.abort(); streaming=false; resetGenBtn(); return; }
    var msgs = buildMessages(); if(!msgs) return;
    allText = '';
    var box = document.getElementById('outBox');
    box.textContent = '';
    box.classList.remove('empty-tip');
    document.getElementById('btnCopy').style.display = 'inline-block';
    document.getElementById('resultTitle').innerHTML = '生成中 <span class="dots"><i></i><i></i><i></i></span>';
    firstTokenTs = null;

    streaming = true;
    var btn = document.getElementById('btnGen');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> 生成中…（再点=停止）';
    statusLine('正在连接 AI 生成通道…');
    abortCtl = new AbortController();

    var bases = chatBases();
    var lastErr = null;
    var response = null;

    try {
      for (var bi = 0; bi < bases.length; bi++) {
        var base = bases[bi];
        try {
          statusLine((bi === 0 ? '正在连接生成通道…' : '换用备用通道重试（' + (bi+1) + '/' + bases.length + '）…'));
          var rsp = await fetch(base + '/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            credentials:'same-origin',
            body: JSON.stringify({messages: msgs, model: MODEL, mode:'chat'}),
            signal: abortCtl.signal
          });
          if (!rsp.ok) { lastErr = new Error('服务器错误 (' + rsp.status + ')'); continue; }
          // 静态页（Pages）会把未知路径兜底成 HTML，需识破并换下一个通道
          var ct = rsp.headers.get('content-type') || '';
          if (ct.indexOf('text/event-stream') === -1 && ct.indexOf('application/json') === -1) {
            lastErr = new Error('该地址不是生成通道');
            continue;
          }
          response = rsp; break;
        } catch (e2) {
          if (e2.name === 'AbortError') throw e2;
          lastErr = e2;
        }
      }
      if (!response) { throw lastErr || new Error('没有可用的生成通道'); }
      statusLine('AI 开始输出…（生成中可随时点按钮停止）');

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      while(true){
        var r = await reader.read();
        if(r.done) break;
        buf += decoder.decode(r.value, {stream:true});
        var lines = buf.split('\n');
        buf = lines.pop() || '';
        for(var i=0;i<lines.length;i++){
          var ln = lines[i].trim();
          if(!ln.startsWith('data: ')) continue;
          var ds = ln.slice(6);
          if(ds === '[DONE]') { reader.cancel && reader.cancel(); break; }
          try{
            var d = JSON.parse(ds);
            if(d.error){ errLine('AI通道错误：' + d.error); break; }
            var c = d.choices && d.choices[0] && d.choices[0].delta && d.choices[0].delta.content;
            if(c){ allText += c; box.textContent = allText; box.scrollTop = box.scrollHeight; }
          }catch(e){}
        }
      }
      streaming = false;
      resetGenBtn();
      if(allText){ statusLine('✅ 生成完成'); saveHist(); } else { statusLine(null); box.innerHTML='<span class="empty-tip">没有拿到内容，可能被中断。点「生成文案」再试一次。</span>'; }
    } catch(err){
      streaming = false; resetGenBtn();
      if(err.name === 'AbortError'){ statusLine('已停止生成。'); return; }
      errLine('生成通道连不上：' + (err.message||''));
      box.innerHTML = '<span class="empty-tip">生成通道暂时连不上。\n\n请按这个顺序排查：\n'
        + '1. 电脑上的「橙萤零售工作台」需要保持运行（AI 生成在电脑上完成）\n'
        + '2. 工作台的公网隧道需要在线（隧道地址每天会变，脚本会自动更新）\n'
        + '3. 网络波动 → 点「生成文案」再试一次\n\n'
        + '通道状态：<span id="chanTip2">读取中…</span></span>';
      var t2 = document.getElementById('chanTip2');
      if (t2) t2.textContent = FALLBACK_BASE ? ('已识别公网通道 ' + FALLBACK_BASE) : '未识别到公网通道（工作台可能离线）';
    }
  };

  function resetGenBtn(){
    var btn = document.getElementById('btnGen');
    btn.disabled = false;
    btn.innerHTML = '<span id="genIcon">⚡</span> 生成文案';
  }

  function saveHist(){
    var name = val('fName') || ('文案 ' + new Date().toLocaleString('zh-CN'));
    var rec = { name:name, text:allText, ts:Date.now(), fmt:new Date().toLocaleString('zh-CN') };
    hist.unshift(rec); if(hist.length > 20) hist.length = 20;
    try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(hist)); }catch(e){}
    renderHist();
  }
  function renderHist(){
    var sel = document.getElementById('histSel');
    var cur = sel.value;
    sel.innerHTML = '<option value="">— 选择一条历史记录回看 —</option>';
    hist.forEach(function(r){ var o=document.createElement('option'); o.value = String(r.ts); o.textContent = r.name + ' · ' + r.fmt; sel.appendChild(o); });
    if(cur){ var el = sel.querySelector('[value="'+cur+'"]'); if(el) sel.value = cur; }
  }
  window.loadHist = function(ts){
    var rec = hist.find(function(r){ return String(r.ts) === ts; });
    if(!rec) return;
    allText = rec.text;
    var box = document.getElementById('outBox');
    box.textContent = allText;
    box.classList.remove('empty-tip');
    document.getElementById('resultTitle').textContent = '历史：' + rec.name;
    document.getElementById('btnCopy').style.display = 'inline-block';
    statusLine(null); errLine(null);
  };
  window.copyResult = function(){
    if(!allText){ return; }
    var btn = document.getElementById('btnCopy');
    function done(){ btn.textContent='已复制 ✓'; btn.classList.add('copied'); setTimeout(function(){ btn.textContent='复制全文'; btn.classList.remove('copied'); },1500); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(allText).then(done, function(){ fallbackCopy(); done(); }); }
    else { fallbackCopy(); done(); }
    function fallbackCopy(){ var ta=document.createElement('textarea'); ta.value=allText; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
  };

  window.loadExample = function(){
    var set = function(id,v){ var el=document.getElementById(id); if(el) el.value=v; };
    set('fName','撕拉线静电油烟贴（透明款）');
    set('fCat','油烟贴');
    set('fSpec','0.45m宽 × 2m/3m/5m长，按米卖');
    set('fMaterial','静电吸附 · 免胶 · 撕拉线可整片撕');
    set('fScene','厨房灶台墙面防油污、出租屋厨房改造');
    set('fPeople','租房年轻人 / 常做饭家庭 / 讨厌擦油墙的人');
    set('fPrice','8.9~19.9，客单约12');
    set('fPoints','静电免胶不伤瓷砖/一贴就上墙/撕拉线设计想换就换不留胶/透明不影响原墙/油污一擦即净/按米卖不浪费');
    set('fGood','贴上很透，不显眼/油点子一擦就掉');
    set('fBad','总问贴久了会不会掉/有人说贴不平有气泡/担心撕下来留胶印/问能不能贴乳胶漆墙');
    set('fPlatform','douyin');
    set('fExtra','突出租房党也能用、退租一撕就干净');
    statusLine(null); errLine(null);
  };
  window.clearAll = function(){
    ['fName','fSpec','fMaterial','fScene','fPeople','fPrice','fPoints','fGood','fBad','fExtra'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
    document.getElementById('fPlatform').value='douyin'; document.getElementById('fNum').value='2'; document.getElementById('fTone').value='';
    statusLine(null); errLine(null);
  };

  renderHist();
})();
</script>
