  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

  h1 { font-size: 19px; font-weight: 800; }
  .sub { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  .date { font-size: 11.5px; color: #9ca3af; margin-top: 3px; background: #f3f4f6; display: inline-block; padding: 2px 8px; border-radius: 6px; }
  .tabs { display: inline-flex; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 3px; }
  .tabs button { border: none; background: transparent; padding: 7px 15px; font-size: 13px; font-weight: 600; color: #6b7280; border-radius: 7px; cursor: pointer; transition: .15s; }
  .tabs button.active { background: #7c3aed; color: #fff; }
  /* 日期筛选条 */
  .date-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #fff; border: 1px solid #eef0f3; border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; }
  .date-bar .lb { font-size: 12px; color: #9ca3af; font-weight: 600; margin-right: 2px; }

  .date-bar input[type="date"]:focus { outline: none; border-color: #7c3aed; }
  .date-bar .range-tip { font-size: 11.5px; color: #9ca3af; }
  .date-bar .cur { font-size: 12px; font-weight: 700; color: #7c3aed; margin-left: auto; }
  /* signal */
  .signal { background: #fff; border: 1px solid #eef0f3; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .signal .dots { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
  .signal .dots .d { display: inline-flex; align-items: center; gap: 6px; }
  .signal .dots .sw { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .signal .verdict { margin-top: 11px; font-size: 13.5px; color: #374151; }
  .signal .verdict b { color: #111827; }
  .signal .warn { color: #dc2626; font-weight: 700; }
  .signal .good { color: #16a34a; font-weight: 700; }
  .signal .meta { margin-top: 8px; font-size: 11.5px; color: #9ca3af; }
  /* chart card */
  .card { background: #fff; border: 1px solid #eef0f3; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .card-hd { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .card-hd .t { font-size: 14px; font-weight: 700; }
  .card-hd .hint { font-size: 11.5px; color: #9ca3af; margin-top: 3px; }
  .card-hd .hint b.up { color: #16a34a; } .card-hd .hint b.down { color: #dc2626; }
  .filters { display: inline-flex; gap: 6px; }
  .filters button { border: 1px solid #e5e7eb; background: #fff; padding: 4px 12px; font-size: 12px; font-weight: 600; border-radius: 16px; cursor: pointer; color: #6b7280; transition: .15s; }
  .filters button.active { background: #111827; color: #fff; border-color: #111827; }
  .pfilter-wrap { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #pfilter { border: 1px solid #e5e7eb; background: #fff; padding: 5px 10px; font-size: 12px; border-radius: 16px; color: #374151; cursor: pointer; max-width: 220px; }
  #pfilter:focus { outline: none; border-color: #7c3aed; }
  /* list */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; font-size: 11.5px; color: #9ca3af; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid #f0f1f3; }
  thead th.num, tbody td.num { text-align: right; }
  tbody td { padding: 9px 10px; border-bottom: 1px solid #f6f7f8; }
  tbody tr.down { box-shadow: inset 3px 0 0 #dc2626; background: #fff7f7; }

  .chg { font-weight: 700; }
  .chg.up { color: #16a34a; } .chg.down { color: #dc2626; } .chg.flat { color: #9ca3af; }
  .stk { font-size: 12px; color: #6b7280; }
  .stk.down { color: #dc2626; } .stk.up { color: #16a34a; }
  /* 品类行附属信息"含 N 款产品" */
  td .cnt { display: inline-block; margin-left: 6px; font-size: 11px; color: #6b7280; background: #f3f4f6; border-radius: 999px; padding: 1px 8px; font-weight: 500; }
  /* 维度切换条 */
  .gBar { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #eef0f3; border-radius: 12px; padding: 8px 14px; margin-bottom: 12px; }
  .gBar .lb { font-size: 12px; color: #9ca3af; font-weight: 600; }
  .gBar .gHint { font-size: 11.5px; color: #6b7280; }
  .profit-meta { margin: 8px 0 4px; font-size: 12px; color: #6b7280; background: #f9fafb; border-radius: 8px; padding: 8px 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  .profit-meta b { color: #111827; }
  .profit-meta .pm-up { color: #16a34a; } .profit-meta .pm-down { color: #dc2626; }
  #plist tbody tr.loss { box-shadow: inset 3px 0 0 #dc2626; background: #fff7f7; }
  #plist tbody tr.win { box-shadow: inset 3px 0 0 #16a34a; }
  .pmoney { font-weight: 700; }
  .pmoney.up { color: #16a34a; } .pmoney.down { color: #dc2626; }
  footer { font-size: 11px; color: #b9bfc7; text-align: center; margin-top: 6px; }
</style>
</head>

<div class="wrap">
  <header>
    <div class="ttl">
      <a class="back" href="index.html">← 返回</a>
      <div>
        <h1>品类分析</h1>
        <div class="sub" id="sub">按成交额变动排序</div>
        <div class="date" id="dataDate"></div>

    <div class="tabs" id="tabs">

      <button data-scope="天猫">天猫</button>
      <button data-scope="拼多多">拼多多</button>
    </div>
  </header>

  <div class="date-bar" id="dateBar">
    <span class="lb">📅 日期</span>
    <div class="tabs" id="dTabs">
      <button data-dmode="all" class="active">全部</button>
      <button data-dmode="7d">近7天</button>
      <button data-dmode="yesterday">昨天</button>
      <button data-dmode="day">按日</button>

  <div class="signal" id="signal"></div>

  <div class="card">
    <div class="card-hd">

      <div class="filters" id="filters">

        <button data-filter="上升">上升</button>
        <button data-filter="下滑">下滑</button>
        <button data-filter="稳定">稳定</button>

    <table id="list">
      <thead><tr>
        <th>产品</th>
        <th class="num">日均成交</th>
        <th class="num">变动</th>
        <th>趋势</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-hd">
      <div>
        <div class="t">产品盈亏明细</div>
        <div class="hint" id="profitHint">数据来源：BI 销售报表 · 零售销售报表 Base</div>
      </div>
      <div class="pfilter-wrap">
        <select id="pfilter" title="筛选产品"><option value="">全部产品</option></select>
        <div class="filters" id="profitSort">
          <button data-psort="profit" class="active">按利润额</button>
          <button data-psort="margin">按利润率</button>
          <button data-psort="ship">按发货额</button>
        </div>
      </div>
    </div>
    <div class="profit-meta" id="profitMeta"></div>
    <table id="plist">
      <thead><tr>
        <th>产品</th>
        <th class="num">发货额</th>
        <th class="num">利润额</th>
        <th class="num">利润率</th>
        <th class="num">利润占比</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card" id="ptrendCard" style="display:none">
    <div class="card-hd">
      <div><div class="t" id="ptrendTtl">产品趋势</div><div class="hint" id="ptrendHint"></div></div>
    </div>
    <div id="ptrendBody"></div>
  </div>

  <footer id="foot"></footer>
</div>

      // 取数据集中次新的、确实存在的日期（避免真实日历昨天无数据导致空白）
      if (ALL_DATES.length >= 2) { var y = ALL_DATES[ALL_DATES.length - 2]; return { start: y, end: y }; }
      return null;
    }
    if (dMode === "day") return dSingle ? { start: dSingle, end: dSingle } : null;
    if (dMode === "custom") return (dFrom && dTo && dFrom <= dTo) ? { start: dFrom, end: dTo } : null;
    return null;
  }
  // 按窗口裁剪 dates/pays（返回新数组，保留原序列顺序）
  function cropSeries(dates, pays, win) {
    var nd = [], np = [];
    for (var i = 0; i < dates.length; i++) {
      if (inWin(dates[i], win)) { nd.push(dates[i]); np.push(pays[i]); }
    }
    return { dates: nd, pays: np };
  }

  // 由 pays 序列计算衍生指标（全平台合并 / 兜底用）
  // enrich: 接收产品全序列(allDates/allPays) + 窗口win，内部裁剪并计算变动
  // - 单日窗口(win.start === win.end)：与前一天对比算变动%与方向
  // - 多日窗口：与窗口内 early/late 头尾3天均对比
  // - prevDay 数据缺失时 chg=0, cls="day"，表格列展示成 "—"
  function enrich(name, platforms, allDates, allPays, win) {
    if (!allPays.length) return null;
    var c = cropSeries(allDates, allPays, win);
    if (!c.pays.length) return null;
    var dayMode = !!(win && win.start === win.end);
    var dayVal = c.pays[c.pays.length - 1] || 0;
    var early = mean(c.pays.slice(0, 3));
    var late = mean(c.pays.slice(-3));
    var chg, cls;
    if (dayMode) {
      // 找 win.start 前一天的全价数据，作为"日变动"基准
      var prevVal = 0;
      if (win && win.start) {
        var dd = new Date(win.start + "T00:00:00Z");
        dd.setUTCDate(dd.getUTCDate() - 1);
        var prevDay = dd.toISOString().slice(0, 10);
        var pi = allDates.indexOf(prevDay);
        if (pi >= 0) prevVal = allPays[pi] || 0;
      }
      if (prevVal > 0) {
        chg = (dayVal - prevVal) / prevVal * 100;
        cls = chg > 10 ? "riser" : chg < -10 ? "decliner" : "stable";
      } else {
        chg = 0; cls = "day";
      }
    } else {
      chg = early ? (late - early) / early * 100 : 0;
      cls = chg > 10 ? "riser" : chg < -10 ? "decliner" : "stable";
    }
    // 连涨/连跌天数（在窗口内序列上计算；单日窗口下始终为 0）
    var streak = 0, dir = 0;
    for (var j = c.pays.length - 1; j > 0; j--) {
      var d = c.pays[j] - c.pays[j - 1];
      if (d === 0) break;
      var nd = d > 0 ? 1 : -1;
      if (dir === 0) dir = nd;
      else if (nd !== dir) break;
      streak++;
    }
    return {
      name: name, platforms: platforms, pays: c.pays, dates: c.dates || [],
      avg: dayMode ? dayVal : mean(c.pays),
      latest: dayVal,
      early: early, late: late,
      chg: chg, cls: cls,
      streak: streak, dir: dir,
      dayMode: dayMode,
      dayVal: dayVal
    };
  }

  function buildScope(win) {
    if (scope === "全平台") {
      var merged = {};
      PLATFORMS.forEach(function (p) {
        var sec = raw.platforms[p]; if (!sec) return;
        sec.items.forEach(function (it) {
          if (!merged[it.name]) merged[it.name] = { pf: {}, byDate: {} };
          merged[it.name].pf[p] = 1;
          it.dates.forEach(function (d, i) { merged[it.name].byDate[d] = (merged[it.name].byDate[d] || 0) + (it.pays[i] || 0); });
        });
      });
      return Object.keys(merged).map(function (name) {
        var m = merged[name];
        var dates = Object.keys(m.byDate).sort();
        var pays = dates.map(function (d) { return m.byDate[d]; });
        return enrich(name, Object.keys(m.pf), dates, pays, win);
      });
    }
    var sec = raw.platforms[scope]; if (!sec) return [];
    return sec.items.map(function (it) {
      return enrich(it.name, [scope], it.dates, it.pays, win);
    });
  }

  function applyFilter(items) {
    if (filter === "全部") return items;
    var want = filter === "上升" ? "riser" : filter === "下滑" ? "decliner" : "stable";
    return items.filter(function (it) { return it.cls === want; });
  }


  function render() {
    // 高亮按钮
    document.getElementById("tabs").querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-scope") === scope);
    });
    document.getElementById("filters").querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-filter") === filter);
    });
    // 日期筛选条状态
    document.getElementById("dTabs").querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-dmode") === dMode);
    });
    var win = getWindow();
    var dayMode = !!(win && win.start === win.end);
    document.getElementById("dSingle").style.display = dMode === "day" ? "" : "none";
    document.getElementById("dRange").style.display = dMode === "custom" ? "" : "none";
    if (win) {
      document.getElementById("dCur").textContent = (dayMode ? "📆 " : "📆 ") + win.start + " ~ " + win.end;
    } else {
      document.getElementById("dCur").textContent = "";
    }

    var all = (buildScope(win) || []).filter(Boolean);
    all.sort(function (a, b) { return dayMode ? b.dayVal - a.dayVal : b.chg - a.chg; });
    try { window.__DIAG_ROWS = all; } catch (e) {}
    var items = applyFilter(all).slice().sort(function (a, b) {
      return dayMode ? b.dayVal - a.dayVal : a.chg - b.chg;
    });

    var risers = all.filter(function (it) { return it.cls === "riser"; }).length;
    var decliners = all.filter(function (it) { return it.cls === "decliner"; }).length;
    var stable = all.length - risers - decliners;
    var grand = all.reduce(function (s, it) { return s + it.avg * it.pays.length; }, 0);

    // 信号条（始终全量）
    var worst = all.length ? all[0] : null;            // 升序后首项是最大下滑 / 最低当日成交
    var best = all.length ? all[all.length - 1] : null; // 末项是最大上升 / 最高当日成交
    var worstDecl = all.filter(function (it) { return it.cls === "decliner"; }).sort(function (a, b) { return a.chg - b.chg; })[0];
    var topUp = all.filter(function (it) { return it.cls === "riser"; }).sort(function (a, b) { return b.chg - a.chg; })[0];
    var contDown = all.filter(function (it) { return it.cls === "decliner" && it.dir < 0 && it.streak >= 2; })
      .sort(function (a, b) { return b.streak - a.streak; })[0];

    var sig = '<div class="dots">'
      + '<span class="d"><span class="sw" style="background:#6b7280"></span>共 ' + all.length + ' 个' + ("产品") + '</span>';
    if (dayMode) {
      sig += '<span class="d"><span class="sw" style="background:#7c3aed"></span>当日成交合计 ' + fmtMoney(grand) + '</span>';
    } else {
      sig += '<span class="d"><span class="sw" style="background:#16a34a"></span>上升 ' + risers + '</span>'
        + '<span class="d"><span class="sw" style="background:#dc2626"></span>下滑 ' + decliners + '</span>'
        + '<span class="d"><span class="sw" style="background:#cbd5e1"></span>稳定 ' + stable + '</span>';
    }
    sig += '</div>';
    sig += '<div class="verdict">';
    if (dayMode) {
      if (best) sig += '当日成交最高：<span class="good">' + best.name + ' ' + fmtMoney(best.dayVal) + '</span>';
      if (worst && worst.dayVal > 0) sig += '　·　当日成交最低：<span class="warn">' + worst.name + ' ' + fmtMoney(worst.dayVal) + '</span>';
    } else {
      if (worstDecl) sig += '下滑最猛：<span class="warn">' + worstDecl.name + " " + fmtPct(worstDecl.chg) + '</span>（最新一日 ' + fmtMoney(worstDecl.latest) + '）';
      if (topUp) sig += '　·　上升最快：<span class="good">' + topUp.name + " " + fmtPct(topUp.chg) + '</span>';
      sig += '。';
      if (contDown) sig += '<div class="verdict"><span class="warn">⚠ ' + contDown.name + ' 已连跌 ' + contDown.streak + ' 天</span>，建议优先排查。</div>';
    }
    sig += '</div>';
    if (scope === "全平台") {
      var tm = all.filter(function (it) { return it.platforms.indexOf("天猫") >= 0; });
      var pd = all.filter(function (it) { return it.platforms.indexOf("拼多多") >= 0; });
      var unit = "产品";
      sig += '<div class="meta">全平台合并双平台成交 · 天猫覆盖 ' + tm.length + ' ' + unit + ' · 拼多多覆盖 ' + pd.length + ' ' + unit + '</div>';
    }
    document.getElementById("signal").innerHTML = sig;
    var ttlBase = "产品";
    document.getElementById("listTtl").textContent = (filter === "全部" ? ttlBase + "明细" : filter + ttlBase) + "（" + items.length + "）";

    // 列表
    var rows = items.map(function (it) {
      // 单日模式行：日成交 + vs 前一天变动% + 方向箭头（vs 前一日做基准）
      if (dayMode) {
        var hasPrev = it.cls !== "day";  // cls==="day" 表示前一天数据缺失
        var cls2 = hasPrev ? (it.cls === "riser" ? "up" : it.cls === "decliner" ? "down" : "flat") : "flat";
        var chgCell = hasPrev
              ? '<td class="num chg ' + cls2 + '">' + fmtPct(it.chg) + '</td>'
              : '<td class="num chg flat">—</td>';
        var dirCell = hasPrev
              ? '<td><span class="stk ' + cls2 + '">' + (it.chg > 0 ? '↑' : it.chg < 0 ? '↓' : '—') + '</span></td>'
              : '<td><span class="stk">—</span></td>';
        return '<tr>'
          + '<td class="nm">' + it.name + '</td>'
          + '<td class="num">' + fmtMoney(it.dayVal) + '</td>'
          + chgCell
          + dirCell
          + '</tr>';
      }
      var cls = it.cls === "riser" ? "up" : it.cls === "decliner" ? "down" : "flat";
      var stk = it.dir > 0 ? '<span class="stk up">↑' + it.streak + '</span>' : it.dir < 0 ? '<span class="stk down">↓' + it.streak + '</span>' : '<span class="stk">—</span>';
      var nmCellExtra = '';
      return '<tr class="' + cls + '">'
        + '<td class="nm">' + it.name + nmCellExtra + '</td>'
        + '<td class="num">' + fmtMoney(it.avg) + '</td>'
        + '<td class="num chg ' + cls + '">' + fmtPct(it.chg) + '</td>'
        + '<td>' + stk + '</td>'
        + '</tr>';
    }).join("");
    document.querySelector("#list tbody").innerHTML = rows || '<tr><td colspan="4" style="text-align:center;color:#9ca3af;padding:18px">暂无' + ("产品") + '</td></tr>';

    document.getElementById("sub").textContent = (dayMode ? "按当日成交排序 · " : "按成交额变动排序 · ")
      + "按产品" + " · " + scope + (filter === "全部" ? "" : " · " + filter);
    var firstTh = document.querySelector("#list thead tr th:first-child");
    if (firstTh) firstTh.textContent = "产品";
    var dateEl = document.getElementById("dataDate");
    // 用数据真实覆盖的最大日期（与 freshness-alert 一致），而不是 raw.updated 生成时间
    var realMax = ALL_DATES.length ? ALL_DATES[ALL_DATES.length - 1] : "";
    if (realMax) { dateEl.textContent = "数据日期 " + realMax; dateEl.style.display = ""; }
    else if (raw.updated) { dateEl.textContent = "数据日期 " + raw.updated.split(" ")[0]; dateEl.style.display = ""; }
    else { dateEl.style.display = "none"; }

    renderProfit(win);
    renderProductTrend(win, pfilter);
  }

  // 产品盈亏明细（数据来自 BI 销售报表 → trend-analysis.json profit 块，按天存储）
  function renderProfit(win) {
    var pd = raw.profit || {};
    // 跟随当前 scope：全平台合并各平台，单平台只取该平台
    var activePfs = scope === "全平台" ? Object.keys(pd) : (pd[scope] ? [scope] : []);
    var merged = {};
    var dateLbl = [];
    var pfTotalShip = {}, pfTotalProfit = {}, pfRate = {};
    activePfs.forEach(function (pf) {
      var sec = pd[pf]; if (!sec) return;
      // 收集窗口内的所有天（未选日期=该平台全部日期）；按产品跨天聚合
      var dayKeys = (sec.dates || []).filter(function (d) { return inWin(d, win); });
      if (!dayKeys.length) return;
      dateLbl.push(pf + " " + dayKeys[0] + (dayKeys.length > 1 ? "~" + dayKeys[dayKeys.length - 1] : ""));
      var ts = 0, tp = 0;
      dayKeys.forEach(function (d) {
        var day = sec.days[d]; if (!day) return;
        ts += day.total_ship || 0;
        tp += day.total_profit || 0;
        (day.items || []).forEach(function (it) {
          var k = it.product;
          if (!merged[k]) merged[k] = { product: k, ship: 0, profit: 0 };
          merged[k].ship += it.ship || 0;
          merged[k].profit += it.profit_amt || 0;
        });
      });
      pfTotalShip[pf] = ts;
      pfTotalProfit[pf] = tp;
      pfRate[pf] = ts ? tp / ts * 100 : 0;
    });
    // 利润率前端重算：profit/ship × 100，保证与同行的发货/利润自洽
    var list = Object.keys(merged).map(function (k) {
      var m = merged[k];
      return {
        product: m.product, ship: m.ship, profit: m.profit,
        margin: m.ship > 0 ? m.profit / m.ship * 100 : null
      };
    });

    // 产品筛选下拉：填充当前 scope 下全部产品名（去重排序），保留已选
    var sel = document.getElementById("pfilter");
    var names = list.map(function (it) { return it.product; })
      .filter(function (n, i, a) { return a.indexOf(n) === i; }).sort();
    if (pfilter && names.indexOf(pfilter) < 0) pfilter = "";  // 选项不存在则清空
    var opts = ['<option value="">全部产品</option>'].concat(
      names.map(function (n) { return '<option value="' + n + '"' + (n === pfilter ? " selected" : "") + ">" + n + "</option>"; })
    );
    sel.innerHTML = opts.join("");

    // 汇总 meta（scope 范围内总额）
    var metaShip = 0, metaProfit = 0;
    activePfs.forEach(function (pf) {
      metaShip += pfTotalShip[pf] || 0;
      metaProfit += pfTotalProfit[pf] || 0;
    });
    var metaRate = metaShip ? metaProfit / metaShip * 100 : 0;
    var metaTxt = '📊 数据日期 ' + (dateLbl.join(" · ") || "—")
      + '　<b>总发货 ' + fmtMoney(metaShip) + '</b>'
      + '　<b class="' + (metaProfit >= 0 ? "pm-up" : "pm-down") + '">总利润 ' + fmtMoney(metaProfit) + '</b>'
      + '　综合利润率 <b>' + (metaRate >= 0 ? "+" : "") + metaRate.toFixed(1) + '%</b>';

    // 按当前排序
    var order = psort;
    list.sort(function (a, b) {
      if (order === "margin") {
        var av = a.margin === null ? -1e9 : a.margin;
        var bv = b.margin === null ? -1e9 : b.margin;
        return bv - av;
      }
      if (order === "ship") return b.ship - a.ship;
      return b.profit - a.profit;
    });

    // 产品筛选：只保留匹配产品（空=全部）
    if (pfilter) list = list.filter(function (it) { return it.product === pfilter; });

    var totalProfit = metaProfit;
    var rows = list.map(function (it) {
      var loss = it.profit < 0;
      var rowCls = loss ? "loss" : "win";
      var mStr = it.margin === null ? "—" : '<span class="pmoney ' + (it.margin >= 0 ? "up" : "down") + '">' + (it.margin >= 0 ? "+" : "") + it.margin.toFixed(1) + "%</span>";
      var pStr = totalProfit !== 0 ? (it.profit / totalProfit * 100).toFixed(1) + "%" : "—";
      return '<tr class="' + rowCls + '">'
        + '<td class="nm">' + it.product + '</td>'
        + '<td class="num">' + fmtMoney(it.ship) + '</td>'
        + '<td class="num pmoney ' + (loss ? "down" : "up") + '">' + fmtMoney(it.profit) + '</td>'
        + '<td class="num">' + mStr + '</td>'
        + '<td class="num">' + pStr + '</td>'
        + '</tr>';
    }).join("");
    document.querySelector("#plist tbody").innerHTML = rows || '<tr><td colspan="5" style="text-align:center;color:#9ca3af;padding:18px">暂无盈亏数据</td></tr>';
    document.getElementById("profitMeta").innerHTML = metaTxt;
    document.getElementById("profitHint").textContent = "数据来源：BI 销售报表 · 零售销售报表 Base · " + scope + " · 红色为亏损";

    document.getElementById("profitSort").querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-psort") === psort);
    });
  }

  // 单产品每日序列：发货额（销售）/利润额/支付额，跟随 scope 与日期窗口
  function getProductDailySeries(name, win) {
    var shipByDate = {}, profitByDate = {}, payByDate = {};
    // 发货额 & 利润额：来自 raw.profit 按天明细
    var pfs = scope === "全平台" ? Object.keys(raw.profit || {}) : (raw.profit && raw.profit[scope] ? [scope] : []);
    pfs.forEach(function (pf) {
      var sec = raw.profit && raw.profit[pf]; if (!sec) return;
      (sec.dates || []).forEach(function (d) {
        if (!inWin(d, win)) return;
        var day = sec.days[d]; if (!day) return;
        (day.items || []).forEach(function (it) {
          if (it.product !== name) return;
          shipByDate[d] = (shipByDate[d] || 0) + (it.ship || 0);
          profitByDate[d] = (profitByDate[d] || 0) + (it.profit_amt || 0);
        });
      });
    });
    // 支付额（销售趋势）：来自 raw.platforms 按天 pays
    var pfs2 = scope === "全平台" ? PLATFORMS : (raw.platforms[scope] ? [scope] : []);
    pfs2.forEach(function (pf) {
      var sec = raw.platforms[pf]; if (!sec) return;
      sec.items.forEach(function (it) {
        if (it.name !== name) return;
        it.dates.forEach(function (d, i) {
          if (!inWin(d, win)) return;
          payByDate[d] = (payByDate[d] || 0) + (it.pays[i] || 0);
        });
      });
    });
    var set = {};
    Object.keys(shipByDate).concat(Object.keys(profitByDate), Object.keys(payByDate)).forEach(function (d) { set[d] = 1; });
    var dates = Object.keys(set).sort();
    return {
      dates: dates,
      ship: dates.map(function (d) { return shipByDate[d] || 0; }),
      profit: dates.map(function (d) { return profitByDate[d] || 0; }),
      pay: dates.map(function (d) { return payByDate[d] || 0; })
    };
  }

  // 渲染单产品趋势卡片（SVG 折线 + 每日明细表）
  function renderProductTrend(win, product) {
    var card = document.getElementById("ptrendCard");
    if (!product) { card.style.display = "none"; return; }
    document.getElementById("ptrendTtl").textContent = product + " · 每日趋势";
    var s = getProductDailySeries(product, win);
    if (!s || !s.dates.length) {
      card.style.display = "";
      document.getElementById("ptrendHint").textContent = "";
      document.getElementById("ptrendBody").innerHTML = '<div style="padding:18px;text-align:center;color:#9ca3af;font-size:13px">当前日期窗口内无「' + product + '」的每日数据</div>';
      return;
    }
    card.style.display = "";
    var tShip = s.ship.reduce(function (a, b) { return a + b; }, 0);
    var tProfit = s.profit.reduce(function (a, b) { return a + b; }, 0);
    var tPay = s.pay.reduce(function (a, b) { return a + b; }, 0);
    document.getElementById("ptrendHint").innerHTML =
      '发货额合计 <b>' + fmtMoney(tShip) + '</b>　利润额合计 <b class="' + (tProfit >= 0 ? "pm-up" : "pm-down") + '">' + fmtMoney(tProfit) + '</b>　支付额合计 <b>' + fmtMoney(tPay) + '</b>';

    var W = 860, H = 240, padL = 52, padR = 16, padT = 16, padB = 30;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var n = s.dates.length;
    var allV = s.ship.concat(s.profit);
    var min = Math.min.apply(null, allV), max = Math.max.apply(null, allV);
    if (min === max) { max = min + 1; min = min - 1; }
    var padv = (max - min) * 0.12; max += padv; min -= padv;
    function X(i) { return n > 1 ? padL + plotW * i / (n - 1) : padL + plotW / 2; }
    function Y(v) { return padT + plotH * (1 - (v - min) / (max - min)); }
    var shipPts = s.ship.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ");
    var profitPts = s.profit.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ");
    var grid = "";
    [min, (min + max) / 2, max].forEach(function (gv) {
      var gy = Y(gv).toFixed(1);
      grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="#eef0f3" stroke-width="1"/>';
      grid += '<text x="' + (padL - 6) + '" y="' + (parseFloat(gy) + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#9ca3af">' + fmtMoney(gv) + '</text>';
    });
    var xlab = "";
    [0, Math.floor((n - 1) / 2), n - 1].filter(function (v, i, a) { return a.indexOf(v) === i; }).forEach(function (idx) {
      xlab += '<text x="' + X(idx).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="10" fill="#9ca3af">' + s.dates[idx].slice(5) + '</text>';
    });
    var shipDots = s.ship.map(function (v, i) { return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="2.5" fill="#7c3aed"/>'; }).join("");
    var profitDots = s.profit.map(function (v, i) { return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="2.5" fill="' + (v >= 0 ? "#16a34a" : "#dc2626") + '"/>'; }).join("");
    var singleNote = n === 1
      ? '<text x="' + X(0).toFixed(1) + '" y="' + (Y(s.ship[0]) - 10).toFixed(1) + '" text-anchor="middle" font-size="11" fill="#7c3aed">发货 ' + fmtMoney(s.ship[0]) + '</text>'
        + '<text x="' + X(0).toFixed(1) + '" y="' + (Y(s.profit[0]) + 16).toFixed(1) + '" text-anchor="middle" font-size="11" fill="#16a34a">利润 ' + fmtMoney(s.profit[0]) + '</text>'
      : "";
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block">'
      + grid + xlab
      + '<polyline points="' + shipPts + '" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/>'
      + '<polyline points="' + profitPts + '" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round"/>'
      + shipDots + profitDots + singleNote
      + '</svg>';
    var legend = '<div style="display:flex;gap:18px;font-size:12px;margin:4px 0 6px;flex-wrap:wrap">'
      + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:3px;background:#7c3aed;display:inline-block;border-radius:2px"></span>每日发货额（销售）</span>'
      + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:3px;background:#16a34a;display:inline-block;border-radius:2px"></span>每日利润额</span>'
      + '</div>';
    var rows = s.dates.map(function (d, i) {
      var m = s.ship[i] > 0 ? s.profit[i] / s.ship[i] * 100 : null;
      var mStr = m === null ? "—" : (m >= 0 ? "+" : "") + m.toFixed(1) + "%";
      return '<tr>'
        + '<td>' + d + '</td>'
        + '<td class="num">' + fmtMoney(s.ship[i]) + '</td>'
        + '<td class="num pmoney ' + (s.profit[i] >= 0 ? "up" : "down") + '">' + fmtMoney(s.profit[i]) + '</td>'
        + '<td class="num">' + mStr + '</td>'
        + '</tr>';
    }).join("");
    var tbl = '<table style="margin-top:8px"><thead><tr><th>日期</th><th class="num">发货额</th><th class="num">利润额</th><th class="num">利润率</th></tr></thead><tbody>' + rows + '</tbody></table>';
    document.getElementById("ptrendBody").innerHTML = legend + svg + tbl;
  }

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    scope = b.getAttribute("data-scope"); render();
  });
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    filter = b.getAttribute("data-filter"); render();
  });
  document.getElementById("profitSort").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    psort = b.getAttribute("data-psort"); render();
  });
  document.getElementById("pfilter").addEventListener("change", function (e) {
    pfilter = e.target.value; render();
  });

  // 日期筛选事件
  document.getElementById("dTabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    dMode = b.getAttribute("data-dmode");
    render();
  });
  document.getElementById("dSingle").addEventListener("change", function (e) {
    dSingle = e.target.value; render();
  });
  document.getElementById("dFrom").addEventListener("change", function (e) {
    dFrom = e.target.value;
    if (dTo && dFrom > dTo) { dTo = ""; document.getElementById("dTo").value = ""; }
    render();
  });
  document.getElementById("dTo").addEventListener("change", function (e) {
    dTo = e.target.value;
    if (dFrom && dTo < dFrom) { dFrom = ""; document.getElementById("dFrom").value = ""; }
    render();
  });

  document.getElementById("foot").textContent = "数据更新：" + (raw.updated || "—") + " · 来源：BI 销售报表（零售销售报表 Base）";

  // 初始化日期范围与 input 默认值
  (function initDates() {
    var allD = [];
    PLATFORMS.forEach(function (p) {
      var sec = raw.platforms[p]; if (!sec) return;
      sec.items.forEach(function (it) { (it.dates || []).forEach(function (d) { allD.push(d); }); });
    });
    allD.sort();
    ALL_DATES = allD;
    if (allD.length) {
      RANGE_MIN = allD[0];
      RANGE_MAX = allD[allD.length - 1];
      dSingle = RANGE_MAX;
      dFrom = RANGE_MIN;
      dTo = RANGE_MAX;
      document.getElementById("dSingle").value = RANGE_MAX;
      document.getElementById("dSingle").min = RANGE_MIN;
      document.getElementById("dSingle").max = RANGE_MAX;
      document.getElementById("dFrom").value = RANGE_MIN;
      document.getElementById("dFrom").min = RANGE_MIN;
      document.getElementById("dFrom").max = RANGE_MAX;
      document.getElementById("dTo").value = RANGE_MAX;
      document.getElementById("dTo").min = RANGE_MIN;
      document.getElementById("dTo").max = RANGE_MAX;
      document.getElementById("dTip").textContent = "数据范围 " + RANGE_MIN + " ~ " + RANGE_MAX;
    }
  })();

  // 深度链接：从首页诊断卡片直达具体下滑品类/产品
  function applyCategoryFocus(focus) {
    if (!focus) return;
    if (focus.scope && (focus.scope === '全平台' || focus.scope === '天猫' || focus.scope === '拼多多')) scope = focus.scope;
    if (focus.filter && ['全部', '上升', '下滑', '稳定'].indexOf(focus.filter) >= 0) filter = focus.filter;
    if (focus.dMode && ['all', '7d', 'yesterday', 'day', 'custom'].indexOf(focus.dMode) >= 0) dMode = focus.dMode;
    if (focus.keyword) pfilter = focus.keyword;
    render();
    if (focus.keyword) {
      setTimeout(function () { if (typeof DeepLink !== 'undefined') DeepLink.highlight('#list', focus.keyword); }, 300);
    }
  }
  if (typeof DeepLink !== 'undefined') {
    var _cf = DeepLink.read();
    if (_cf && _cf.board === 'category-analysis') applyCategoryFocus(_cf);
  }

  render();
})();
</script>
<script>
  // 诊断功能
  if (window.DIAG) {
    window.addEventListener('load', function () {
      DIAG.attachFloat({ boardId: 'category-analysis', title: '品类分析', getRows: function () { return window.__DIAG_ROWS || []; } });
    });
  }
</script>
</body>
</html>
